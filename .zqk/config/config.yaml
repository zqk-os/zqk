# ZQK Project Configuration
# Project: zqk-public-candidate
# Template: standard
# Generated by: zcom system init

project:
  name: zqk-public-candidate
  template: standard

# Pressure-test SKU: brand.executable_name is the live CLI (canonical token is zqk).
# TRACK: TDE-1789678536875854000-47240146 — set executable_name: zqk at public launch.
brand:
  executable_name: zcom
  product_name: ZQK Community

storage:
  backend: file
  data_dir: .zqk/process

logging:
  profile: human
  level: info
  # error_log_output: combined  # combined | separate (for log capture: single stream vs stdout/stderr to separate files)

cache:
  enabled: true
  ttl_seconds: 3600

# Fail-fast validation budgets. Healthy objects finish in ms; multi-second
# kind_overrides hide lock contention. Prefer fixing stalls over raising budgets.
validation:
  per_object_timeout:
    default_seconds: 5
    kind_overrides: {}
  stuck_timeout_seconds: 30
