$schema: "../../schemas/command_spec.schema.json"

name: "draft"
short: "Object draft-plane operations (enumerate / sweep / promote)"
description: |
  Operate on lifecycle-preliminary objects parked under .zqk/object_drafts/
  (not visible to object list/count). Subcommands: sweep (delete drafts),
  promote (materialize to CAS) — see CAS create membrane docs.

args:
  type: "no_args"

help:
  examples:
    - comment: "Dry-run sweep all draft-plane objects"
      command: "%s object draft sweep --dry-run --all"
    - comment: "Dry-run promote all draft-plane objects"
      command: "%s object draft promote --dry-run --all"
    - comment: "Sweep draft backlog items older than 7d"
      command: "%s object draft sweep --kind backlog_item --older-than 168h --all"
  exclude_flags:
    - "columns"
    - "ignore-scheduler-down"

run_e: ""
common_flags: true
