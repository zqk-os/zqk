$schema: "../../../schemas/command_spec.schema.json"

name: "remove"
short: "Remove backlog item association(s) from a priority plan"
description: |
  Removes one or more backlog items from a priority plan by clearing each backlog item's priority_plan_ref.

  Note: Priority plan membership is child-owned on BLI.priority_plan_ref.
  This command is a convenience shortcut for 'zqk object ref remove <bli_id> <plan_id>'.
  For general reference management across all objects, use 'zqk object ref remove'.

args:
  type: "minimum"
  min: 2

flags:
  - name: "park"
    type: "bool"
    default: false
    description: "Park the priority plan (transition to paused) if remaining open items reach zero instead of auto-completing"

help:
  examples:
    - comment: "Remove backlog item from plan"
      command: "%s pplan remove [REDACTED-ID] [REDACTED-ID]"
    - comment: "Remove multiple backlog items from plan"
      command: "%s pplan remove [REDACTED-ID] [REDACTED-ID] [REDACTED-ID]"
    - comment: "Alternative positional syntax"
      command: "%s pplan [REDACTED-ID] remove [REDACTED-ID]"

common_flags: true
