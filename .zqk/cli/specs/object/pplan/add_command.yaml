$schema: "../../../schemas/command_spec.schema.json"

name: "add"
short: "Add backlog item(s) to a priority plan (child-owned priority_plan_ref)"
description: |
  Associates one or more backlog items with a priority plan by updating each backlog item's priority_plan_ref.

  Note: Priority plan membership is child-owned on BLI.priority_plan_ref.
  This command is a convenience shortcut for 'zqk object ref add <bli_id> <plan_id>'.
  For general reference management across all objects, use 'zqk object ref add'.

args:
  type: "minimum"
  min: 2

flags:
  - name: "override"
    type: "bool"
    default: false
    description: "Override scope-lock on sealed (active/in-progress) priority plans"
  - name: "force"
    type: "bool"
    default: false
    description: "Force association (alias for override)"
  - name: "reason-code"
    type: "string"
    default: ""
    description: "Reason code required when using --override on sealed priority plan"

help:
  examples:
    - comment: "Add backlog item to plan"
      command: "%s pplan add [REDACTED-ID] [REDACTED-ID]"
    - comment: "Add multiple backlog items to plan"
      command: "%s pplan add [REDACTED-ID] [REDACTED-ID] [REDACTED-ID]"
    - comment: "Alternative positional syntax"
      command: "%s pplan [REDACTED-ID] add [REDACTED-ID]"

common_flags: true
