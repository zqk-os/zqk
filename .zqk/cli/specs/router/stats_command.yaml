$schema: ../_schemas/command_spec.schema.json
name: stats
short: Display ambient gradient router telemetry and statistics
description: |
  Outputs point-in-time metrics on model gradient dispatch, tool calls, routes chosen, and bypass reasons.
flags:
  - name: format
    shorthand: f
    type: string
    default: "json"
    description: "Output format (json, text)"
help:
  examples:
    - comment: "View router runtime statistics"
      command: "%s router stats"
    - comment: "View statistics in text format"
      command: "%s router stats -f text"
common_flags: true
requires_storage: false
requires_session: false
requires_scheduler_check: false
