$schema: "../schemas/command_spec.schema.json"

name: "identify-parallel"
short: "Analyze Go tests for safe t.Parallel() adoption"
description: >
  Scans Go test files across the repository using AST analysis to identify tests
  that can safely adopt t.Parallel(). Detects isolation markers (t.TempDir) and
  race hazards (t.Setenv, unisolated global state).

aliases:
  - "parallel-audit"

args:
  type: "minimum"
  min: 0

flags:
  - name: "path"
    type: "string"
    default: "."
    description: "Path prefix or directory to analyze"
  - name: "safe-only"
    type: "bool"
    default: false
    description: "Only display tests identified as safe for parallel execution"
  - name: "unsafe-only"
    type: "bool"
    default: false
    description: "Only display tests with parallel hazards (e.g. t.Setenv)"

help:
  examples:
    - comment: "Scan the entire repository for parallel test safety"
      command: "%s test identify-parallel"
    - comment: "Scan a specific package for safe parallel candidates"
      command: "%s test identify-parallel --path=pkg/storage --safe-only"
    - comment: "Output results as JSON"
      command: "%s test identify-parallel --format=json"

run_e: "runIdentifyParallel"
common_flags: true
requires_storage: false
requires_session: false
requires_scheduler_check: false
