$schema: "../schemas/command_spec.schema.json"

name: "command-spec <command-path>"
short: "Create canonical file-authored CLI command DNA"
description: |
  Writes a new command specification beneath the canonical `.zqk/cli/specs` tree.
  The command path determines the destination: `system/check-foo` writes
  `.zqk/cli/specs/system/check_foo_command.yaml`.

  command_spec process objects are not an authoring source. This veneer writes
  file DNA directly so command creation cannot split across CAS and file specs.

args:
  type: "exact"
  count: 1

flags:
  - name: "use"
    type: "string"
    default: ""
    description: "Command use string; defaults to the final command-path segment"
  - name: "short"
    type: "string"
    default: ""
    description: "One-line command summary"
  - name: "description"
    type: "string"
    default: ""
    description: "Long command description"
  - name: "from-cmd"
    type: "bool"
    default: false
    description: "Introspect registered Cobra command tree to extract flags, args, and usage"
  - name: "aliases"
    type: "string"
    default: ""
    description: "Comma-separated command aliases"
  - name: "args-type"
    type: "string"
    default: ""
    description: "Positional argument validation type: no_args, exact, minimum, maximum, range"
  - name: "args-count"
    type: "int"
    default: 0
    description: "Argument count for exact args"
  - name: "args-min"
    type: "int"
    default: 0
    description: "Minimum argument count"
  - name: "args-max"
    type: "int"
    default: 0
    description: "Maximum argument count"
  - name: "flag"
    type: "string_array"
    description: "Custom flag definition (name:type:default:description[:shorthand])"
  - name: "example"
    type: "string_array"
    description: "Help example in comment:command format"
  - name: "run-e"
    type: "string"
    default: ""
    description: "RunE execution function name"
  - name: "common-flags"
    type: "bool"
    default: true
    description: "Include standard common flags in the spec"
  - name: "async"
    type: "bool"
    default: false
    description: "Wrap RunE with BindAsyncProgress"
  - name: "force"
    type: "bool"
    default: false
    description: "Replace an existing command spec at the canonical path"

help:
  examples:
    - comment: "Introspect registered command to generate a full canonical spec"
      command: "%s new command-spec state/tree --from-cmd"
    - comment: "Create rich DNA for a command with explicit args, flags, and examples"
      command: "%s new command-spec system/check-foo --short \"Check foo\" --description \"Validate foo state.\" --args-type no_args"
  exclude_flags:
    - "columns"
    - "ignore-scheduler-down"

run_e: "runNewCommandSpec"
common_flags: true
requires_storage: false
requires_session: false
requires_scheduler_check: false
