$schema: "../schemas/command_spec.schema.json"

name: "print-cursor-paste-applescript"
short: "Print AppleScript for agent chat paste (same as --paste-cursor; honors ZQK_CURSOR_PASTE_PREFIX_STEPS)"
description: |
  Prints the AppleScript used by `zqk scheduler convergence measure --format agent-prompt --paste-cursor`.
  Respects `ZQK_CURSOR_PASTE_PREFIX_STEPS`; default tokens: cmd_shift_e, escape, option_cmd_e, option_cmd_e.

  For shell: `zqk scheduler print-cursor-paste-applescript | osascript -`

help:
  examples:
    - comment: "Pipe generated script to osascript"
      command: "%s scheduler print-cursor-paste-applescript | osascript -"
  exclude_flags:
    - "format"
    - "output"
    - "verbose"
    - "quiet"
    - "timeout"
    - "columns"

common_flags: true
requires_session: false
requires_scheduler_check: false

run_e: "runPrintCursorPasteApplescript"
