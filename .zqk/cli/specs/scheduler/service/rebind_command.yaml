$schema: "../../schemas/command_spec.schema.json"

name: "rebind"
short: "Update abs_root for an existing root_id (path rename/move)"
flags:
  - name: "root-id"
    type: "string"
    default: ""
    description: "Stable root_id from the host registry"
  - name: "new-path"
    type: "string"
    default: ""
    description: "New absolute or relative project path"
help:
  examples:
    - comment: "Rebind after directory move"
      command: "%s scheduler service rebind --root-id <id> --new-path /new/path"
  exclude_flags: ["format", "output", "verbose", "quiet", "timeout", "columns"]
run_e: "runSchedulerServiceRebind"
common_flags: false
requires_storage: false
requires_session: false
requires_scheduler_check: false
