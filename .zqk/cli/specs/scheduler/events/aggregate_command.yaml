$schema: "../../schemas/command_spec.schema.json"

name: "aggregate"
short: "Aggregate diagnostics.jsonl into scheduler-metrics-summary.json"
description: |
  Reads .zqk/scheduler/diagnostics.jsonl (JSONL), aggregates job execution events
  (completed/failed, duration), and writes .zqk/scheduler/scheduler-metrics-summary.json.
  Use this periodically (e.g. via a scheduler job) to keep a summary for performance
  analysis and reporting. See docs/archive/system_health/SCHEDULER_EVENTS_AND_METRICS.md.

help:
  examples:
    - comment: "Aggregate scheduler events into metrics summary"
      command: "%s scheduler events aggregate"
  exclude_flags:
    - "format"
    - "output"
    - "verbose"
    - "quiet"
    - "timeout"
    - "columns"

run_e: "runEventsAggregate"
async: true
common_flags: true
