$schema: "../schemas/command_spec.schema.json"

name: "events"
short: "Scheduler events (health view over metrics summary)"
description: |
  Commands for viewing scheduler events and health. The health subcommand shows
  a health view over scheduler-metrics-summary (failures and slow jobs). The
  summary is updated automatically by the SCH-evag timer job.

help:
  exclude_flags:
    - "format"
    - "output"
    - "verbose"
    - "quiet"
    - "timeout"
    - "columns"

common_flags: false
