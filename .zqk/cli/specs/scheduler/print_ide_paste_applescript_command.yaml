$schema: ../_schemas/command_spec.schema.json
name: print-ide-paste-applescript
short: Print AppleScript for agent chat paste (same as --paste-ide; honors ZQK_CURSOR_PASTE_PREFIX_STEPS)
description: |-
    Prints the AppleScript used by `zqk scheduler convergence measure --format
    agent-prompt --paste-ide`.

    Respects `ZQK_CURSOR_PASTE_PREFIX_STEPS`; default tokens: cmd_shift_e, escape,
    option_cmd_e, option_cmd_e.



    For shell: `zqk scheduler print-ide-paste-applescript | osascript -`

      Pipe generated script to osascript
      zqk scheduler print-ide-paste-applescript | osascript -
