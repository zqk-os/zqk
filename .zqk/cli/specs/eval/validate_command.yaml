$schema: ../_schemas/command_spec.schema.json
name: validate
short: Validate an eval template specification against schema rules
description: |
  Performs strict schema and semantic validation of an eval template, verifying
  dimension weights, threshold ranges (1.0-5.0), target patterns, and fast-path rules.
flags:
  - name: file
    shorthand: ""
    type: string
    default: ""
    required: true
    description: "Path to eval template YAML file"
help:
  examples:
    - comment: Validate an eval template
      command: "%s eval validate --file ./eval_template.yaml"
common_flags: false
requires_storage: false
requires_session: false
requires_scheduler_check: false
