$schema: schemas/command_spec.schema.json
name: autopilot
aliases:
    - pilot
    - auto-converge
short: Turnkey autonomous swarm execution and end-to-end multi-agent convergence loop
description: Autonomously federates local zero-egress models, discovers ready priority plans, orchestrates multi-agent swarms, executes AST-verified TDD implementations, and certifies DoD gates.
args:
    type: maximum
    count: 1
flags:
    - name: intent
      type: string
      default: ""
      description: Natural language intent or task brief for autonomous objectification and execution
    - name: plan-id
      type: string
      default: ""
      description: Target priority plan identifier (defaults to whats-next active or grooming plan)
    - name: model
      type: string
      default: ""
      description: Explicit model target or local engine override (e.g. local:llama-3-8b, ollama:qwen)
    - name: budget-tokens
      type: int
      default: "50000"
      description: Maximum token expenditure allowance for the convergence session
    - name: verify
      type: bool
      default: "true"
      description: Enforce fail-closed DoD criteria verification and cryptographic QA certification
    - name: dry-run
      type: bool
      default: "false"
      description: Simulate task federation, engine binding, and prompt execution without storage mutations
help:
    examples:
        - comment: Run turnkey autopilot on current whats-next plan with local zero-egress harvester
          command: zqk autopilot
        - comment: Run autopilot against a specific initializing intent
          command: 'zqk autopilot --intent "Add automated webhook push notifications for CI stages"'
        - comment: Execute dry-run with token budget
          command: zqk autopilot --plan-id PRI-105 --budget-tokens 25000 --dry-run
run_e: runAutopilot
common_flags: true
