$schema: "../schemas/command_spec.schema.json"

name: "scoreboard"
short: "Show the agent scoreboard"
description: |
  Summarizes agent throughput and task outcomes for the current kernel.

args:
  type: "no_args"

help:
  examples:
    - comment: "Print the scoreboard"
      command: "%s agent scoreboard"
    - comment: "JSON scoreboard"
      command: "%s agent scoreboard --format json"
  exclude_flags:
    - "columns"
    - "ignore-scheduler-down"

common_flags: true
