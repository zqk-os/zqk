$schema: "../schemas/command_spec.schema.json"

name: "ack"
short: "Append a peer_ack for a prior feed event"
description: |
  Records cognitive peer acknowledgment (not kernel_ack). Use after reading an
  ATTN / steer addressed to this seat. Prefer discovering unacked inbox via
  `workflow whats-next --persona-id … --agent-id …`.

flags:
  - name: "in-reply-to"
    type: "string"
    default: ""
    required: true
    description: "Parent event_id (AFE-*) to acknowledge"
  - name: "agent-id"
    type: "string"
    default: ""
    required: true
    description: "This swarm seat id (acking agent)"
  - name: "persona-ref"
    type: "string"
    default: ""
    required: true
    description: "Kernel persona id (PER-*) for this seat"
  - name: "summary"
    shorthand: "s"
    type: "string"
    default: ""
    description: "Optional ack message (default PEER_ACK — received <id>)"

args:
  type: "no_args"

help:
  examples:
    - comment: "Ack a steer after whats-next shows inbox_unacked"
      command: "%s feed ack --in-reply-to AFE-123 --agent-id peer-agent-1 --persona-ref PER-DEFAULT-AGENT"
  exclude_flags:
    - "columns"
    - "ignore-scheduler-down"

run_e: "runFeedAck"
common_flags: true
