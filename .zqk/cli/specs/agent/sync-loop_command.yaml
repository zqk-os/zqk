$schema: "../schemas/command_spec.schema.json"

name: "sync-loop"
short: "Run a sync-loop worker that executes an agent_task via the configured LLM"
description: |
  Spawns a graph-state sync-loop that executes an agent_task through the
  configured LLM provider. Adapters are selected at runtime; this command
  does not bind to a specific inference vendor.

args:
  type: "maximum"
  max: 1

help:
  examples:
    - comment: "Start the sync-loop worker"
      command: "%s agent sync-loop <task-id>"
    - comment: "JSON worker result"
      command: "%s agent sync-loop <task-id> --format json"
  exclude_flags:
    - "columns"
    - "ignore-scheduler-down"

common_flags: true
