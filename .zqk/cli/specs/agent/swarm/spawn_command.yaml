$schema: ../../schemas/command_spec.schema.json
name: spawn
short: Direct cell swarm provisioning via team_configuration archetypes
description: Dynamically provisions persona pods based on cell archetypes (neuron, muscle, heart, lungs) and attaches priority plans.
args:
    type: maximum
    count: 0
flags:
    - name: team-config
      type: string
      default: ""
      description: Target team_configuration (TCFG-*) object identifier
    - name: plan
      type: string
      default: ""
      description: Priority plan (PRI-*) identifier to scope and attach
help:
    examples:
        - comment: Spawn muscle cell swarm for tactical execution
          command: "%s agent swarm spawn --team-config TCFG-CORE-TACTICAL"
        - comment: Spawn neuron cell swarm attached to priority plan
          command: "%s agent swarm spawn --team-config TCFG-CORE-STRATEGIC --plan PRI-001"
run_e: runSpawn
common_flags: true
