$schema: "../schemas/command_spec.schema.json"

name: "next [task_id]"
short: "Push an agent task to its next lifecycle state"
description: |
  Evaluates the task and advances it via auto-transitions (for example to
  pending_verification). On validation failure the default action is wake so
  the worker is not left idle.

flags:
  - name: "on-validation-failure"
    type: "string"
    default: "wake"
    description: "Action if validation fails (wake is required; none/off are refused)"

args:
  type: "maximum"
  count: 1

help:
  examples:
    - comment: "Advance a finished task and wake on validation failure"
      command: "%s agent next <task-id> --on-validation-failure wake"
    - comment: "Advance with JSON result"
      command: "%s agent next <task-id> --format json"
  exclude_flags:
    - "columns"
    - "ignore-scheduler-down"

common_flags: true
