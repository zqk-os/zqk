$schema: "../schemas/command_spec.schema.json"

name: "guiding-step"
short: "Emit the kernel pong (guiding step) for an activity event"
description: |
  Agent-kernel ping-pong: classify an activity and return the next coherent
  guiding step from persona-bound interaction policies (catalog defaults if
  the persona has no POL refs). Empty next-step is a kernel hole; this command
  is the pong. Dead bus is a comms-remedy event, not silence.

flags:
  - name: "event"
    type: "string"
    default: ""
    description: "Event class (go_test, git_commit, idle, comms_fail, ...)"
  - name: "shell"
    type: "string"
    default: ""
    description: "Shell command to classify when --event is omitted"
  - name: "persona-ref"
    type: "string"
    default: ""
    description: "Seated persona (PER-*). Empty uses catalog defaults"

args:
  type: "no_args"

help:
  examples:
    - comment: "Classify a test command"
      command: "%s agent guiding-step --shell 'go test ./pkg/foo -timeout 30s'"
    - comment: "TPM idle pong"
      command: "%s agent guiding-step --event idle --persona-ref PER-DEFAULT-OPERATOR"
  exclude_flags:
    - "columns"
    - "ignore-scheduler-down"

run_e: "runAgentGuidingStep"
common_flags: true
