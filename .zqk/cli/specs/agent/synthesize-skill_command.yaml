$schema: "../schemas/command_spec.schema.json"

name: "synthesize-skill"
short: "Synthesize an agent skill from kernel context"
description: |
  Generates or refreshes an agent_skill placeholder from seated kernel
  context. Does not invent a system account.

args:
  type: "no_args"

help:
  examples:
    - comment: "Synthesize a skill from current kernel context"
      command: "%s agent synthesize-skill"
    - comment: "JSON result"
      command: "%s agent synthesize-skill --format json"
  exclude_flags:
    - "columns"
    - "ignore-scheduler-down"

common_flags: true
