$schema: ../../schemas/command_spec.schema.json
name: continuation
aliases:
  - anti-idle
  - stop
short: Vendor-agnostic lifecycle continuation hook preventing premature agent halting
description: |
  Vendor-agnostic lifecycle continuation hook preventing premature agent halting
  when autonomous progression loop is active.
flags:
  - name: vendor
    type: string
    default: "antigravity"
    description: "Target agent host vendor format (antigravity, generic)"
  - name: marker
    type: string
    default: ""
    description: "Path to the autonomous cap loop active marker file"
  - name: agent-id
    type: string
    default: ""
    description: "Target seat agent ID to inspect pending steering feed"
  - name: persona-ref
    type: string
    default: ""
    description: "Target seat persona ref to inspect pending steering feed"
args:
  type: no_args
help:
  examples:
    - comment: Run agent hook continuation
      command: '%s agent hook continuation --vendor antigravity'
run_e: runAgentHookContinuation
common_flags: true
