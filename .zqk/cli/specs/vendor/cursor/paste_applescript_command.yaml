$schema: "../../../schemas/command_spec.schema.json"

name: "paste-applescript"
short: "Print AppleScript for Cursor chat paste automation"
description: |
  Prints the AppleScript used for Cursor IDE prompt paste automation.
  Respects ZQK_CURSOR_PASTE_PREFIX_STEPS.

  For shell: `zqk vendor cursor paste-applescript | osascript -`

help:
  examples:
    - comment: "Pipe generated script to osascript"
      command: "%s vendor cursor paste-applescript | osascript -"
  exclude_flags:
    - "format"
    - "output"
    - "verbose"
    - "quiet"
    - "timeout"
    - "columns"

common_flags: true
requires_session: false
requires_scheduler_check: false

run_e: "runCursorPasteApplescript"
