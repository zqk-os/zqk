$schema: "../../../schemas/command_spec.schema.json"

name: "adapter"
short: "Cursor-specific MCP adapter (stdio ↔ daemon)"
description: |
  Speaks a clean full MCP contract on stdio for Cursor while privately
  maintaining keepalive, reconnect, and event subscription against the TCP
  MCP daemon.

flags:
  - name: "tcp"
    type: "string"
    default: "127.0.0.1:8443"
    description: "TCP address of the underlying MCP daemon"

args:
  type: "no_args"

help:
  examples:
    - comment: "Cursor entrypoint (default daemon)"
      command: "%s vendor cursor adapter --tcp 127.0.0.1:8443"
  exclude_flags:
    - "columns"
    - "ignore-scheduler-down"
    - "format"
    - "output"

run_e: "runCursorAdapter"
common_flags: true
requires_session: false
