$schema: schemas/command_spec.schema.json
name: query
short: Execute declarative ZPARQL graph queries
description: |
  Execute declarative graph queries across the knowledge kernel using the ZPARQL
  graph pattern matching and relational traversal engine with cycle safety and
  predicate pushdown.
aliases:
  - zparql
args:
  type: maximum
  max: 1
flags:
  - name: file
    shorthand: "f"
    type: string
    default: ""
    description: Path to file containing ZPARQL query
  - name: format
    type: string
    default: "table"
    description: Output format (table, json)
help:
  examples:
    - comment: "Find all planned backlog items"
      command: "%s query \"MATCH (b:backlog_item) WHERE b.status == 'planned' RETURN b.id, b.title;\""
    - comment: "Multi-hop plan and criteria traversal"
      command: "%s query \"MATCH (p:priority_plan)-[:items]->(b:backlog_item)-[:criteria_refs]->(c:criteria) RETURN p.title AS plan, b.id AS bli, c.title AS criterion;\""
    - comment: "Query from file formatted as JSON"
      command: "%s query -f query.zparql --format json"
common_flags: false
requires_storage: false
requires_session: false
requires_scheduler_check: false
