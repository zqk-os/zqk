$schema: "../schemas/command_spec.schema.json"
name: "list"
short: "List registered evaluation vectors"
description: |-
  Lists vectors with priority rank, dimension, weight, threshold, and current status.
flags:
  - name: prioritized
    type: bool
    default: "false"
    description: "Sort vectors descending by priority rank and weight"
  - name: format
    shorthand: f
    type: string
    default: table
    description: "Output format: table, json"
help:
  examples:
    - comment: "List all vectors"
      command: "%s vector list"
    - comment: "List vectors sorted by priority rank"
      command: "%s vector list --prioritized"
    - comment: "List vectors in JSON format"
      command: "%s vector list -f json"
common_flags: false
