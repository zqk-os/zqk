$schema: ../_schemas/command_spec.schema.json
name: stage
short: Stage an approval request in CAS
description: |
  Stages an approval request in CAS with content SHA256 digest, recording payload
  hash and target. Reads the payload from the specified file, computes the SHA256
  digest, and persists the staged approval request in the Knowledge Kernel CAS.
flags:
  - name: type
    type: string
    required: true
    description: "Type of approval request"
  - name: target
    type: string
    required: true
    description: "Target or recipient of the mutation"
  - name: payload
    type: string
    required: true
    description: "Path to payload file"
  - name: created-by
    type: string
    description: "Optional creator identity"
  - name: json
    type: bool
    description: "Output result in JSON format"
help:
  examples:
    - comment: "Stage a schema mutation"
      command: "%s gate stage --type mutation --target system --payload ./patch.json"
common_flags: true
requires_storage: true
requires_session: false
requires_scheduler_check: false
