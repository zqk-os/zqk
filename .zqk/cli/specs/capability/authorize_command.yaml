$schema: ../_schemas/command_spec.schema.json
name: authorize
short: Authorize a named capability (deny-by-default)
description: |
  Looks up the capability and evaluates its policy. Unknown names and denied
  policies return ErrPolicyRejected. Allowed actions return a structured allow result.
flags:
  - name: name
    type: string
    required: true
    description: Capability name to authorize (for example demo:safe)
  - name: agent-id
    type: string
    default: ""
    description: Optional agent id recorded in the evaluation context
help:
  examples:
    - comment: "Allowed demo capability"
      command: "%s capability authorize --name demo:safe --agent-id stranger"
    - comment: "Forbidden demo capability (typed denial)"
      command: "%s capability authorize --name demo:forbidden --agent-id stranger"
common_flags: true
