$schema: ../_schemas/command_spec.schema.json
name: lease <resource_id>
short: Lease a capability, agent seat, or resource from a remote mesh peer
description: |
  Establishes a cryptographically signed lease agreement with a remote peer node
  in the sovereign mesh, acquiring access to the specified capability or agent seat
  for a bounded operational duration.
args:
  type: exact
  count: 1
flags:
  - name: from
    type: string
    required: true
    description: "Kernel ID or peer URI of the capacity provider"
  - name: duration
    shorthand: d
    type: duration
    default: "1h"
    description: "Lease duration before automatic expiration (e.g. 30m, 2h)"
help:
  examples:
    - comment: "Lease a Code Craftsman seat from remote peer for two hours"
      command: "%s mesh lease res-code-craftsman --from kernel-peer-eu --duration 2h"
    - comment: "Lease an evaluation sandbox for 30 minutes"
      command: "%s mesh lease sandbox-go-124 --from kernel-peer-us --duration 30m"
common_flags: true
requires_storage: true
requires_session: false
requires_scheduler_check: false
