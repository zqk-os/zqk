$schema: ../schemas/command_spec.schema.json
name: heartbeat
short: Native swarm heartbeat and autonomous cadence engine
description: Automated hygiene sweep, ambient alignment pulse, and reactive wakeup bus for autonomous swarm cadence.
args:
    type: maximum
    count: 0
flags:
    - name: cadence
      type: duration
      default: "30m"
      description: Cadence interval between heartbeat sweeps
    - name: once
      type: bool
      default: "false"
      description: Execute a single heartbeat pulse and exit immediately
help:
    examples:
        - comment: Execute single heartbeat pulse
          command: "%s swarm heartbeat --once"
        - comment: Run heartbeat cadence daemon
          command: "%s swarm heartbeat --cadence 15m"
run_e: runHeartbeat
common_flags: true
