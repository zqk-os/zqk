$schema: "../../schemas/command_spec.schema.json"

name: "uninstall"
short: "Uninstall a registered scheduler host unit (leaves project data)"
flags:
  - name: "root"
    type: "string"
    default: ""
    description: "Root id or project path"
help:
  examples:
    - comment: "Uninstall"
      command: "%s scheduler service uninstall --root ."
  exclude_flags: ["format", "output", "verbose", "quiet", "timeout", "columns"]
run_e: "runSchedulerServiceUninstall"
common_flags: false
requires_storage: false
requires_session: false
requires_scheduler_check: false
