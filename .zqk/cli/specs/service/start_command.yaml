$schema: "../../schemas/command_spec.schema.json"

name: "start"
short: "Start a registered scheduler host unit"
flags:
  - name: "root"
    type: "string"
    default: ""
    description: "Root id or absolute/relative project path"
help:
  examples:
    - comment: "Start by path"
      command: "%s scheduler service start --root ."
  exclude_flags: ["format", "output", "verbose", "quiet", "timeout", "columns"]
run_e: "runSchedulerServiceStart"
common_flags: false
requires_storage: false
requires_session: false
requires_scheduler_check: false
