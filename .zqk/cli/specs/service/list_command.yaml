$schema: "../../schemas/command_spec.schema.json"

name: "list"
short: "List registered scheduler host service units"
description: |
  Lists host registry entries. Use --orphans to show units whose abs_root is missing.

flags:
  - name: "orphans"
    type: "bool"
    default: false
    description: "Only show entries whose project root directory is missing"

help:
  examples:
    - comment: "List all"
      command: "%s scheduler service list"
  exclude_flags:
    - "format"
    - "output"
    - "verbose"
    - "quiet"
    - "timeout"
    - "columns"

run_e: "runSchedulerServiceList"
common_flags: false
requires_storage: false
requires_session: false
requires_scheduler_check: false
