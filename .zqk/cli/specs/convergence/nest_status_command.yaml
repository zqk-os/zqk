$schema: ../../schemas/command_spec.schema.json
name: nest-status
short: Show nested CVS BFS tree under a parent
description: |
  Returns parent plus descendants via related_object_refs (CollectCVSTreeBFS, depth-capped).
help:
  examples:
  - comment: JSON tree
    command: '%s scheduler convergence nest-status --parent-session-id CVS-001 --format json'
  exclude_flags:
  - format
  - output
  - verbose
  - quiet
  - timeout
  - columns
run_e: schedulerConvergenceNestStatus
common_flags: true
flags:
- name: parent-session-id
  type: string
  default: ''
  description: Parent/coordinator convergence_session id (CVS-*)
- name: max-depth
  type: int
  default: 3
  description: Max nest depth
