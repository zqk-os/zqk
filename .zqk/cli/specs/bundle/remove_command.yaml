$schema: ../_schemas/command_spec.schema.json
name: remove
short: Uninstall a language bundle
description: |
  Remove an installed language bundle from the workspace registry.
args:
  type: exact
  count: 1
help:
  examples:
    - comment: Remove a bundle by name
      command: "%s bundle remove go"
common_flags: false
requires_storage: false
requires_session: false
requires_scheduler_check: false
