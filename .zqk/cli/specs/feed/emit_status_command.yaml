$schema: "../schemas/command_spec.schema.json"

name: "emit-status"
short: "Append a mesh status stamp to the agent chat feed"
description: |
  Appends a mesh_status event (and optional ACK) to the agent chat channel JSONL.
  Does not invoke desktop automation or shell wake helpers.

  Identity is kernel-backed: --persona-ref must be a live persona (PER-*).
  After init, community defaults PER-DEFAULT-OPERATOR and PER-DEFAULT-AGENT are seeded.
  --agent-id is the unique swarm seat so many agents sharing one persona stay
  distinguishable. Do not invent ad-hoc role enums (peer|coordinator|…).

flags:
  - name: "persona-ref"
    type: "string"
    default: ""
    required: true
    description: "Kernel persona id (PER-*); community defaults PER-DEFAULT-OPERATOR|PER-DEFAULT-AGENT"
  - name: "agent-id"
    type: "string"
    default: ""
    required: true
    description: "Unique swarm member seat id (not the persona id)"
  - name: "summary"
    shorthand: "s"
    type: "string"
    default: ""
    required: true
    description: "Status summary message"
  - name: "no-ack"
    type: "bool"
    default: false
    description: "Do not append a kernel self-ACK line"
  - name: "pulse-human"
    type: "bool"
    default: false
    description: "Also queue IDE bridge proof-of-life pulse (status bar + toast; no chat paste)"

args:
  type: "no_args"

help:
  examples:
    - comment: "Operator seat (community default persona)"
      command: "%s feed emit-status --persona-ref PER-DEFAULT-OPERATOR --agent-id cursor-composer --summary \"PR merged\""
    - comment: "Agent seat (community default persona)"
      command: "%s feed emit-status --persona-ref PER-DEFAULT-AGENT --agent-id peer-agent-1 --summary \"TRACE done\""
    - comment: "Status stamp plus human proof-of-life pulse"
      command: "%s feed emit-status --persona-ref PER-DEFAULT-AGENT --agent-id peer-agent-1 --summary \"still working\" --pulse-human"
  exclude_flags:
    - "columns"
    - "ignore-scheduler-down"

run_e: "runFeedEmitStatus"
common_flags: true
