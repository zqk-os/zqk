$schema: ../schemas/command_spec.schema.json
name: journal
short: List recent cryptographic change journal mutations
description: List recent cryptographic change journal mutations
aliases:
    - log
    - history
args:
    type: no_args
flags:
    - name: limit
      shorthand: "n"
      type: int
      default: 20
      description: Maximum number of journal mutations to return
help:
    examples:
        - comment: Run state journal
          command: '%s state journal'
run_e: runStateJournal
common_flags: true
