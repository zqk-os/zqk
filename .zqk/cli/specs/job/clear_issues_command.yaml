$schema: "../schemas/command_spec.schema.json"

name: "clear-issues"
short: "Clear scheduler issues file"
description: |
  Clear the scheduler issues file, setting status to 'ok' and removing all recorded issues.
  This manually clears .zqk/scheduler/issues.json. The scheduler will automatically
  clear issues when all recorded issues are older than 1 hour, but this command
  allows immediate clearing for operational purposes.

help:
  examples:
    - comment: "Clear scheduler issues"
      command: "%s scheduler clear-issues"
  exclude_flags:
    - "format"
    - "output"
    - "verbose"
    - "quiet"
    - "timeout"
    - "columns"

run_e: "runClearIssues"
async: true
common_flags: true
