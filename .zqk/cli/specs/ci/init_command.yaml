$schema: ../schemas/command_spec.schema.json
name: init
short: Initialize zero-config GitHub Actions CI/CD workflow and Homebrew packaging
description: Scaffolds production-grade GitHub Actions audit workflow (.github/workflows/zqk-audit.yml) and Homebrew formula template (Formula/zqk.rb).
args:
    type: maximum
    count: 0
flags:
    - name: dry-run
      type: bool
      default: "false"
      description: Preview workflow generation without writing files
    - name: force
      type: bool
      default: "false"
      description: Overwrite existing workflow files
    - name: workflow-path
      type: string
      default: ""
      description: Custom relative path for the workflow file
    - name: formula-path
      type: string
      default: ""
      description: Custom relative path for the formula file
help:
    examples:
        - comment: Initialize default GitHub Actions audit workflow
          command: zqk ci init
        - comment: Preview workflow generation in dry-run mode
          command: zqk ci init --dry-run
run_e: runCIInit
common_flags: true
