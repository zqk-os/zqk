$schema: "../schemas/command_spec.schema.json"

name: "checkout [flags]"
short: "Checkout committed SHA into .zqk/local-ci/workdir"
description: |
  Refresh the Local CI git worktree only (no test run).

flags:
  - name: "sha"
    type: "string"
    description: "Commit SHA to checkout (default: HEAD)"
  - name: "allow-dirty"
    type: "bool"
    default: false
    description: "Allow checkout when studio has tracked dirty files"
  - name: "no-archive"
    type: "bool"
    default: false
    description: "Skip tar drop / archive-git recording"

help:
  examples:
    - comment: "Checkout HEAD"
      command: "%s ci checkout"
  exclude_flags:
    - "format"
    - "output"
    - "verbose"
    - "quiet"
    - "timeout"
    - "columns"
