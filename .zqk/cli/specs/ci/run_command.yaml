$schema: "../schemas/command_spec.schema.json"

name: "run [flags]"
short: "Checkout committed SHA into local-ci workdir and run test cases"
description: |
  Checkout the committed SHA into .zqk/local-ci/workdir, then run kernel
  test_case objects via zqk test run --all.

  Studio must be clean of tracked changes unless --allow-dirty or
  --sha points at an already-committed revision.

flags:
  - name: "sha"
    type: "string"
    description: "Commit SHA to checkout (default: HEAD)"
  - name: "allow-dirty"
    type: "bool"
    default: false
    description: "Allow checkout when studio has tracked dirty files"
  - name: "no-archive"
    type: "bool"
    default: false
    description: "Skip tar drop / archive-git recording"
  - name: "checkout-only"
    type: "bool"
    default: false
    description: "Only checkout; do not run test cases"

help:
  examples:
    - comment: "Full local CI on HEAD"
      command: "%s ci run"
  exclude_flags:
    - "format"
    - "output"
    - "verbose"
    - "quiet"
    - "timeout"
    - "columns"
