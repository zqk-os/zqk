$schema: ../_schemas/command_spec.schema.json
name: propagate
short: Propagate organizational change to affected ZQK objects
description: |-
    Propagate an organizational change to affected ZQK objects.

    Requires an impact_analysis for the change (run "organizational analyze-impact
    --change <id>" first).

    With --confirm, updates each affected object with last_propagated_change_ref so
    propagation is recorded.

      Dry run: show what would be propagated
      zqk organizational propagate --change OCH-001 --dry-run
      Apply propagation (updates affected objects)
      zqk organizational propagate --change OCH-001 --confirm
