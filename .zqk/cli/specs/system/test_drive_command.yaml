$schema: ../schemas/command_spec.schema.json
name: test-drive
short: Guided interactive developer test-drive of ZQK autonomous swarms
description: >
    Interactive guided walkthrough demonstrating how ZQK transforms developer intent
    into persistent, verifiable Knowledge Kernel graphs (Vision → Goal → Plan → Req → BLI),
    runs concurrent swarm AST verification, and issues tamper-proof cryptographic delivery receipts.
aliases:
    - td
    - testdrive
args:
    type: no_args
flags:
    - name: intent
      type: string
      default: ""
      description: Developer intent prompt or feature brief to simulate
    - name: scenario
      type: string
      default: api-service
      description: "Preset scenario (api-service, cli-tool, stream-pipeline, custom)"
    - name: speed
      type: string
      default: normal
      description: "Pacing speed for demonstration (normal, fast, instant)"
    - name: non-interactive
      type: bool
      default: false
      description: Run non-interactively with automatic defaults (recommended for CI/testing)
    - name: dry-run
      type: bool
      default: false
      description: Simulate test-drive workflow without disk mutations
help:
    examples:
        - comment: Run interactive developer test drive
          command: "%s system test-drive"
        - comment: Test drive with specific prompt intent
          command: '%s system test-drive --intent "Build an authenticated SQLite task API with telemetry"'
        - comment: Headless non-interactive run for CI or quick demonstration
          command: "%s system test-drive --non-interactive --scenario cli-tool"
run_e: runTestDrive
common_flags: false
requires_storage: false
requires_session: false
