$schema: "../schemas/command_spec.schema.json"

name: "disk-usage"
short: "Report directory sizes (cross-platform du-style scan)"
description: |
  Walks a tree in pure Go and lists directory sizes up to a depth limit, sorted
  largest-first. Replaces ad-hoc `du | sort | grep` for housekeeping so agents
  and CI get the same behavior on macOS, Linux, and Windows.

  Pair with scripts/clean-project-sprawl.sh after identifying hot spots under .zqk/.

args:
  type: "maximum"
  max: 1

flags:
  - name: "depth"
    shorthand: "d"
    type: "int"
    default: 2
    description: "Maximum directory depth relative to the scan root (root is 0)"
  - name: "min"
    type: "string"
    default: "1M"
    description: "Only list entries at least this large (e.g. 1M, 500M, 1G, 0)"
  - name: "top"
    type: "int"
    default: 0
    description: "Limit to the N largest entries after filtering (0 = unlimited)"
  - name: "include-files"
    type: "bool"
    default: false
    description: "Also list regular files at depth <= --depth"

help:
  examples:
    - comment: "Project root, depth 2, entries >= 1MiB (default)"
      command: "%s system disk-usage"
    - comment: "Same shape as du -h -d 2 filtered to gigabyte-scale paths"
      command: "%s system disk-usage --depth 2 --min 1G"
    - comment: "Inspect .zqk log/state sprawl"
      command: "%s system disk-usage .zqk --depth 3 --min 10M --format json"
    - comment: "Top 20 hotspots anywhere under cwd"
      command: "%s system disk-usage --top 20 --min 0"
  exclude_flags:
    - "columns"
    - "ignore-scheduler-down"

run_e: "runDiskUsage"
common_flags: true
