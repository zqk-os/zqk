$schema: ../../_schemas/command_spec.schema.json
name: lint-report
short: Show last lint output for creating backlog items
description: |-
    Prints the contents of .zqk/pre-commit/lint-output.txt from the last run of

    scripts/pre-commit-lint.sh. Use this to see which issues to fix and create

    backlog items. If the file is missing, run ./scripts/pre-commit-lint.sh first.

      View lint output after running pre-commit-lint.sh
      zqk pre-commit lint-report
