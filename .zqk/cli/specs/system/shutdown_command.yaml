$schema: "../schemas/command_spec.schema.json"
name: "shutdown"
short: "Shutdown all ZQK daemons cleanly"
description: |
  Gracefully shuts down the scheduler service and forcefully kills any stray ZQK 
  background daemons via host service management and launchctl.

help:
  examples:
    - comment: "Shutdown the entire system"
      command: "%s system shutdown"
  exclude_flags:
    - "columns"
    - "ignore-scheduler-down"

common_flags: false
requires_storage: false
requires_session: false
requires_scheduler_check: false
