$schema: "../schemas/command_spec.schema.json"

name: "compact-wal"
short: "Compact the WAL file by removing applied entries"
description: |
  Removes entries from the WAL file that have already been applied (based on checkpoint).
  This reduces WAL file size by keeping only unapplied entries.
  When a scheduler daemon holds the object WAL open, standalone compaction can orphan
  file descriptors or corrupt state — this command refuses unless you pass --force.

flags:
  - name: "force"
    type: "bool"
    default: false
    description: "Allow compaction while the scheduler daemon appears to be running (unsafe; prefer stopping the daemon or letting the write-behind worker compact via TryCompactWAL)"

help:
  examples:
    - comment: "Compact WAL file when scheduler daemon is stopped"
      command: "%s system compact-wal"
    - comment: "JSON output for automation"
      command: "%s system compact-wal --format json"
    - comment: "Force compaction even if scheduler appears running (unsafe)"
      command: "%s system compact-wal --force"

run_e: "runCompactWAL"
common_flags: true
