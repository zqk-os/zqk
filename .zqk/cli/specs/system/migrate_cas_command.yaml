$schema: ../_schemas/command_spec.schema.json
name: migrate-cas
short: Migrate legacy UUID identities to deterministic CAS hashes
description: |-
    Scans the .zqk/process/ object tree, migrates any legacy UUID identities to
    deterministic CAS (Content-Addressable Storage) SHA256 hashes, and safely cleans
    up orphaned object files.

    This command helps transition legacy object IDs to the new stable CAS storage
    scheme.

      Migrate all legacy items
      zqk system migrate-cas
      Migrate but keep old files (not recommended)
      zqk system migrate-cas --remove-old-files=false
