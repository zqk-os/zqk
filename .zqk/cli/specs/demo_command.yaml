$schema: schemas/command_spec.schema.json
name: demo
short: Interactive terminal showcase of ZQK capabilities
description: |-
    Interactive terminal demonstration showcasing sub-15ms zgrep AST search,
    Verifiable Delivery Standard (VDS) verification gates, and multi-agent coordination,
    concluding with a community star and fork invitation.
args:
    type: maximum
    count: 1
flags:
    - name: non-interactive
      type: bool
      default: "false"
      description: Run automated showcase without pausing for keyboard prompts
    - name: speed
      type: string
      default: normal
      description: "Showcase animation speed: normal, fast, instant"
    - name: step
      shorthand: s
      type: string
      default: all
      description: "Run specific demonstration step: all, ast, vds, swarm, star"
help:
    examples:
        - comment: Run interactive terminal showcase
          command: zqk demo
        - comment: Run automated non-interactive demonstration
          command: zqk demo --non-interactive
        - comment: Run only the AST search showcase
          command: zqk demo --step ast
run_e: runDemoExecution
common_flags: false
