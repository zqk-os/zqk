$schema: _schemas/command_spec.schema.json
name: rules
short: Multi-host IDE directives generator for AI developer harnesses
description: |
  Generate persistent memory directives and rules files for Cursor (.cursorrules),
  Claude Code (CLAUDE.md), Windsurf (.windsurfrules), and headless agent runtimes (.agents/AGENTS.md).
common_flags: true
requires_storage: false
requires_session: false
requires_scheduler_check: false
subcommands:
  - name: generate
    spec_ref: rules/generate_command.yaml
