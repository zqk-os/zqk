$schema: ../_schemas/command_spec.schema.json
name: generate
short: Generate IDE rules files for target AI coding assistants
description: |
  Generate or preview directive files for Cursor, Claude Code, Windsurf, or headless agents.
flags:
  - name: host
    type: string
    default: all
    description: "Target host IDE or agents (cursor, claude, windsurf, agents, all)"
  - name: dry-run
    type: bool
    default: false
    description: Preview generated files without writing to disk
  - name: force
    type: bool
    default: false
    description: Overwrite existing directive files
help:
  examples:
    - comment: Generate rules for all supported IDEs
      command: "%s rules generate"
    - comment: Generate rules specifically for Cursor
      command: "%s rules generate --host cursor"
