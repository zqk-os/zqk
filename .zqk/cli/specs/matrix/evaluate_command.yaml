$schema: ../_schemas/command_spec.schema.json
name: evaluate
short: Evaluate a file's scorecard against kernel policies and auto-mint remediations
description: |-
  Performs a deep evaluation of a source code file against canonical quality policies.
  Computes the 1-5 diamond score, verifies invisible thresholds,
  and if thresholds are violated, automatically mints kernel objects.
flags:
  - name: file
    type: string
    description: Target relative file path to evaluate (required)
    required: true
  - name: dimension
    type: string
    description: Canonical dimension code (HCODE, EFFPERF, ERRHYG, CONCURR, SECOBS, DOCSIG)
    default: HCODE
  - name: auto-mint
    type: bool
    description: Automatically mint kernel technical_debt and backlog_item on policy violation
    default: true
  - name: evaluator
    type: string
    description: Evaluating agent or persona identity
    default: PER-HARDCODING-ERADICATION-CZAR
  - name: json
    type: bool
    description: Output evaluated scorecard in JSON format
