$schema: ../_schemas/command_spec.schema.json
name: get
short: List matrix CSV rows matching filters
description: |-
    Resolves CSV + profile via docs/quality/matrix_registry.yaml (same as matrix
    report), reads the

    inventory, and returns rows matching optional --filter column=value (AND),
    --glob on file_path

    (filepath.Match), --go-only, and --cvs-id against the registry
    session_ref_column. Use --field

    (repeatable) to narrow output to specific CSV columns (order preserved). Does
    not collide with

    global --columns (table column widths).

      All rows (default matrix)
      zqk matrix get
      Filter by gate column
      zqk matrix get --filter fully_vetted=pending
      Go files matching a path glob
      zqk matrix get --go-only --glob 'pkg/*.go'
      Only file_path and gate column in output
      zqk matrix get --field file_path --field fully_vetted
      Pipe-friendly CSV (header + data rows)
      zqk matrix get --format csv --filter fully_vetted=pending

flags:
  - name: "name"
    type: "string"
    description: "Matrix alias from matrix_registry.yaml (default: resolved from registry default)"
  - name: "registry"
    type: "string"
    description: "Path to matrix_registry.yaml (repo-relative or absolute)"
  - name: "matrix"
    type: "string"
    description: "Override CSV path (requires --profile)"
  - name: "profile"
    type: "string"
    description: "Override profile YAML when using --matrix"
  - name: "filter"
    shorthand: "F"
    type: "stringArray"
    description: "column=value (repeatable); all must match (AND)"
  - name: "glob"
    type: "string"
    description: "Glob pattern for file_path column (filepath.Match; e.g. pkg/*.go or */foo.go)"
  - name: "go-only"
    type: "bool"
    default: false
    description: "Only rows whose file_path ends with .go"
  - name: "cvs-id"
    type: "string"
    description: "Only rows whose session ref column equals this id (uses registry session_ref_column)"
  - name: "limit"
    type: "int"
    default: 0
    description: "Max matching rows (0 = no limit)"
  - name: "field"
    shorthand: "C"
    type: "stringArray"
    description: "CSV column name to include in output (repeatable); order preserved; default is all columns"

common_flags: true

