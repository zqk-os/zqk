$schema: ../schemas/command_spec.schema.json
name: install
short: Install solitary overseer host service and clean legacy per-daemon units
description: Unloads and deletes any legacy LaunchAgents (scheduler, privileged-writer, mesh) and installs the solitary com.zqk.overseer LaunchAgent.
args:
  type: no_args
flags:
  - name: root
    type: string
    default: ""
    description: Target project root for the overseer service
  - name: binary
    type: string
    default: ""
    description: Custom binary path for the overseer executable
help:
  examples:
    - comment: Install overseer host service
      command: '%s daemon service install'
run_e: runDaemonServiceInstall
common_flags: true
