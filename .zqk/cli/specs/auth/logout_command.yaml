$schema: ../_schemas/command_spec.schema.json
name: logout
short: End current CLI session and clear persisted state
description: |
  Ends the active session and clears .zqk/state/session so subsequent
  commands will require establishing a fresh session.
args:
  type: no_args
help:
  examples:
    - comment: "End current operator session and clear disk state"
      command: "%s auth logout"
common_flags: true
requires_storage: true
requires_session: false
requires_scheduler_check: false
