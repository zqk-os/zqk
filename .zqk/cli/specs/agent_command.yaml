$schema: "schemas/command_spec.schema.json"

name: "agent"
short: "Orchestration, task routing, and swarm tooling for kernel agents"
description: |
  Routes workstream items to specialized agents, prepares execution context,
  and exposes hive status. Prefer these commands over vendor-specific
  subagent launchers.

help:
  examples:
    - comment: "Route an in-progress priority plan to native sub-agents"
      command: "%s agent orchestrate <plan-id> --persona-id PER-COMMUNITY-SOFTWARE-ENGINEER"
    - comment: "Assemble a persona-scoped prompt for a task"
      command: "%s agent prepare-context <task-id> --persona-ref PER-COMMUNITY-SOFTWARE-ENGINEER"
  exclude_flags:
    - "output"
    - "quiet"
    - "columns"

common_flags: false
requires_storage: false
requires_session: false
requires_scheduler_check: false
