$schema: "../schemas/command_spec.schema.json"

name: "supervise"
short: "Supervise the MCP daemon"
description: |
  Runs a lightweight supervisor that periodically calls mcp ensure so the TCP
  daemon stays up. Use --status / --stop for control-plane checks.
  --loop is for the background child process (do not pass interactively).

flags:
  - name: "tcp"
    type: "string"
    default: "127.0.0.1:8443"
    description: "TCP target address for the MCP daemon"
  - name: "status"
    type: "bool"
    default: false
    description: "Print supervisor and daemon status, then exit"
  - name: "stop"
    type: "bool"
    default: false
    description: "Stop the supervisor (and leave daemon policy unchanged)"
  - name: "loop"
    type: "bool"
    default: false
    description: "Internal background ensure loop (supervisor child)"

args:
  type: "no_args"

help:
  examples:
    - comment: "Start supervisor for default daemon"
      command: "%s mcp supervise"
    - comment: "Show daemon and supervisor status"
      command: "%s mcp supervise --status"
    - comment: "Stop supervisor"
      command: "%s mcp supervise --stop"
  exclude_flags:
    - "columns"
    - "ignore-scheduler-down"
    - "format"
    - "output"

run_e: "runSupervise"
common_flags: true
requires_session: false
