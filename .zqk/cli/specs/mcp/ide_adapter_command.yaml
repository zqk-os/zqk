$schema: ../_schemas/command_spec.schema.json
name: ide-adapter
short: IDE-specific MCP adapter (stdio ↔ daemon)
description: |-
    Speaks a clean full MCP contract on stdio for IDE while privately

    maintaining keepalive, reconnect, and event subscription against the TCP

    MCP daemon. Other IDEs should use mcp daemon / mcp serve directly.

      IDE entrypoint (default daemon)
      zqk mcp ide-adapter --tcp 127.0.0.1:8443
