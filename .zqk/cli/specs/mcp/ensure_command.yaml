$schema: "../schemas/command_spec.schema.json"

name: "ensure"
short: "Ensure the MCP daemon is running"
description: |
  Starts the TCP MCP daemon if nothing is listening on --tcp.
  Prefers ZQK_BIN, then workshop/repo stable (`.zqk/bin/zqk-stable`, `bin/zqk-stable`),
  then tip `bin/zqk`, then the current executable. Tip rebuilds must not retarget the
  daemon — promote via `scripts/install-zqk-stable.sh` then restart.
  Always refreshes IDE role symlinks (bin/<brand>-mcp-daemon and
  bin/<brand>-mcp-ide-adapter) so Cursor mcp.json survives tip rebuilds.
  Spawns via the daemon role symlink so process lists show the daemon role.
  Idempotent: reports the existing listener PID when already up.

flags:
  - name: "tcp"
    type: "string"
    default: "127.0.0.1:8443"
    description: "TCP target address for the MCP daemon"

args:
  type: "no_args"

help:
  examples:
    - comment: "Ensure default daemon address"
      command: "%s mcp ensure"
    - comment: "Ensure a custom TCP address"
      command: "%s mcp ensure --tcp 127.0.0.1:9443"
  exclude_flags:
    - "columns"
    - "ignore-scheduler-down"
    - "format"
    - "output"

run_e: "runEnsure"
common_flags: true
requires_session: false
