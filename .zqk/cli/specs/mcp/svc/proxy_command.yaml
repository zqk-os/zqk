$schema: "../../schemas/command_spec.schema.json"

name: "proxy"
short: "Legacy MCP proxy shim (prefer cursor-adapter for Cursor)"
description: |
  Transparent stdio↔TCP forwarder for IDE clients. Prefer
  `mcp cursor-adapter` for Cursor (session-layer adapter). Kept for
  compatibility; reconnects if the daemon restarts.

flags:
  - name: "tcp"
    type: "string"
    default: "127.0.0.1:8443"
    description: "TCP address of the underlying MCP daemon"

args:
  type: "no_args"

help:
  examples:
    - comment: "Proxy to the default daemon address"
      command: "%s mcp proxy --tcp 127.0.0.1:8443"
  exclude_flags:
    - "columns"
    - "ignore-scheduler-down"
    - "format"
    - "output"

run_e: "runProxy"
common_flags: true
requires_session: false
