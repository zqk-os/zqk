$schema: "../../schemas/command_spec.schema.json"

name: "serve"
short: "Start the MCP server"
description: |
  Start the MCP server that exposes CLI commands via the Model Context Protocol.
  Reads stdin / writes stdout using JSON-RPC, or listens on TCP when --tcp is set.

flags:
  - name: "tcp"
    type: "string"
    default: ""
    description: "Start a TCP server at the given address instead of stdio (e.g. 127.0.0.1:8443; plain TCP is loopback-only)"
  - name: "tls-cert"
    type: "string"
    default: ""
    description: "Path to TLS certificate file (enables TLS if provided)"
  - name: "tls-key"
    type: "string"
    default: ""
    description: "Path to TLS key file"
  - name: "tls-ca"
    type: "string"
    default: ""
    description: "Path to CA certificate file for mutual TLS (mTLS) authentication"

args:
  type: "no_args"

help:
  examples:
    - comment: "Stdio MCP server (IDE default)"
      command: "%s mcp serve"
    - comment: "TCP MCP server (loopback default)"
      command: "%s mcp serve --tcp 127.0.0.1:8443"
    - comment: "mTLS MCP server"
      command: "%s mcp serve --tcp :8443 --tls-cert /path/to/server.crt --tls-key /path/to/server.key --tls-ca /path/to/ca.crt"
  exclude_flags:
    - "columns"
    - "ignore-scheduler-down"
    - "format"
    - "output"

run_e: "runServe"
common_flags: true
requires_session: false
