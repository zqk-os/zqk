    4. After peer_ack, verify success_gate on disk before minting the next stage.
    5. Package stubs: docs/quality/codebase_evaluation/templates/package_skeleton + scripts/cef/materialize-package.sh

    Prefer lens specialist and adversarial as separate ATKs (two interactions each max).
