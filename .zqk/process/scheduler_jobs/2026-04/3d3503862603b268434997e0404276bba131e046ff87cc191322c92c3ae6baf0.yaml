description: |
    Reads .zqk/logs/scheduler/cvs/test-bundles/health.jsonl and updates the configured convergence_session
    when the health watermark advances. Respects thresholds.max_ticks_per_hour on the session.
    Use alongside targeted zqk scheduler scan-tests; does not replace bundle runs.
    With CONVERGENCE_TICK_ROLLUP, after a successful tick runs orchestrate rollup-only (skip persist) and
    records rollup outcome on the job events JSONL (see pkg/scheduler handlers_convergence_session_tick).
enabled: false
environment_variables:
    CONVERGENCE_SESSION_ID: CVS-1776058539101059000-ffbcee8f
    CONVERGENCE_TICK_ROLLUP: "1"
    HEALTH_FILE_MISSING: skip
    HEALTH_FILE_MISSING_SKIP_BUDGET: "0"
    HEALTH_LIMIT: "500"
    PIPELINE_TICK_TITLE_SUBSTRING: tutorial
execution_mode: reusable
