category: maintenance
command: /bin/sh
command_args:
    - -c
    - |-
      set -e
      ZQK="${ZQK_BIN:-zqk}"
      "$ZQK" system object-count-report --emit-events \
        --include-filesystem-snapshot --filesystem-snapshot-scope=zqk
created_at: "2026-09-19T00:20:38Z"
created_by: ACC-1785920548450214012-68b850c0
description: |
    Runs `zqk system object-count-report` on schedule to capture disk vs object vs internal counts,
    scoped filesystem snapshot under `.zqk/`, append object/stream volume samples, and prune old
    metrics .chunk files per METRICS_CHUNK_RETENTION_DAYS (template default 7 days below; CLI default 14).
enabled: true
environment_variables:
    ZQK_METRICS_CHUNK_RETENTION_DAYS: "7"
execution_mode: reusable
id: SCH-objcount-report
job_type: run_wrapper
kind: scheduler_job
max_runtime_seconds: 900
namespace_id: zqk:kernel
schedule_expression: 0 */4 * * *
schema_version: 2.0.0
source_type: internal
status: active
title: System Health - Object Count Report (every 4h)
trigger_type: timer
updated_at: "2026-09-19T00:20:38Z"
updated_by: ACC-1785920548450214012-68b850c0
version_context: default
