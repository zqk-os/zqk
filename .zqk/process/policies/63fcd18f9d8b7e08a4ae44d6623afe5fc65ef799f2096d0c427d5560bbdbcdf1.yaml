body: Every subsystem producing file I/O (stream logs, diagnostic summaries, WAL journals, lock files, temporary worktrees, sockets) must define explicit retention windows, log rotation/truncation policies, automatic stale lock and temporary file reaping, and report comprehensive I/O metrics to prevent storage overflow or file descriptor exhaustion.
category: architecture
created_at: "2026-09-19T05:55:00Z"
created_by: ACC-1785920548450214012-68b850c0
description: Establishes mandatory retention, log rotation, stale lock reaping, and temporary resource hygiene across all ZQK kernel subsystems.
