body: |
    Create, update, list, and transition process objects via `zqk` CLI or the zqk MCP server.
    Do not hand-edit hash YAML under `.zqk/process/` as the primary write path.

    **Allowed**: `zqk object create|update|list|get`, `zqk quick …`, MCP tools that wrap the same commands.
    **Avoid**: Direct file edits that bypass lifecycle, validation, and audit.

    Exceptions: intentional low-level repair documented in a change_journal / backlog item.
