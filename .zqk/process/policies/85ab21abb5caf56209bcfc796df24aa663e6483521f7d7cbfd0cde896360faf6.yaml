      ✅ **Correct**: Use CLI for object operations
      ```bash
      zqk object update BLI-655 --field status=in_progress
      zqk object create policy --file new-policy.yaml
      ```
    - |-
      ❌ **Incorrect**: Direct file edits
      ```bash
      # Editing .zqk/process/backlog_items/BLI-655.yaml directly
      # This bypasses integrity mechanisms
      ```
