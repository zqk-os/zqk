body: |
    **CRITICAL: Always use the CLI for object modifications.** Direct edits to instance YAML under `.zqk/process/` bypass integrity, content-addressed filenames, and caches.

    ## Requirement
    1. Create, update, and delete instance/process data only via `zqk object create|update|delete` (or the appropriate domain command).
    2. Do not hand-edit YAML under `.zqk/process/` for instance data. Exception: `.zqk/specs/` schema/config when CLI or tooling is unavailable — document why and follow up.
    3. After a CLI write, **commit the CAS rename with the work** (`POL-CODE-CAS-COMMIT-001`). Do not leave `complete` / `in_progress` hash YAML untracked.

    ## Mechanical
    Capability gates (not Cursor `.mdc` prose) enforce CAS integrity:
    - `scripts/check-process-cas-commit-with-work.sh` — unstaged same-id rename pairs fail the commit (`POL-CODE-CAS-COMMIT-001`).
    - `scripts/check-cas-process-staged.sh` — staged hash filename must match blob sha256.
    - `scripts/check-process-casable-staged.sh` — staged instances must have left the draft plane.

    Vendor IDE rules (`.cursor/rules/process-data-cli-only.mdc` and siblings) are **projections**. If they disagree with this object or `POL-CODE-CAS-COMMIT-001`, trust the kernel.
