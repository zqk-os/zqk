body: |
    **Utilize a TDD process** while implementing new logic.

    - Ensure tests are written first prior to functional code.
    - Create test_case objects to document and group related tests.
    - Use zqk criteria objects for traceability between backlog items, goals, requirements, and milestones.
    - Run package unit tests before changes to establish a green baseline.
    - Never disable, bypass, or comment out failing tests to achieve a passing build.

    Community kernel companion: POL-CODE-1789672481919632000-e3500fed (Test-Driven Development and Continuous Verification).
