body: Every executable command in the zqk CLI tree must have an authoritative, valid command spec in .zqk/cli/specs/. Commands must adhere strictly to the standardized command taxonomy (Job Management, Services Management, Convergence Management, Agent/Swarm, Metrics & Feedback, Code & Build). Vendor-specific functionality (Cursor, AppleScript) must reside in dedicated, pluggable vendor adapter namespaces and never leak into core general-purpose commands.
category: architecture
