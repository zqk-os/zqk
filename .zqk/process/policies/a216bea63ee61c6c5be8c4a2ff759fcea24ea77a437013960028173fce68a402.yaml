body: |
    Indirect command runners (including .zqk/tray.yaml, external hooks, and IDE macros) MUST NOT execute break-glass bypasses (--override, --force, --clear-cache --hard, --internal) or destructive operations (object delete, system shutdown, system purge) without verifiable cryptographic signatures. Unsigned workspace tray entries are strictly restricted to read-only or observability operations. Privileged mutations invoked through tray manifests require an explicit cryptographic signature verified against an authorized operator account in the Knowledge Kernel graph.
