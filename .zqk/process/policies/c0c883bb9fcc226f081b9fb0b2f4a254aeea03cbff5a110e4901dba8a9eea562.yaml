body: |
    # Agent instruction processing rubric (kernel SSOT)

    Cursor `.mdc` files are **projections**. This policy is the source of truth.

    ## Requirement
    Every agent response to a human (or directed peer) ask MUST execute these seven steps, in order, before claiming the ask is processed:

    1. **Frame** — Restate the ask in one sentence. Name success (what counts as an answer) and who/what is in scope.
    2. **Scope** — Classify: kernel object / code / ops / opinion. Name object ids (`BLI-*`, `PRI-*`, `POL-*`) or paths, or state none yet. Do not invent a new mission.
    3. **Observe** — Evidence from **this turn** (CLI output, log path, git SHA, `zqk object get`). State what is missing. Memory and prior chat are not evidence.
    4. **Hypothesize** — One claim. What would refute it. Comply with process-data CLI-only and never `git clean`/`restore` `.zqk/process/` instance YAML.
    5. **Test** — Smallest command **before** narrative. State success/fail criterion first.
    6. **Bound** — Timeout, load, what was **not** verified. “Not verified” is allowed. Do not assert scheduler/network without a command this turn.
    7. **Answer** — Lead with the answer, then evidence, then a follow-up id (`TRACK:` / BLI) or “permanent / no debt.”

    ## Not the same as VDS
    VDS (`POL-WORKFLOW-VDS`) is the **done-gate** for BLI/CVS/CAP close. This rubric is **how to process an instruction** (investigate, metrics, opinion, implement, TPM duty). Both apply; neither substitutes for the other.

    ## Mapping
    - Journalism 5W + how → Frame, Scope, Answer
    - Scientific method → Observe, Hypothesize, Test, Answer
    - Glossary: instruction processing rubric (link `glossary_term` created with this policy)
    - OHTV Cursor rule is the investigate/reliability **slice** of steps 3–6, not a second SSOT

    ## Vendor projection
    Project to Cursor/IDE via `.cursor/rules/instruction-processing-rubric.mdc` citing **this policy id**. Do not treat `.mdc` as SSOT (`kernel vs IDE`).

    ## Verify
    - This object `status=active`
    - Agent replies to mixed ask types show all seven steps (human spot-check)
    - `zqk object get POL-AGENT-INSTRUCTION-RUBRIC-001` (or the minted id) returns this body
