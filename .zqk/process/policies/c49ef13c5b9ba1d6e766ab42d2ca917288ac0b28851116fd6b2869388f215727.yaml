body: |
    **Tutorial for new agents and users**: Follow this order to align on operational philosophy and discover what matters. Everything below uses system objects so you stay in the indexable, auditable model.

    **Step 1 – Operational philosophy**
    - Read the policy "Operational Philosophy - Object-First, Discoverable, Auditable":
      `zqk object list policy --filter "title=Operational Philosophy*"`
      `zqk object get <POLICY_ID>`
    - Principle: substantive things are objects; they are discoverable and auditable; work is shaped by mission, vision, and goals.

    **Step 2 – Mission, vision, goals**
    - List mission and vision objects (if any): `zqk object list mission`, `zqk object list vision`
    - List goals: `zqk object list goal`
    - These define the "why" and desired outcomes. Use them to judge relevance of work.

    **Step 3 – Policy index**
    - List all policies: `zqk object list policy`
    - By category: `zqk object list policy --filter category=architecture`, `--filter category=workflow`, etc.
    - Policies state standards and expectations. Consult before implementing.

    **Step 4 – Current priorities**
    - Current priority plan: `zqk object list priority_plan --filter status=in_progress` (or active)
    - Backlog items on that plan: `zqk object list backlog_item --filter priority_plan_ref=<PLAN_ID>`
    - Competing priorities are balanced via the active plan and backlog order; work in plan order when the project rules require it.

    **Step 5 – System health (optional but recommended)**
    - Retention and maintenance: `zqk system retention-status`, `zqk system ensure-retention-jobs`
    - Object health: `zqk system check` (and reminders, including retention_drift when over target)

    **Benefits**: You and other agents share the same object-first view, can query the same index, and collaborate on meaningful work aligned with mission, vision, and goals. When in doubt, query objects first; use docs as extended context.
