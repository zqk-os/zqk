description: |
    # Cryptographic Command Signing and Privileged Execution Guard for Tray Shortcuts

    ## 1. Vulnerability Mechanics & Scope
    - Vector: Untrusted mutation of `.zqk/tray.yaml` injecting destructive verbs or break-glass flags (`--override`, `--force`, `object delete`, `system shutdown`).
    - Exploit: Invocation via `zqk tray run <entry-name>` inherits interactive stdin, bypassing non-TTY agent protection.
    - Scope: All indirect runners including Tray shortcuts, external hooks, and IDE macros.

    ## 2. 3-Tier Security Architecture
    - **Tier 1 (Fail-Closed Execution Barrier)**: Inject `ZQK_EXEC_SOURCE=tray` into child subprocess environment. Disallow break-glass flags (`--override`, `--force`) and destructive object verbs (`delete`, `purge`) in indirect execution context unless authenticated.
    - **Tier 2 (Cryptographic Command Signing)**:
      - Authoritative human operator signs the entry: `zqk tray sign <entry-name>`.
      - Canonical digest: SHA-256 over CanonicalJSON(`{"name": entry.Name, "argv": entry.Argv}`).
      - ECDSA signature using `.zqk/keystore/` private key; stored in `.zqk/tray.yaml` under `signed_by` and `signature`.
      - Runtime verification: `zqk tray run` checks signature against author's account public key before process fork. Any argument tampering fails closed.
    - **Tier 3 (Governor Pattern)**: High-stakes kernel kinds (`policy`, `account`, `keystore`, `persona`) require a signed Governor approval edge (`pkg/storage/governor.go`) regardless of execution origin.

    ## 3. Operational Guarantees
    - Unsigned tray shortcuts are permitted ONLY for read-only and non-destructive operations.
    - Built-in embedded defaults (`pkg/tray/default_tray.yaml`) are attested with the binary itself.
