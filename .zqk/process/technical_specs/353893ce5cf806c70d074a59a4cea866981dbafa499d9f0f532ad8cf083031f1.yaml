context: |
    Indirect command invocation mechanisms (such as .zqk/tray.yaml runners) represent a potent Confused Deputy attack vector. An untrusted agent, malicious pull request, or prompt injection can poison workspace configuration with destructive commands carrying break-glass flags (e.g. --override or object delete policy). Because human developers or CI runners execute these shortcuts interactively, traditional TTY checks are bypassed. This specification defines a 3-tier security boundary incorporating indirect execution tracking, cryptographic command signatures (zqk tray sign), and Governor pattern enforcement for high-stakes kernel operations.
