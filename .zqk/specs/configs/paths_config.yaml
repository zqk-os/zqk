$schema: "../../../.zqk/cli/specs/schemas/paths_config.schema.json"

description: |
    Configuration for standard directory paths used throughout the system.
    This allows the system to discover directories without hardcoding paths in source code.
paths:
    command_specs: .zqk/cli/specs
    config_dir: .zqk/specs/configs
    id_prefixes_config: .zqk/specs/configs/id_prefixes_config.yaml
    kind_mappings_config: .zqk/specs/configs/kind_mappings_config.yaml
    object_specs: .zqk/specs/objects
    paths_config: .zqk/specs/configs/paths_config.yaml
search_strategy:
    markers:
        - .zqk/specs
        - .zqk
        - go.mod
    relative_paths:
        - ""
        - ../
        - ../../
        - ../../../
version: 1.0.0

