$schema: "../../../.zqk/cli/specs/schemas/id_prefixes_config.schema.json"

default_strategy:
    example: backlog_item -> BAC-
    method: first_part_upper_3
description: |
    Configuration for object kind to ID prefix mappings.
    This allows the system to validate and generate object IDs without hardcoding
    prefix rules in the source code.

    Each kind can have multiple valid prefixes (for backward compatibility or
    migration scenarios). The first prefix listed is considered the primary/current prefix.
inference_rules:
    patterns:
        - example: backlog_item -> BLI-
          pattern: ^(.+)_item$
          prefix_template: '{base_upper_3}-'
        - example: command_metric -> CMD-
          pattern: ^.+_metric$
          prefix_template: '{base_upper_3}-'
        - example: priority_plan -> PRI-
          pattern: ^([^_]+)_.+$
          prefix_template: '{first_part_upper_3}-'
        - example: component -> COM-
          pattern: ^(.+)$
          prefix_template: '{first_3_upper}-'
