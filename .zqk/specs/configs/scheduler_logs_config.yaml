# Scheduler log retention policy.
# Used when writing per-job run logs (.zqk/logs/scheduler/<job-id>/<job-id>.log).
# Override config path via ZQK_SCHEDULER_LOGS_CONFIG.
#
# job_logs:
#   max_lines: keep only the last N JSONL entries per job log file (rolling retention).
#              0 = no trim (unbounded). Default 500 when file missing.

job_logs:
  max_lines: 500

