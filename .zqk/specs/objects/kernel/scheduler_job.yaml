schema_version: 2.0.0
ontology: scheduler_job
extends: base_object
visibility: internal
kernel_critical: false
description: 'Represents a scheduled automation task (context refresh, manifest generation, etc.) with triggers and actions.\nStructural fields (CAS rehash): identity and execution semantics—job_type, trigger_type, command/schedule,\nexecution_mode, callbacks, auth, listeners, routes—anything that changes validation or how the scheduler runs the job.\nRuntime_delta fields (overlay): bounded operational state—status/title (inherited), timestamps, enabled, category,\npriority, log_level, retries, last/next run, max_runtime tuning—high churn without rewriting the structural blob.\nPrivilege Requirements: Read (read:scheduler_job or read:* or admin), Create/Update (write:scheduler_job or write:* or admin), Delete (delete:scheduler_job or delete:* or admin), Execute/Trigger (execute:scheduler_job or execute:* or admin), Manage Scheduler (manage:scheduler or admin).\nLifecycle: scheduler_job_lifecycle.yaml.\n'
traits:
  - base_object_traits
exclude_traits:
  - auto_status_transitionable
fields:
  action_ref:
    access:
      requires:
        - access:confidential
        - role:admin
    checklist:
      authority: admin.
      automation_hooks: used to invoke the action.
      cardinality: zero_or_one
      criticality: composition
      default: null
      dependencies: action registry.
      observability: "yes"
      origin_lifecycle: mutable
      purpose: Reference to the handler/resolver action.
      security: non-sensitive
      system_usage:
        - execution
      validation: Reference format.
    field_profile_code: SCH-003
    permissions: r-x
    semantic_type: reference
    traits:
      - field_mutable_group
      - field_reference_group
    type: string
    validation:
      required: false
  allow_parallel_execution:
