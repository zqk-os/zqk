      requires:
        - access:confidential
        - role:admin
    checklist:
      authority: admin.
      automation_hooks: used for missed-trigger catch-up and conflict manager; when true, multiple instances can run concurrently.
      cardinality: one
      criticality: association
      default: false
      dependencies: scheduler.
      observability: "yes"
      origin_lifecycle: mutable
      purpose: When true, multiple instances of this job may run concurrently (e.g. catch-up triggers for missed runs). When false, scheduler uses job-type default (e.g. cache_prewarm, audit_event_aggregation allow concurrent; run_wrapper does not).
      security: non-sensitive
      system_usage:
        - scheduler
      validation: boolean.
    field_profile_code: SCH-024
    permissions: rwx
    semantic_type: state
    traits:
      - filterable
      - modifiable
