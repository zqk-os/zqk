schema_version: 2.0.0
ontology: department
extends: extensible_object
visibility: public
description: 'Organizational department within a division or organization. Departments are typically smaller organizational units than divisions and can contain teams. '
traits:
  - base_object_traits
fields:
  department_name:
    access:
      requires:
        - access:confidential
    checklist:
      authority: owner
      automation_hooks: used for display and identification
      cardinality: one
      criticality: composition
      default: null
      dependencies: none
      observability: "yes"
      origin_lifecycle: mutable
      purpose: The name of the department
      security: non-sensitive
      system_usage:
        - display
        - identification
        - search
      validation: Must be a non-empty string
    field_profile_code: DEPT-001
    permissions: rwx
    semantic_type: statement
    traits:
      - filterable
      - modifiable
      - readable
      - searchable
      - writable
    type: string
    validation:
      required: true
  division_ref:
    access:
      requires:
        - access:confidential
    checklist:
      authority: owner
      automation_hooks: used for organizational hierarchy navigation
      cardinality: zero_or_one
      criticality: association
      default: null
      dependencies: division registry
      observability: "yes"
      origin_lifecycle: mutable
      purpose: Reference to the division this department belongs to (optional if department is directly under organization)
      security: non-sensitive
      system_usage:
        - organizational hierarchy
        - navigation
        - reporting
      validation: Must reference existing division object ID using domain:organizational:division:{id} format, or null
    field_profile_code: DEPT-002
    permissions: rwx
    semantic_type: reference
    traits:
      - field_mutable_group
      - field_reference_group
    type: reference
    validation:
      required: false
  kernel_goals_refs:
    access:
      requires:
        - access:confidential
    checklist:
      authority: owner
      automation_hooks: used for strategic alignment tracking
      cardinality: many
      criticality: association
      default: []
      dependencies: goal registry
      observability: "yes"
      origin_lifecycle: mutable
      purpose: References to kernel goals that align with this department
      security: non-sensitive
      system_usage:
        - strategic alignment
        - goal tracking
      validation: Must reference existing goal object IDs using zqk:kernel:goal:{id} format
    field_profile_code: DEPT-004
    permissions: rwx
    semantic_type: reference
    traits:
      - field_mutable_group
      - field_reference_group
    type: list
    validation:
      required: false
