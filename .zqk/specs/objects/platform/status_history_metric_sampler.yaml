schema_version: 2.0.0
ontology: status_history_metric_sampler
extends: base_sampler
visibility: internal
description: 'Sampler configuration for status history metric types. Specialized sampler for status/state transition histories. Tracks lifecycle state changes, providing insights into state transition patterns, durations in each state, and transition frequencies. '
traits:
  - base_object_traits
fields:
  batch_size:
    type: string
  flush_interval:
    type: string
  group_by_object_id:
    type: string
  max_batch_size:
    type: string
  metric_type:
    type: string
    validation:
      enum:
        - status_history_metric
      required: true
