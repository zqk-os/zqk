schema_version: 2.0.0
ontology: kind_mapping_metric
extends: base_metric
visibility: internal
description: 'Kind mappings initialization and lookup metrics. Tracks config loading, backend operations, mapping lookups, cache performance, initialization duration, and discovery operations for monitoring the kind-to-directory mapping system performance and reliability. '
traits:
  - listable
  - readable
  - writable
  - modifiable
  - formatable
  - groupable
  - filterable
  - sortable
  - searchable
fields:
  backend_config_merges:
    access:
      requires:
        - access:confidential
    checklist:
      authority: automation (kind mappings system)
      automation_hooks: used for config merge frequency analysis.
      cardinality: one
      criticality: association
      default: 0
      dependencies: kind mappings configuration system.
      observability: "yes"
      origin_lifecycle: mutable (incremented on each config merge)
      purpose: Total number of backend config merges performed.
      security: non-sensitive
      system_usage:
        - configuration analysis
        - performance monitoring
      validation: Non-negative integer.
    field_profile_code: KMM-005
    permissions: rwx
    semantic_type: measurement
    traits:
      - listable
      - readable
      - writable
      - filterable
      - sortable
    type: integer
    validation:
      required: true
  backend_switches:
