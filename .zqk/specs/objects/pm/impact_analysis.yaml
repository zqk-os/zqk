schema_version: 2.0.0
ontology: impact_analysis
extends: base_object
visibility: public
description: 'Stores impact analysis results including affected objects, impact severity, and recommended actions. Used to analyze and document the effects of organizational changes, schema changes, or other system modifications. '
traits:
  - base_object_traits
fields:
  affected_objects:
    access:
      requires:
        - access:confidential
    checklist:
      authority: automation
      automation_hooks: used for impact propagation and reporting
      cardinality: one
      criticality: composition
      default: {}
      dependencies: object registries
      observability: "yes"
      origin_lifecycle: mutable
      purpose: Map of affected kernel objects organized by type (workstreams, goals, backlog_items, milestones, etc.)
      security: non-sensitive
      system_usage:
        - impact analysis
        - change propagation
        - reporting
      validation: Map with keys representing object types and values being lists of object references
    field_profile_code: IMP-003
    permissions: rwx
    semantic_type: expression
    traits:
      - readable
      - writable
      - modifiable
    type: map
    validation:
      required: false
  change_ref:
    access:
      requires:
        - access:confidential
    checklist:
      authority: automation
      automation_hooks: used to link analysis to source change
      cardinality: one
      criticality: composition
      default: null
      dependencies: change tracking system
      observability: "yes"
      origin_lifecycle: immutable
      purpose: Reference to the change object that triggered this impact analysis
      security: non-sensitive
      system_usage:
        - traceability
        - change tracking
        - impact analysis
      validation: Must reference an existing change object ID
    field_profile_code: IMP-001
    permissions: rwx
    semantic_type: reference
    traits:
      - field_reference_group
      - writable
    type: string
    validation:
      required: false
  change_type:
    access:
      requires:
        - access:confidential
    checklist:
      authority: automation
      automation_hooks: used for categorization and filtering
      cardinality: one
      criticality: composition
      default: null
      dependencies: none
      observability: "yes"
      origin_lifecycle: immutable
      purpose: Type of change that triggered this analysis (e.g., division_restructure, schema_change, organizational_change)
      security: non-sensitive
      system_usage:
        - categorization
        - filtering
        - reporting
      validation: Free-form string describing the change type
    field_profile_code: IMP-002
    permissions: rwx
    semantic_type: statement
    traits:
      - readable
      - writable
      - filterable
      - searchable
      - sortable
    type: string
    validation:
      required: false
  impact_categories:
    access:
      requires:
        - access:confidential
    checklist:
      authority: automation
      automation_hooks: used for impact categorization and severity analysis
      cardinality: many
      criticality: composition
      default: []
      dependencies: none
      observability: "yes"
      origin_lifecycle: mutable
      purpose: List of impact categories with severity, affected count, and descriptions
      security: non-sensitive
      system_usage:
        - impact analysis
        - severity tracking
        - reporting
      validation: List of objects with category, severity, affected_count, and description fields
    field_profile_code: IMP-004
    permissions: rwx
    semantic_type: expression
    traits:
      - readable
      - writable
      - modifiable
    type: list
    validation:
      required: false
  recommended_actions:
    access:
      requires:
        - access:confidential
    checklist:
      authority: automation
      automation_hooks: used for automated change propagation and workflow
      cardinality: many
      criticality: composition
      default: []
      dependencies: none
      observability: "yes"
      origin_lifecycle: mutable
      purpose: List of recommended actions to address the impacts, including action type, priority, and affected objects
      security: non-sensitive
      system_usage:
        - change propagation
        - workflow automation
        - reporting
      validation: List of objects with action, priority, and affected_objects fields
    field_profile_code: IMP-005
    permissions: rwx
    semantic_type: expression
    traits:
      - readable
      - writable
      - modifiable
    type: list
    validation:
      required: false
