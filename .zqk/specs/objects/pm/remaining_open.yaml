schema_version: 2.0.0
ontology: remaining_open
extends: work_interval
visibility: internal
description: 'Mixin for remaining-open cardinality (remaining_open_count). open_countable means the container''s behavior changes when the count hits zero. Membership stays child→parent (not stored here). Not instantiable (kind_mappings skip_specs). Compose onto Gantt containers that complete when members drain (priority_plan). Parallel: occupancy houses claimed_by / claimed_at. TRACK: POL-ARCH-20260901 / BLI-CEF-CONTAINER-REMAINING-OPEN-001. '
traits:
  - open_countable
fields:
  remaining_open_count:
    checklist:
      authority: system/lifecycle.
      automation_hooks: open_countable last-child complete; seed at execution lock; increment on reopen/override-add.
      cardinality: one
      criticality: composition
      default: null (unset until execution-locked; then non-negative integer)
      dependencies: open_countable trait; member terminal hops.
      observability: "yes"
      origin_lifecycle: mutable
      purpose: Count of linked members still open (non-terminal). Behavior of this container changes when the count hits zero (complete). Not membership refs.
      security: non-sensitive
      system_usage:
        - lifecycle
        - shockwave
        - completeness
      validation: Non-negative integer when set. Unset means the interpreter has not seeded this instance.
    field_profile_code: ROC-001
    permissions: rwx
    semantic_type: quantity
    traits:
      - filterable
      - groupable
      - listable
      - modifiable
      - readable
      - searchable
      - sortable
      - writable
    type: integer
    validation:
      required: false
