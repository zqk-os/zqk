$schema: "../../../.zqk/cli/specs/schemas/lifecycle_spec.schema.json"

object_type: mcp_session
# Five-question exam: docs/architecture/LIFECYCLE_STATE_MACHINE_RUBRIC.md
# TRACK: BLI-CEF-R26-REMAINING-KINDS-001
statuses:
  - value: conceptual
    display: Conceptual
    origin: true
    preliminary: true
    description: Draft plane status. Prior to CAS membrane crossing.
    role: realign
  - value: originated
    display: Originated
    description: CAS membrane crossed. Object officially originated.
    role: realign
  - value: in_progress
    display: In Progress
    origin: false
    description: Session is active; client is connected.
    role: execution_locked
  - value: disconnected
    display: Disconnected
    terminal: true
    description: Client disconnected; set by MCP server on EOF, idle timeout, or
      shutdown. Eligible for retention prune.
    role: terminal
  - value: archived
    display: Archived
    terminal: true
    archive: true
    description: Session archived (e.g. by retention or manual). Eligible for 
      cleanup.
    role: terminal
  - value: error
    display: Error
    system: true
    description: System error occurred during session handling.
    role: halted
transitions:
  - from: conceptual
    to: originated
    description: Promote from draft plane to CAS membrane (CAS Qualification).
    manual: true
    auto: false
    catalyst: System promotion
  - from: originated
    to: in_progress
    description: Initial domain workflow transition to in_progress.
    manual: true
    auto: true
    catalyst: System initialization
  - from: in_progress
    to: disconnected
    description: Client disconnected (EOF, idle timeout, or explicit shutdown)
    manual: false
    auto: true
    postconditions:
      - role is terminal
  - from: in_progress
    to: archived
    description: Archive session (manual or retention)
    manual: true
    auto: false
    postconditions:
      - role is terminal
      - ended; no further normal execution hops expected
  - from: disconnected
    to: archived
    description: Archive disconnected session
    manual: true
    auto: false
    postconditions:
      - role is terminal
      - ended; no further normal execution hops expected
  - from: '*'
    to: error
    description: System error occurred
    manual: false
    auto: true
    postconditions:
      - role is halted
      - hop from any occupancy to error
      - system halt; repair before leaving halted
percent_complete:
  method: status_defaults
  default_by_status:
    conceptual: 0
    originated: 5
    in_progress: 0
    disconnected: 100
    archived: 100
    error: 0
