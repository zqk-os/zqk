$schema: "../../../.zqk/cli/specs/schemas/lifecycle_spec.schema.json"

# TRACK: BLI-COMMS-TPM-LIVE-WAKE-001 — agent_skill lifecycle was missing; CAS gate
# rejected approved/in_progress/implemented skills ("no lifecycle status meta").
# Aligns with base_object statuses used by existing agent_skill instances.
object_type: agent_skill
# Five-question exam: docs/architecture/LIFECYCLE_STATE_MACHINE_RUBRIC.md
# TRACK: BLI-CEF-R26-REMAINING-KINDS-001
extends: base_lifecycle
statuses:
  - value: conceptual
    display: Conceptual
    origin: true
    preliminary: true
    description: Draft plane status. Prior to CAS membrane crossing.
    role: realign
  - value: originated
    display: Originated
    description: CAS membrane crossed. Object officially originated.
    role: realign
  - value: proposed
    display: Proposed
    origin: false
    preliminary: false
    description: "agent_skill status 'proposed': draft instructions; not yet pickup-ready.
      Flags: origin, preliminary."
    role: realign
  - value: approved
    display: Approved
    description: "agent_skill status 'approved': ready for persona binding / seat
      use."
    role: shovel_ready
  - value: in_progress
    display: In Progress
    description: "agent_skill status 'in_progress': actively refined or mid-rollout."
    role: execution_locked
  - value: implemented
    display: Implemented
    terminal: true
    description: "agent_skill status 'implemented': stable operating skill."
    role: terminal
  - value: archived
    display: Archived
    terminal: true
    archive: true
    description: "agent_skill status 'archived': retained for lineage; not dispatchable."
    role: terminal
  - value: error
    display: Error
    system: true
    description: "agent_skill status 'error': system-held; repair before use."
    role: halted
transitions:
  - from: conceptual
    to: originated
    description: Promote from draft plane to CAS membrane (CAS Qualification).
    manual: true
    auto: false
    catalyst: System promotion
  - from: originated
    to: proposed
    description: Initial domain workflow transition to proposed.
    manual: true
    auto: true
    catalyst: System initialization
  - from: proposed
    to: approved
    description: Approve skill for use
    manual: true
    auto: false
    postconditions:
      - role is shovel_ready
  - from: approved
    to: in_progress
    description: Begin active rollout or refinement
    manual: true
    auto: false
    postconditions:
      - role is execution_locked
  - from: in_progress
    to: implemented
    description: Mark skill as stably implemented
    manual: true
    auto: false
    postconditions:
      - role is terminal
  - from: '*'
    to: archived
    description: Archive skill from any status
    manual: true
    auto: false
    postconditions:
      - role is terminal
      - hop from any occupancy to archived
      - ended; no further normal execution hops expected
  - from: '*'
    to: error
    description: System error
    manual: false
    auto: true
    postconditions:
      - role is halted
      - hop from any occupancy to error
      - system halt; repair before leaving halted
  # TRACK: BLI-1785723654802038000-b14064bc — recover from error
  - from: error
    to: approved
    description: Recover from system error after repair
    manual: true
    auto: false
    postconditions:
      - role is shovel_ready
      - recover from system halt after repair
percent_complete:
  method: status_defaults
  default_by_status:
    conceptual: 0
    originated: 5
    approved: 25
    archived: 100
    error: 0
    implemented: 100
    in_progress: 50
    proposed: 15
created_at: 2026-08-06T09:05:00Z
updated_at: 2026-08-06T09:05:00Z
created_by: ACC-SYSTEM
updated_by: ACC-SYSTEM
