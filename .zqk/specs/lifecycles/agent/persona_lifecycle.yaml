$schema: "../../../.zqk/cli/specs/schemas/lifecycle_spec.schema.json"

# TRACK: BLI-1785904242062561000-ec024787 — persona lifecycle was missing; CAS gate
# rejected approved/implemented personas ("no lifecycle status meta"). Aligns with
# base_object statuses used by existing persona instances.
object_type: persona
# Five-question exam: docs/architecture/LIFECYCLE_STATE_MACHINE_RUBRIC.md
# TRACK: BLI-CEF-R26-REMAINING-KINDS-001
extends: base_lifecycle
statuses:
  - value: conceptual
    display: Conceptual
    origin: true
    preliminary: true
    description: Draft plane status. Prior to CAS membrane crossing.
    role: realign
  - value: originated
    display: Originated
    description: CAS membrane crossed. Object officially originated.
    role: realign
  - value: proposed
    display: Proposed
    origin: false
    preliminary: false
    description: "persona status 'proposed': not yet committed; reshape before pickup.
      Flags: origin, preliminary."
    role: realign
  - value: approved
    display: Approved
    description: "persona status 'approved': ready for seat/dispatch when CRI-PERSONA-SKILL-BOUND
      holds."
    role: shovel_ready
  - value: in_progress
    display: In Progress
    description: "persona status 'in_progress': actively seated or mid-binding."
    role: execution_locked
  - value: implemented
    display: Implemented
    terminal: true
    description: "persona status 'implemented': stable operating persona."
    role: terminal
  - value: archived
    display: Archived
    terminal: true
    archive: true
    description: "persona status 'archived': retained for lineage; not dispatchable."
    role: terminal
  - value: error
    display: Error
    system: true
    description: "persona status 'error': system-held; repair before use."
    role: halted
transitions:
  - from: conceptual
    to: originated
    description: Promote from draft plane to CAS membrane (CAS Qualification).
    manual: true
    auto: false
    catalyst: System promotion
  - from: originated
    to: proposed
    description: Initial domain workflow transition to proposed.
    manual: true
    auto: true
    catalyst: System initialization
  - from: proposed
    to: approved
    description: Approve persona for use
    manual: true
    auto: false
    postconditions:
      - role is shovel_ready
  - from: approved
    to: in_progress
    description: Seat or activate persona
    manual: true
    auto: false
    postconditions:
      - role is execution_locked
  - from: in_progress
    to: implemented
    description: Mark persona as stably implemented
    manual: true
    auto: false
    postconditions:
      - role is terminal
  - from: '*'
    to: archived
    description: Archive persona from any status
    manual: true
    auto: false
    postconditions:
      - role is terminal
      - hop from any occupancy to archived
      - ended; no further normal execution hops expected
  - from: '*'
    to: error
    description: System error
    manual: false
    auto: true
    postconditions:
      - role is halted
      - hop from any occupancy to error
      - system halt; repair before leaving halted
  # TRACK: BLI-1785723654802038000-b14064bc — recover from error
  - from: error
    to: approved
    description: Recover from system error after repair
    manual: true
    auto: false
    postconditions:
      - role is shovel_ready
      - recover from system halt after repair
percent_complete:
  method: status_defaults
  default_by_status:
    conceptual: 0
    originated: 5
    approved: 25
    archived: 100
    error: 0
    implemented: 100
    in_progress: 50
    proposed: 15
