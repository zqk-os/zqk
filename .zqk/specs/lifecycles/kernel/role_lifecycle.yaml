$schema: ../../../.zqk/cli/specs/schemas/lifecycle_spec.schema.json
object_type: role
statuses:
  - value: conceptual
    display: Conceptual
    origin: true
    preliminary: true
    description: Draft plane status. Prior to CAS membrane crossing.
    role: realign
  - value: originated
    display: Originated
    description: CAS membrane crossed. Object officially originated.
    role: realign
  - value: draft
    display: Draft
    origin: false
    preliminary: false
    role: realign
    description: 'role status ''draft'' (Draft): not yet committed for execution;
      reshape before pickup.'
  - value: active
    display: Active
    role: enforced
    description: 'Role is live and bindable to personas/accounts. Catalyst: qualifying
      exam that the role''s duties and permissions are named. Postcondition: CAS-visible
      and no longer on the object draft plane. Not Gantt shovel-ready. Class role
      enforced (membrane live).'
  - value: archived
    display: Archived
    terminal: true
    archive: true
    role: terminal
    description: 'role status ''archived'' (Archived): ended; no further normal execution
      transitions expected. Flags: archive, terminal.'
  - value: error
    display: Error
    system: true
    role: halted
    description: 'role status ''error'' (Error): paused or system-held for repair;
      resolve before advancing. Flags: system-assigned.'
transitions:
  - from: conceptual
    to: originated
    description: Promote from draft plane to CAS membrane (CAS Qualification).
    manual: true
    auto: false
    catalyst: System promotion
  - from: originated
    to: draft
    description: Initial domain workflow transition to draft.
    manual: true
    auto: true
    catalyst: System initialization
  - from: draft
    to: active
    description: Activate role
    manual: true
    auto: false
    postconditions:
  - from: draft
    to: archived
    description: Park/discard draft role without activating (fixture quarantine,
      abandoned draft)
    manual: true
    auto: false
  - from: active
    to: archived
    description: Archive role
    manual: true
    auto: false
  - from: '*'
    to: error
    description: System error occurred
    manual: false
    auto: true
percent_complete:
  method: status_defaults
  default_by_status:
    conceptual: 0
    originated: 5
    active: 100
    archived: 100
    draft: 10
    error: 0
created_at: 2026-07-01 18:00:00+00:00
updated_at: 2026-07-01 18:00:00+00:00
