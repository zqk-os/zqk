$schema: "../../../.zqk/cli/specs/schemas/lifecycle_spec.schema.json"

object_type: keystore_entry
# Five-question exam: docs/architecture/LIFECYCLE_STATE_MACHINE_RUBRIC.md
# TRACK: kernel-backlog
statuses:
  - value: conceptual
    display: Conceptual
    origin: true
    preliminary: true
    description: Draft plane status. Prior to CAS membrane crossing.
    role: realign
  - value: originated
    display: Originated
    description: CAS membrane crossed. Object officially originated.
    role: realign
  - value: active
    display: Active
    origin: false
    description: Key is active and can be used for authentication
    role: shovel_ready
  - value: revoked
    display: Revoked
    description: Key has been revoked and cannot be used
    role: realign
  - value: archived
    display: Archived
    terminal: true
    archive: true
    description: Key has been permanently archived and removed
    role: terminal
  - value: error
    display: Error
    system: true
    description: Key encountered an error during creation or validation
    role: halted
transitions:
  - from: conceptual
    to: originated
    description: Promote from draft plane to CAS membrane (CAS Qualification).
    manual: true
    auto: false
    catalyst: System promotion
  - from: originated
    to: active
    description: Initial domain workflow transition to active.
    manual: true
    auto: true
    catalyst: System initialization
  - from: active
    to: revoked
    description: Revoke the key (marks as revoked, cannot be used)
    manual: true
    auto: false
    postconditions:
      - role is realign
  - from: revoked
    to: active
    description: Re-activate a revoked key
    manual: true
    auto: false
    postconditions:
      - role is shovel_ready
  - from: '*'
    to: archived
    description: Archive the key permanently
    manual: true
    auto: false
    postconditions:
      - role is terminal
      - hop from any occupancy to archived
      - ended; no further normal execution hops expected
  - from: '*'
    to: error
    description: Key encountered a system error
    manual: false
    auto: true
    postconditions:
      - role is halted
      - hop from any occupancy to error
      - system halt; repair before leaving halted
percent_complete:
  method: status_defaults
  default_by_status:
    conceptual: 0
    originated: 5
    active: 100
    archived: 100
    error: 0
    revoked: 0
created_at: 2026-07-01T18:00:00Z
updated_at: 2026-07-01T18:00:00Z
created_by: ACC-SYSTEM
updated_by: ACC-SYSTEM
