$schema: "../../../.zqk/cli/specs/schemas/lifecycle_spec.schema.json"

object_type: account
# Five-question exam: docs/architecture/LIFECYCLE_STATE_MACHINE_RUBRIC.md
# TRACK: BLI-CEF-R26-REMAINING-KINDS-001
statuses:
  - value: conceptual
    display: Conceptual
    origin: true
    preliminary: true
    description: Draft plane status. Prior to CAS membrane crossing.
    role: realign
  - value: originated
    display: Originated
    description: CAS membrane crossed. Object officially originated.
    role: realign
  - value: active
    display: Active
    origin: false
    role: shovel_ready
    description: Account may authenticate and act within its roles.
  - value: inactive
    display: Inactive
    role: realign
    description: Account retained but not expected to act until reactivated.
  - value: suspended
    display: Suspended
    role: realign
    description: Account barred from action; administrative or security hold.
transitions:
  - from: conceptual
    to: originated
    description: Promote from draft plane to CAS membrane (CAS Qualification).
    manual: true
    auto: false
    catalyst: System promotion
  - from: originated
    to: active
    description: Initial domain workflow transition to active.
    manual: true
    auto: true
    catalyst: System initialization
  - from: active
    to: inactive
    description: ""
    manual: false
    auto: false
    postconditions:
      - role is realign
  - from: active
    to: suspended
    description: ""
    manual: false
    auto: false
    postconditions:
      - role is realign
  - from: inactive
    to: active
    description: ""
    manual: false
    auto: false
    postconditions:
      - role is shovel_ready
  - from: suspended
    to: active
    description: ""
    manual: false
    auto: false
    postconditions:
      - role is shovel_ready
percent_complete:
  method: status_based
  default_by_status:
    conceptual: 0
    originated: 5
    active: 100
    inactive: 50
    suspended: 0
