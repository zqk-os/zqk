$schema: "../../../.zqk/cli/specs/schemas/lifecycle_spec.schema.json"

object_type: change_journal_entry
# Five-question exam: docs/architecture/LIFECYCLE_STATE_MACHINE_RUBRIC.md
# TRACK: kernel-backlog
statuses:
  - value: conceptual
    display: Conceptual
    origin: true
    preliminary: true
    description: Draft plane status. Prior to CAS membrane crossing.
    role: realign
  - value: originated
    display: Originated
    description: CAS membrane crossed. Object officially originated.
    role: realign
  - value: pending
    display: Pending
    origin: false
    preliminary: false
    role: realign
    description: "change journal entry status 'pending' (Pending): not yet committed
      for execution; reshape before pickup."
  - value: completed
    display: Completed
    terminal: true
    role: terminal
    description: "change journal entry status 'completed' (Completed): ended; no further
      normal execution transitions expected."
  - value: aggregated
    display: Aggregated
    terminal: true
    description: Entry has been aggregated into an aggregation metric (time 
      window); eligible for compaction or cleanup.
    role: terminal
  - value: failed
    display: Failed
    terminal: true
    role: terminal
    description: "change journal entry status 'failed' (Failed): ended; no further
      normal execution transitions expected. Flags: terminal."
  - value: reverted
    display: Reverted
    terminal: true
    role: terminal
    description: "change journal entry status 'reverted' (Reverted): ended; no further
      normal execution transitions expected. Flags: terminal."
  - value: archived
    display: Archived
    terminal: true
    archive: true
    role: terminal
    description: "change journal entry status 'archived' (Archived): ended; no further
      normal execution transitions expected. Flags: archive, terminal."
  - value: error
    display: Error
    system: true
    role: halted
    description: "change journal entry status 'error' (Error): paused or system-held
      for repair; resolve before advancing. Flags: system-assigned."
transitions:
  - from: conceptual
    to: originated
    description: Promote from draft plane to CAS membrane (CAS Qualification).
    manual: true
    auto: false
    catalyst: System promotion
  - from: originated
    to: pending
    description: Initial domain workflow transition to pending.
    manual: true
    auto: true
    catalyst: System initialization
  - from: pending
    to: completed
    description: Change journal entry operation completed successfully
    manual: false
    auto: false
    postconditions:
      - role is terminal
  - from: pending
    to: failed
    description: Change journal entry operation failed
    manual: false
    auto: false
    postconditions:
      - role is terminal
  - from: completed
    to: reverted
    description: Completed change journal entry is reverted
    manual: false
    auto: false
    postconditions:
      - role is terminal
  - from: completed
    to: aggregated
    description: Entry aggregated into metric (change_journal_aggregation job)
    manual: false
    auto: true
    postconditions:
      - role is terminal
  - from: '*'
    to: archived
    description: Change journal entry is archived (retention policy)
    manual: false
    auto: false
    postconditions:
      - role is terminal
      - hop from any occupancy to archived
      - ended; no further normal execution hops expected
  - from: '*'
    to: error
    description: System error occurred
    manual: false
    auto: true
    postconditions:
      - role is halted
      - hop from any occupancy to error
      - system halt; repair before leaving halted
percent_complete:
  method: status_defaults
  default_by_status:
    conceptual: 0
    originated: 5
    archived: 100
    completed: 100
    error: 0
    failed: 0
    pending: 20
    reverted: 0
