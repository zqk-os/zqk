$schema: "../../../.zqk/cli/specs/schemas/lifecycle_spec.schema.json"

object_type: auth_strategy
# Five-question exam: docs/architecture/LIFECYCLE_STATE_MACHINE_RUBRIC.md
# TRACK: kernel-backlog
statuses:
  - value: conceptual
    display: Conceptual
    origin: true
    preliminary: true
    description: Draft plane status. Prior to CAS membrane crossing.
    role: realign
  - value: originated
    display: Originated
    description: CAS membrane crossed. Object officially originated.
    role: realign
  - value: active
    display: Active
    origin: false
    description: Strategy is enabled and can be used for authentication
    role: shovel_ready
  - value: disabled
    display: Disabled
    description: Strategy is temporarily disabled and cannot be used
    role: halted
  - value: archived
    display: Archived
    terminal: true
    archive: true
    description: Strategy has been deprecated and is no longer used
    role: terminal
  - value: error
    display: Error
    system: true
    description: Strategy encountered an error during configuration or 
      validation
    role: halted
transitions:
  - from: conceptual
    to: originated
    description: Promote from draft plane to CAS membrane (CAS Qualification).
    manual: true
    auto: false
    catalyst: System promotion
  - from: originated
    to: active
    description: Initial domain workflow transition to active.
    manual: true
    auto: true
    catalyst: System initialization
  - from: active
    to: disabled
    description: Disable the strategy (temporarily disable authentication)
    manual: true
    auto: false
    postconditions:
      - role is halted
  - from: disabled
    to: active
    description: Re-enable a disabled strategy
    manual: true
    auto: false
    postconditions:
      - role is shovel_ready
  - from: '*'
    to: archived
    description: Archive the strategy permanently (deprecate it)
    manual: true
    auto: false
    postconditions:
      - role is terminal
      - hop from any occupancy to archived
      - ended; no further normal execution hops expected
  - from: '*'
    to: error
    description: Strategy encountered a system error or validation failure
    manual: false
    auto: true
    postconditions:
      - role is halted
      - hop from any occupancy to error
      - system halt; repair before leaving halted
percent_complete:
  method: status_defaults
  default_by_status:
    conceptual: 0
    originated: 5
    active: 100
    archived: 100
    disabled: 0
    error: 0
