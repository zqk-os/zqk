$schema: ../../../.zqk/cli/specs/schemas/lifecycle_spec.schema.json
object_type: policy
statuses:
  - value: conceptual
    display: Conceptual
    origin: true
    preliminary: true
    description: Draft plane status. Prior to CAS membrane crossing.
    role: realign
  - value: originated
    display: Originated
    description: CAS membrane crossed. Object officially originated.
    role: realign
  - value: draft
    display: Draft
    origin: false
    preliminary: false
    role: realign
    description: 'policy status ''draft'' (Draft): not yet committed for execution;
      reshape before pickup.'
  - value: under_review
    display: Under Review
    role: realign
    description: 'policy status ''under_review'' (Under Review): not yet committed
      for execution; reshape before pickup.'
  - value: active
    display: Active
    role: enforced
    description: "policy status 'active' (Active): membrane live / enforced — not
      Gantt shovel-ready. Class role enforced (TRACK: BLI-CEF-R26-POLICY-PRI-EXAM-001).
      See docs/architecture/LIFECYCLE_STATE_MACHINE_RUBRIC.md and POLICY_LIFECYCLE.md."
  - value: deprecated
    display: Deprecated
    role: realign
    description: 'policy status ''deprecated'' (Deprecated): not yet committed for
      execution; reshape before pickup.'
  - value: superseded
    display: Superseded
    role: realign
    description: 'policy status ''superseded'' (Superseded): not yet committed for
      execution; reshape before pickup.'
  - value: archived
    display: Archived
    terminal: true
    role: terminal
    description: 'policy status ''archived'' (Archived): ended; no further normal
      execution transitions expected. Flags: terminal.'
transitions:
  - from: conceptual
    to: originated
    description: Promote from draft plane to CAS membrane (CAS Qualification).
    manual: true
    auto: false
    catalyst: System promotion
  - from: originated
    to: draft
    description: Initial domain workflow transition to draft.
    manual: true
    auto: true
    catalyst: System initialization
  - from: draft
    to: under_review
    description: Submit policy for review
    manual: true
    auto: false
  - from: under_review
    to: active
    description: Activate policy (approved and effective)
    manual: true
    auto: false
    postconditions:
      - role is enforced
  - from: active
    to: under_review
    description: Policy updated - return to review
    manual: true
    auto: false
  - from: active
    to: deprecated
    description: Deprecate policy (no longer applicable but kept for reference)
    manual: true
    auto: false
  - from: active
    to: superseded
    description: Policy superseded by new policy
    manual: true
    auto: false
  - from: under_review
    to: active
    description: Policy effective date reached - activate if in review
    manual: false
    auto: true
    postconditions:
      - role is enforced
  - from: '*'
    to: archived
    description: Manual archival
    manual: true
    auto: false
percent_complete:
  method: status_defaults
  default_by_status:
    conceptual: 0
    originated: 5
    draft: 10
    under_review: 40
    active: 100
    deprecated: 100
    superseded: 100
    archived: 100
created_at: 2026-07-01 18:00:00+00:00
updated_at: 2026-07-01 18:00:00+00:00
created_by: ACC-SYSTEM
updated_by: ACC-SYSTEM
