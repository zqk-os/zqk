$schema: "../../../.zqk/cli/specs/schemas/lifecycle_spec.schema.json"

object_type: decision
# Five-question exam: docs/architecture/LIFECYCLE_STATE_MACHINE_RUBRIC.md
# TRACK: BLI-CEF-R26-REMAINING-KINDS-001
statuses:
  - value: conceptual
    display: Conceptual
    origin: true
    preliminary: true
    description: Draft plane status. Prior to CAS membrane crossing.
    role: realign
  - value: originated
    display: Originated
    description: CAS membrane crossed. Object officially originated.
    role: realign
  - value: draft
    display: Draft
    origin: false
    preliminary: false
    role: realign
    description: "decision status 'draft' (Draft): not yet committed for execution;
      reshape before pickup."
  - value: under_review
    display: Under Review
    role: realign
    description: "decision status 'under_review' (Under Review): not yet committed
      for execution; reshape before pickup."
  - value: active
    display: Active
    role: shovel_ready
    description: "decision status 'active' (Active): ready for pickup or use; not
      locked mid-flight."
  - value: approved
    display: Approved
    terminal: true
    role: terminal
    description: "decision status 'approved' (Approved): ended; no further normal
      execution transitions expected. Flags: terminal."
  - value: rejected
    display: Rejected
    terminal: true
    role: terminal
    description: "decision status 'rejected' (Rejected): ended; no further normal
      execution transitions expected. Flags: terminal."
  - value: archived
    display: Archived
    terminal: true
    role: terminal
    description: "decision status 'archived' (Archived): ended; no further normal
      execution transitions expected. Flags: terminal."
transitions:
  - from: conceptual
    to: originated
    description: Promote from draft plane to CAS membrane (CAS Qualification).
    manual: true
    auto: false
    catalyst: System promotion
  - from: originated
    to: draft
    description: Initial domain workflow transition to draft.
    manual: true
    auto: true
    catalyst: System initialization
  - from: draft
    to: under_review
    description: Submit draft for review
    manual: true
    auto: false
    postconditions:
      - role is realign
  - from: under_review
    to: active
    description: Activate decision (move to active)
    manual: true
    auto: false
    postconditions:
      - role is shovel_ready
  - from: under_review
    to: approved
    description: Approve decision
    manual: true
    auto: false
    postconditions:
      - role is terminal
  - from: active
    to: approved
    description: Approve from active
    manual: true
    auto: false
    postconditions:
      - role is terminal
  - from: under_review
    to: rejected
    description: Reject decision
    manual: true
    auto: false
    postconditions:
      - role is terminal
  - from: active
    to: rejected
    description: Reject from active
    manual: true
    auto: false
    postconditions:
      - role is terminal
  - from: '*'
    to: archived
    description: Manual archival from any status
    manual: true
    auto: false
    postconditions:
      - role is terminal
      - hop from any occupancy to archived
      - ended; no further normal execution hops expected
percent_complete:
  method: status_defaults
  default_by_status:
    conceptual: 0
    originated: 5
    draft: 10
    under_review: 40
    active: 80
    approved: 100
    rejected: 0
    archived: 100
created_at: 2026-07-01T18:00:00Z
updated_at: 2026-07-01T18:00:00Z
created_by: ACC-SYSTEM
updated_by: ACC-SYSTEM
