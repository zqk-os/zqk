$schema: ../../../.zqk/cli/specs/schemas/lifecycle_spec.schema.json
object_type: roadmap
statuses:
  - value: conceptual
    display: Conceptual
    origin: true
    preliminary: true
    description: Draft plane status. Prior to CAS membrane crossing.
    role: realign
  - value: originated
    display: Originated
    description: CAS membrane crossed. Object officially originated.
    role: realign
  - value: draft
    display: Draft
    origin: false
    preliminary: false
    role: realign
    description: 'roadmap status ''draft'' (Draft): not yet committed for execution;
      reshape before pickup.'
  - value: active
    display: Active
    description: 'roadmap status ''active'' (Active): ready for pickup or use; not
      locked mid-flight.'
    role: shovel_ready
  - value: published
    display: Published
    description: 'roadmap status ''published'' (Published): not yet committed for
      execution; reshape before pickup.'
    role: realign
  - value: complete
    display: Complete
    terminal: true
    work_done: true
    role: terminal
    description: 'roadmap status ''complete'' (Complete): ended; no further normal
      execution transitions expected. Flags: terminal.'
  - value: archived
    display: Archived
    terminal: true
    role: terminal
    description: 'roadmap status ''archived'' (Archived): ended; no further normal
      execution transitions expected. Flags: terminal.'
    shockwave:
      mode: shared
      fail: open
transitions:
  - from: conceptual
    to: originated
    description: Promote from draft plane to CAS membrane (CAS Qualification).
    manual: true
    auto: false
    catalyst: System promotion
    postconditions:
      - role is realign
    class_vs_specialty: class-agnostic
    shockwave:
      mode: propagate
  - from: originated
    to: draft
    description: Initial domain workflow transition to draft.
    manual: true
    auto: true
    catalyst: System initialization
    postconditions:
      - role is realign
    class_vs_specialty: class-agnostic
    shockwave:
      mode: propagate
  - from: draft
    to: published
    description: Manual publication from draft
    manual: true
    auto: false
    postconditions:
      - role is realign
    catalyst: Standard progression
    class_vs_specialty: class-agnostic
    shockwave:
      mode: propagate
  - from: published
    to: active
    description: Manual activation from published
    manual: true
    auto: false
    postconditions:
      - role is shovel_ready
    catalyst: Standard progression
    class_vs_specialty: class-agnostic
    shockwave:
      mode: propagate
  - from: active
    to: complete
    description: Auto-transition when all linked milestones are complete
    manual: false
    auto: true
    postconditions:
      - role is terminal
    catalyst: Standard progression
    class_vs_specialty: class-agnostic
    shockwave:
      mode: propagate
  - from: '*'
    to: archived
    description: Manual archival from any status
    manual: true
    auto: false
    postconditions:
      - role is terminal
    catalyst: Standard progression
    class_vs_specialty: class-agnostic
    shockwave:
      mode: propagate
percent_complete:
  method: milestone_based
  default_by_status:
    conceptual: 0
    originated: 5
    active: calculated
    archived: 100
    complete: 100
    draft: 10
    published: calculated
  milestone_based:
    calculation: (completed_milestones / total_milestones) * 100
    field: milestone_refs
    weighted_by_stage_type: false
created_at: 2026-07-01 18:00:00+00:00
updated_at: 2026-07-01 18:00:00+00:00
created_by: ACC-SYSTEM
updated_by: ACC-SYSTEM
