$schema: "../../../.zqk/cli/specs/schemas/lifecycle_spec.schema.json"

object_type: mission
# Five-question exam: docs/architecture/LIFECYCLE_STATE_MACHINE_RUBRIC.md
# TRACK: BLI-CEF-R26-REMAINING-KINDS-001
statuses:
  - value: conceptual
    display: Conceptual
    origin: true
    preliminary: true
    description: Draft plane status. Prior to CAS membrane crossing.
    role: realign
  - value: originated
    display: Originated
    description: CAS membrane crossed. Object officially originated.
    role: realign
  - value: draft
    display: Draft
    origin: false
    preliminary: false
    role: realign
    description: "mission status 'draft' (Draft): not yet committed for execution;
      reshape before pickup."
  - value: active
    display: Active
    role: shovel_ready
    description: "mission status 'active' (Active): ready for pickup or use; not locked
      mid-flight."
  - value: archived
    display: Archived
    terminal: true
    archive: true
    role: terminal
    description: "mission status 'archived' (Archived): ended; no further normal execution
      transitions expected. Flags: archive, terminal."
    shockwave:
      mode: prune
      fail: closed
  - value: error
    display: Error
    system: true
    role: halted
    description: "mission status 'error' (Error): paused or system-held for repair;
      resolve before advancing. Flags: system-assigned."
transitions:
  - from: conceptual
    to: originated
    description: Promote from draft plane to CAS membrane (CAS Qualification).
    manual: true
    auto: false
    catalyst: System promotion
  - from: originated
    to: draft
    description: Initial domain workflow transition to draft.
    manual: true
    auto: true
    catalyst: System initialization
  - from: draft
    to: active
    description: Mission is published and active
    manual: true
    auto: false
    postconditions:
      - role is shovel_ready
  - from: active
    to: archived
    description: Mission is archived (no longer active)
    manual: true
    auto: false
    postconditions:
      - role is terminal
      - ended; no further normal execution hops expected
  - from: '*'
    to: error
    description: System error occurred
    manual: false
    auto: true
    postconditions:
      - role is halted
      - hop from any occupancy to error
      - system halt; repair before leaving halted
percent_complete:
  method: status_defaults
  default_by_status:
    conceptual: 0
    originated: 5
    active: 100
    archived: 100
    draft: 10
    error: 0
