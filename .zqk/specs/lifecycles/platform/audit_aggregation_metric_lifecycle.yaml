$schema: "../../../.zqk/cli/specs/schemas/lifecycle_spec.schema.json"

object_type: audit_aggregation_metric
# Five-question exam: docs/architecture/LIFECYCLE_STATE_MACHINE_RUBRIC.md
# TRACK: BLI-CEF-R26-REMAINING-KINDS-001
statuses:
  - value: conceptual
    display: Conceptual
    origin: true
    preliminary: true
    description: Draft plane status. Prior to CAS membrane crossing.
    role: realign
  - value: originated
    display: Originated
    description: CAS membrane crossed. Object officially originated.
    role: realign
  - value: completed
    display: Completed
    origin: false
    # Born-complete metrics must not be preliminary: draft plane has no leave path
    # when origin is also terminal (CAS index / List would never see them).
    # TRACK: BLI-1785443942668406000-1ec5c811 — draft-plane / promote membrane.
    terminal: true
    description: Aggregation metric has been successfully created
    role: terminal
  - value: archived
    display: Archived
    terminal: true
    archive: true
    description: Aggregation metric has been archived
    role: terminal
  - value: error
    display: Error
    system: true
    description: Aggregation metric encountered an error during creation
    role: halted
transitions:
  - from: conceptual
    to: originated
    description: Promote from draft plane to CAS membrane (CAS Qualification).
    manual: true
    auto: false
    catalyst: System promotion
  - from: originated
    to: completed
    description: Initial domain workflow transition to completed.
    manual: true
    auto: true
    catalyst: System initialization
  - from: completed
    to: archived
    description: Aggregation metric is archived for long-term storage
    manual: true
    auto: false
    postconditions:
      - role is terminal
      - ended; no further normal execution hops expected
  - from: '*'
    to: error
    description: Aggregation metric encountered a system error
    manual: false
    auto: true
    postconditions:
      - role is halted
      - hop from any occupancy to error
      - system halt; repair before leaving halted
percent_complete:
  method: ""

created_at: 2026-07-01T18:00:00Z
updated_at: 2026-07-01T18:00:00Z
