$schema: "../../../.zqk/cli/specs/schemas/lifecycle_spec.schema.json"

object_type: zqk_session
# Five-question exam: docs/architecture/LIFECYCLE_STATE_MACHINE_RUBRIC.md
# TRACK: BLI-CEF-R26-REMAINING-KINDS-001
statuses:
  - value: conceptual
    display: Conceptual
    origin: true
    preliminary: true
    description: Draft plane status. Prior to CAS membrane crossing.
    role: realign
  - value: originated
    display: Originated
    description: CAS membrane crossed. Object officially originated.
    role: realign
  - value: active
    display: Active
    origin: false
    description: Session is active (CLI run or interactive session in progress).
    role: execution_locked
  - value: completed
    display: Completed
    terminal: true
    description: Session completed normally.
    role: terminal
  - value: archived
    display: Archived
    terminal: true
    archive: true
    description: Session archived (e.g. by retention or manual). Eligible for 
      cleanup.
    role: terminal
  - value: error
    display: Error
    system: true
    description: System error occurred during session.
    role: halted
transitions:
  - from: conceptual
    to: originated
    description: Promote from draft plane to CAS membrane (CAS Qualification).
    manual: true
    auto: false
    catalyst: System promotion
  - from: originated
    to: active
    description: Initial domain workflow transition to active.
    manual: true
    auto: true
    catalyst: System initialization
  - from: active
    to: completed
    description: Session completed normally
    manual: false
    auto: true
    postconditions:
      - role is terminal
  - from: active
    to: archived
    description: Archive session (manual or retention)
    manual: true
    auto: false
    postconditions:
      - role is terminal
      - ended; no further normal execution hops expected
  - from: completed
    to: archived
    description: Archive completed session
    manual: true
    auto: false
    postconditions:
      - role is terminal
      - ended; no further normal execution hops expected
  - from: '*'
    to: error
    description: System error occurred
    manual: false
    auto: true
    postconditions:
      - role is halted
      - hop from any occupancy to error
      - system halt; repair before leaving halted
percent_complete:
  method: status_defaults
  default_by_status:
    conceptual: 0
    originated: 5
    active: 50
    completed: 100
    archived: 100
    error: 0
created_at: 2026-07-01T18:00:00Z
updated_at: 2026-07-01T18:00:00Z
created_by: ACC-SYSTEM
updated_by: ACC-SYSTEM
