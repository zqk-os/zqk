name: open_countable
description: |
  Object-level remaining-open capability. The container's behavior changes
  when remaining_open_count hits zero (complete). The count field lives on
  the remaining_open mixin, not on this trait and not on status_reactive.
  Parallel: occupiable (capability) vs occupancy (claimed_by / claimed_at).
  Interpreter CAS-decrements remaining_open_count on a member terminal hop.
  Non-zero is a no-op (no status catalyst). Zero hops complete (new catalyst).
  Do not List members on the hop. Not occupiable. Not status_reactive.
  TRACK: POL-ARCH-20260901 / BLI-CEF-CONTAINER-REMAINING-OPEN-001.
category: behavior
requires: []
conflicts: []
includes: []
field_level: false
object_level: true
config:
  count_field: remaining_open_count

