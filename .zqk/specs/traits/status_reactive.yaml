name: status_reactive
description: |
  Object-level admission for status-event listeners. A catalyst status save
  publishes one event to each outbound ref (listener stubs). Kinds with this
  trait may run the generic interpreter (lifecycle on_dependent_status).
  Kinds without this trait no-op. The listener updates only itself.
  Not occupiable (claimed_by slot). Not open_countable (remaining_open_count).
  Not auto_status_transitionable (--auto-status).
  TRACK: POL-ARCH-20260901 / kernel-backlog.
category: behavior
