$schema: "../../../.zqk/cli/specs/schemas/trait_spec.schema.json"

name: field_reference_group
description: >-
  Trait group for kernel object pointer fields (*_ref / *_refs). Declare this
  group instead of listing query traits. Expands to readable, filterable,
  groupable, searchable, and sortable. Do not attach this group to confidential
  or sensitive (PII) pointer fields. Mutability stays on field_mutable_group
  (or writable/modifiable) when the pointer is user-editable.
category: specialized-group
requires:
  - readable
conflicts: []
includes:
  - readable
  - filterable
  - groupable
  - searchable
  - sortable
field_level: true
object_level: false
config: {}

