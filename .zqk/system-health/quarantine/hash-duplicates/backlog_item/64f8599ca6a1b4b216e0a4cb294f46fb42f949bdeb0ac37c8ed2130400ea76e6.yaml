description: 'Human feedback: injecting resolved_* into object get adds confusion, removes choice, and is susceptible to CAS pollution when get output is round-tripped. Desired shape: (1) default get = raw CAS/spec fields only; (2) resolved meta lives in a separate index/sidecar in the same folder (or companion API) keyed by id so UI can render titles/status by join or skip; (3) keep optional inline hydrate for agents that explicitly opt in; (4) scrub/fail any write path that accepts overlay keys. Evidence: 5 CAS instances already polluted with reference_resolver_overlay_* / resolved_milestone_refs. Related to CLI IA membrane REQ and help partitioning. Sealing invariant: resolved meta must never enter the CAS object bytes; content hash is the seal — a failed write cannot corrupt the object with partial hydration because hydration is not part of the hashed payload. Sidecar/index updates are independent of object CAS integrity. Progress 2026-08-05: shipped protective slice — default object get is raw CAS (no resolved_*/overlay flags); --link-hydration lazy|default|eager opt-in; create/update/bulk-update strip overlay keys before persist. Sidecar index still pending.'
