description: |
    Make namespace segregation observable on inventory commands.
    1) object list always emits meta.namespace_scope (default zqk:kernel) and
       meta.hidden_outside_scope (or equivalent) when scope hides objects;
       human table must print an explicit Namespace line — never bare Total: 0
       without saying why.
    2) Wire --namespace and --federated/--all-namespaces through CLI specs +
       codegen onto object list (and count); document in help.
    3) applyNamespaceBoundaries must run for object count the same as list
       (or both document get-by-id as global and refuse silent divergence).
    4) Acceptance: list team without flags shows scope + hidden count for
       TEA-001 in domain:organizational; --federated or explicit namespace
       filter returns the team; count matches list under the same flags.
