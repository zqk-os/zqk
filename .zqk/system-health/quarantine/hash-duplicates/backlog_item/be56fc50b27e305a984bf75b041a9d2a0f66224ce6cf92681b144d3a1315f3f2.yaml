description: |
    OBSERVE: zqk object --help lists splan as Strategic plan operations alongside kinds. zqk object list splan fails with unknown kind not in spec index. Correct path is zqk object splan list (dedicated command group) or zqk object list strategic_plan. Same class of trap likely for pplan, wstrans, evoman, draft, etc. Fix before launch: either register CLI aliases as kind synonyms in list/count/get resolution, or demarcate shortcut commands vs schema kinds in help (and reject with tip naming the canonical kind + shortcut). Related inventory membrane honesty BLI.
