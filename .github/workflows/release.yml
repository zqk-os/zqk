name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Homebrew Tap Formula Update
        if: env.HOMEBREW_TAP_GITHUB_TOKEN != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          gh api repos/zqk-os/homebrew-tap/dispatches \
            --field event_type="release-published" \
            --raw-field client_payload="{\"tag\":\"${GITHUB_REF_NAME}\",\"repository\":\"${GITHUB_REPOSITORY}\",\"actor\":\"${GITHUB_ACTOR}\"}"

  docs-portal:
    name: Build & Verify Docs Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate and Verify Documentation Portal
        run: |
          mkdir -p dist-docs
          python3 scripts/open-core/docs-portal/generate_docs_portal.py dist-docs
          tar -czf dist-docs.tar.gz -C dist-docs .
          python3 scripts/open-core/docs-portal/generate_docs_portal.py --verify dist-docs.tar.gz

      - name: Upload Docs Portal Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist-docs.tar.gz --clobber || echo "Release asset upload will proceed after release creation"

      - name: Deploy Canonical Documentation Portal to docs.zqk.dev
        env:
          DOCS_PAT: ${{ secrets.DOCS_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/open-core/docs-portal/deploy-docs-portal.sh || echo "Docs portal push will proceed when DOCS_PAT is available"
