name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Verify Human-Readable Release Notes Exist
        run: |
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -s "${NOTES_FILE}" ]; then
            echo "FAIL: missing or empty human-readable release notes at ${NOTES_FILE}" >&2
            exit 1
          fi
          echo "Using release notes: ${NOTES_FILE} ($(wc -c < "${NOTES_FILE}") bytes)"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes "docs/releases/${{ github.ref_name }}.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure GitHub Release Contains Human-Readable Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          gh release edit "${GITHUB_REF_NAME}" --notes-file "${NOTES_FILE}"

      - name: Update Homebrew Tap Formula Directly
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN || secrets.DOCS_DEPLOY_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "WARN: neither HOMEBREW_TAP_GITHUB_TOKEN nor DOCS_DEPLOY_TOKEN is set; skipping Homebrew tap update" >&2
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          CHECKSUMS_FILE="dist/zqk_${VERSION}_checksums.txt"
          GH_TOKEN="${TAP_TOKEN}" bash scripts/open-core/update-homebrew-formula.sh "${GITHUB_REF_NAME}" "${CHECKSUMS_FILE}"

  docs-portal:
    name: Build & Verify Docs Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate and Verify Documentation Portal
        run: |
          mkdir -p dist-docs
          python3 scripts/open-core/docs-portal/generate_docs_portal.py dist-docs
          tar -czf dist-docs.tar.gz -C dist-docs .
          python3 scripts/open-core/docs-portal/generate_docs_portal.py --verify dist-docs.tar.gz

      - name: Upload Docs Portal Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist-docs.tar.gz --clobber || echo "Release asset upload will proceed after release creation"

      - name: Deploy Canonical Documentation Portal to docs.zqk.dev
        env:
          DOCS_PAT: ${{ secrets.DOCS_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/open-core/docs-portal/deploy-docs-portal.sh || echo "Docs portal push will proceed when DOCS_PAT is available"
