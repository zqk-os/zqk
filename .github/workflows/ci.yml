name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Vet Code
        run: go vet ./...

      - name: Verify Public Release Payload
        run: sh scripts/open-core/check-public-release-payload.sh

      - name: Run forbidigo linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --enable-only=forbidigo --timeout=15m

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Unit Tests
        run: |
          export ZQK_ALLOW_FOREGROUND_GO_TEST=1
          go test -short -timeout 10m ./pkg/...

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Public Release Gates & Integration Tests
        run: |
          export ZQK_ALLOW_FOREGROUND_GO_TEST=1
          sh scripts/open-core/test-public-release-gates.sh

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-format, unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Binary
        run: go build -v -o zqk ./cmd/zqk

      - name: Test CLI
        run: |
          ./zqk --help
          ./zqk system --help
