name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Vet Code
        run: go vet ./...

      - name: Verify Public Release Payload
        run: sh scripts/open-core/check-public-release-payload.sh

      - name: Run golangci-lint (.golangci.yml)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --config=.golangci.yml --timeout=15m

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Unit Tests
        run: |
          go test -short -p 2 -timeout 10m ./pkg/...

  build:
    name: Build Binary & Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-format, unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate Bootstrap Archive
        run: make bootstrap-archive

      - name: Build Binary
        run: make all

      - name: Smoke Test CLI
        run: |
          . scripts/open-core/brand-env-prefix.sh
          echo "BRAND_EXE=$BRAND_EXE" >> "$GITHUB_ENV"
          ./"bin/$BRAND_EXE" --help
          ./"bin/$BRAND_EXE" system --help

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zqk-binary
          path: bin/
          if-no-files-found: error

  integration-tests:
    name: Integration Tests (Built Asset)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: zqk-binary
          path: bin/

      - name: Prepare Built Binary
        run: |
          . scripts/open-core/brand-env-prefix.sh
          chmod +x "bin/$BRAND_EXE"
          ln -sf "$BRAND_EXE" "bin/${BRAND_EXE}-mcp-ide-adapter"
          ./"bin/$BRAND_EXE" --help
          ./"bin/$BRAND_EXE" system --help

      - name: Verify Bootstrap Portable Extraction
        run: |
          . scripts/open-core/brand-env-prefix.sh
          sh scripts/open-core/verify-bootstrap-portable.sh . "bin/$BRAND_EXE"

      - name: Run Public Release Gates with Built Binary
        run: |
          . scripts/open-core/brand-env-prefix.sh
          export "${BRAND_ENV_PREFIX}_SHARED_TEST_BIN=$(pwd)/bin/${BRAND_EXE}"
          sh scripts/open-core/test-public-release-gates.sh
