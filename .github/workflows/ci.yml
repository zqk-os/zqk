name: Community CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify public source artifact
        run: sh scripts/open-core/test-public-release-gates.sh
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --enable-only=forbidigo --timeout=5m
