name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Vet Code
        run: go vet ./...

      - name: Run ZQK Verification Engine (zqk-vet)
        run: make vet

      - name: Verify Public Release Payload
        run: sh scripts/open-core/check-public-release-payload.sh

      - name: Check Hardcoded Paths and Permissions
        run: ./scripts/check-hardcoded-paths-and-perms-repo.sh --no-dups

      - name: Check CLI Name Literals
        run: ./scripts/check-cli-name-literals-repo.sh

      - name: Run golangci-lint (.golangci.yml)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --config=.golangci.yml --timeout=15m

      - name: Run Dependency Vulnerability Check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Generate Lint & Gate Summary
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### Static Analysis & Release Gate Summary
          | Gate / Check | Status |
          | :--- | :---: |
          | Go Formatting (`gofmt`) | ✅ Clean |
          | Static Analysis (`go vet`) | ✅ Passed |
          | ZQK Verification Engine (`zqk-vet`) | ✅ Passed |
          | Public Release Payload Gate | ✅ Passed |
          | Path & Permission Literals | ✅ Passed |
          | CLI Name Literals | ✅ Passed |
          | Go Linter (`golangci-lint`) | ✅ Passed |
          | Dependency Vulnerabilities (`govulncheck`) | ✅ Passed |
          EOF


  unit-tests:
    name: Unit Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core-kernel
            packages: >-
              ./pkg ./ext/facade/... ./internal/bootstrap/... ./internal/cli/...
              ./internal/codegen/... ./internal/distribution/... ./internal/stamping/...
              ./internal/testpackageconcurrency/... ./pkg/accumulator/... ./pkg/adapters/...
              ./pkg/aliases/... ./pkg/ambience/... ./pkg/ambient/... ./pkg/appledouble/...
              ./pkg/audit/... ./pkg/authcred/... ./pkg/batchaf/... ./pkg/brand/...
              ./pkg/bridge/... ./pkg/bufferpool/... ./pkg/cef/... ./pkg/circuitbreaker/...
              ./pkg/cleanup/... ./pkg/cli/... ./pkg/clihooks/... ./pkg/closureevidence/...
              ./pkg/community/... ./pkg/concurrency/... ./pkg/config/... ./pkg/context/...
              ./pkg/contextevents/... ./pkg/contractchange/... ./pkg/convergence/...
              ./pkg/convergerollup/... ./pkg/crypto/... ./pkg/datacell/...
              ./pkg/datacellregistry/... ./pkg/diagnostics/... ./pkg/diskusage/...
              ./pkg/dispatch/... ./pkg/dna/... ./pkg/docman/... ./pkg/domain/...
              ./pkg/drifthotspots/... ./pkg/economy/... ./pkg/entitlements/...
              ./pkg/envelope/... ./pkg/errfmt/... ./pkg/events/... ./pkg/evolution/...
              ./pkg/execwrap/... ./pkg/featureflags/... ./pkg/filter/... ./pkg/fitness/...
              ./pkg/functional/... ./pkg/gantt/... ./pkg/git/... ./pkg/gitconstants/...
              ./pkg/gitevidence/... ./pkg/goroutinelabels/... ./pkg/gotestparse/...
              ./pkg/graph/... ./pkg/grooming/... ./pkg/handslapper/... ./pkg/healthcheck/...
              ./pkg/hive/... ./pkg/hivemind/... ./pkg/hostload/... ./pkg/httpheaders/...
              ./pkg/idebridge/... ./pkg/idehooks/... ./pkg/inbox/... ./pkg/infrastructure/...
              ./pkg/ingestion/... ./pkg/integrity/... ./pkg/interactionpolicy/...
              ./pkg/interactive/... ./pkg/kernel/... ./pkg/kernelcas/... ./pkg/kindnames/...
              ./pkg/kindsynonyms/... ./pkg/license/... ./pkg/lifecycle/... ./pkg/llm/...
              ./pkg/loader/... ./pkg/localci/... ./pkg/lockhealth/... ./pkg/logging/...
              ./pkg/maintenance/... ./pkg/metrics/... ./pkg/metricsrecording/...
              ./pkg/mutation/... ./pkg/nildecode/... ./pkg/observability/... ./pkg/observer/...
              ./pkg/opencore/... ./pkg/operational/... ./pkg/osmosis/... ./pkg/osslaunch/...
              ./pkg/outputtypes/... ./pkg/paths/... ./pkg/pipeline/... ./pkg/policy/...
              ./pkg/policyinterrupt/... ./pkg/precommit/... ./pkg/process/...
              ./pkg/processhygiene/... ./pkg/processing/... ./pkg/projecttemp/...
              ./pkg/proxy/... ./pkg/quality/... ./pkg/quick/... ./pkg/relay/...
              ./pkg/releasegate/... ./pkg/reports/... ./pkg/resourcehygiene/...
              ./pkg/rollback/... ./pkg/rollup/... ./pkg/runtime/... ./pkg/safepath/...
              ./pkg/scenario/... ./pkg/screencap/... ./pkg/search/... ./pkg/security/...
              ./pkg/shellcmd/... ./pkg/shockwave/... ./pkg/shovelready/... ./pkg/skill/...
              ./pkg/skills/... ./pkg/specialization/... ./pkg/stampmemo/... ./pkg/stewardbase/...
              ./pkg/storagetesting/... ./pkg/strutil/... ./pkg/supply/... ./pkg/systemcheck/...
              ./pkg/systemcheckwake/... ./pkg/systempeel/... ./pkg/tde/... ./pkg/telemetry/...
              ./pkg/testing/... ./pkg/tracing/... ./pkg/translation/... ./pkg/transport/...
              ./pkg/tray/... ./pkg/utils/... ./pkg/vds/... ./pkg/vitality/... ./pkg/walutil/...
              ./pkg/when/... ./pkg/workflow/... ./pkg/wsobs/... ./pkg/zqkcli/...
              ./pkg/zqkdev/... ./pkg/zqkenv/... ./pkg/zqksession/... ./pkg/zqktime/...
          - suite: storage
            packages: >-
              ./pkg/storage/...
          - suite: cli-commands
            packages: >-
              ./cmd/...
          - suite: objects-and-specs
            packages: >-
              ./pkg/objects/... ./pkg/objectcreate/... ./pkg/objectget/...
              ./pkg/objectidcache/... ./pkg/objectrecord/... ./pkg/pm/...
              ./pkg/specbuilder/... ./pkg/specorigination/... ./pkg/migration/...
              ./pkg/semantic/... ./pkg/ontology/...
          - suite: agent-and-orchestration
            packages: >-
              ./pkg/agent/... ./pkg/agentclaim/... ./pkg/agentdelivery/...
              ./pkg/agentfeed/... ./pkg/agentidle/... ./pkg/agentonboard/...
              ./pkg/agentorch/... ./pkg/agentprompt/... ./pkg/agentrules/...
              ./pkg/orchestration/... ./pkg/mesh/... ./pkg/federation/...
              ./pkg/swarm/... ./pkg/swarminit/... ./pkg/mcp/...
              ./pkg/coordination/... ./pkg/primaryorch/... ./pkg/seatworker/...
          - suite: validation-and-tpm
            packages: >-
              ./pkg/validation/... ./pkg/tpm/... ./pkg/testdiscovery/...
              ./pkg/testkit/... ./pkg/testenvroot/... ./pkg/testjobgen/...
              ./pkg/testrunner/... ./pkg/testscan/... ./pkg/testservices/...
              ./pkg/verification/... ./pkg/tdval/... ./pkg/reqharness/...
          - suite: scheduler
            packages: >-
              ./pkg/scheduler/...
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Partitioned Unit Tests
        run: |
          go test -short -p 2 -timeout 8m -coverprofile="coverage-${{ matrix.suite }}.out" ${{ matrix.packages }}

      - name: Generate Unit Test Coverage Summary
        if: always()
        run: |
          if [ -f "coverage-${{ matrix.suite }}.out" ]; then
            python3 scripts/open-core/generate-coverage-summary.py "coverage-${{ matrix.suite }}.out" "Unit Test Coverage (${{ matrix.suite }})"
          fi


  extended-unit-tests:
    name: Extended Unit Tests (Full Non-Short)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Full Unit Tests (Non-Short)
        run: |
          go test -p 2 -timeout 20m -coverprofile=coverage-extended.out \
            ./pkg/brand/... ./pkg/bridge/... ./pkg/circuitbreaker/... ./pkg/cli/... \
            ./pkg/concurrency/... ./pkg/dna/... ./pkg/docman/... ./pkg/graph/... \
            ./pkg/healthcheck/... ./pkg/hive/... ./pkg/hostload/... ./pkg/integrity/... \
            ./pkg/interactive/... ./pkg/kernel/... ./pkg/telemetry/... ./pkg/accumulator/... \
            ./pkg/authcred/... ./pkg/bufferpool/... ./pkg/cleanup/... ./pkg/clihooks/... \
            ./pkg/closureevidence/... ./pkg/coordination/... ./pkg/crypto/... ./pkg/datacell/... \
            ./pkg/dispatch/... ./pkg/events/... ./pkg/grooming/... ./pkg/handslapper/... \
            ./pkg/hivemind/... ./pkg/idebridge/... ./pkg/idehooks/... ./pkg/inbox/... \
            ./pkg/infrastructure/... ./pkg/ingestion/... ./pkg/interactionpolicy/... \
            ./pkg/kernelcas ./pkg/lifecycle/... ./pkg/lockhealth/... ./pkg/observability/... \
            ./pkg/paths/... ./pkg/pipeline/... ./pkg/tray/... ./pkg/vds/... ./pkg/walutil/... \
            ./pkg/contextevents/... ./pkg/quality/... ./pkg/stampmemo/... ./pkg/zqkenv/... \
            ./pkg/objects/... ./pkg/validation/... ./pkg/scheduler/... ./pkg/storage/... \
            ./cmd/zqk/test

      - name: Generate Extended Coverage Summary
        if: always()
        run: |
          if [ -f "coverage-extended.out" ]; then
            python3 scripts/open-core/generate-coverage-summary.py "coverage-extended.out" "Extended Unit Test Coverage (Non-Short)"
          fi


  build:
    name: Build Binary & Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-format, unit-tests, extended-unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate Bootstrap Archive
        run: make bootstrap-archive

      - name: Build Binary
        run: make all

      - name: Smoke Test CLI
        run: |
          . scripts/open-core/brand-env-prefix.sh
          echo "BRAND_EXE=$BRAND_EXE" >> "$GITHUB_ENV"
          ./"bin/$BRAND_EXE" --help
          ./"bin/$BRAND_EXE" system --help

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zqk-binary
          path: bin/
          if-no-files-found: error

      - name: Generate Build Summary
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### Build & Smoke Test Summary
          | Step | Status |
          | :--- | :---: |
          | Bootstrap Archive Generation | ✅ Complete |
          | Binary Compilation (`make all`) | ✅ Complete |
          | CLI Smoke Tests (`--help`, `system --help`) | ✅ Passed |
          EOF


  integration-tests:
    name: Integration Tests (Built Asset)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Binary Artifact
        uses: actions/download-artifact@v8
        with:
          name: zqk-binary
          path: bin/

      - name: Prepare Built Binary
        run: |
          . scripts/open-core/brand-env-prefix.sh
          chmod +x "bin/$BRAND_EXE"
          ln -sf "$BRAND_EXE" "bin/${BRAND_EXE}-mcp-ide-adapter"
          ./"bin/$BRAND_EXE" --help
          ./"bin/$BRAND_EXE" system --help

      - name: Verify Bootstrap Portable Extraction
        run: |
          . scripts/open-core/brand-env-prefix.sh
          sh scripts/open-core/verify-bootstrap-portable.sh . "bin/$BRAND_EXE"

      - name: Run Public Release Gates with Built Binary
        run: |
          . scripts/open-core/brand-env-prefix.sh
          export "${BRAND_ENV_PREFIX}_SHARED_TEST_BIN=$(pwd)/bin/${BRAND_EXE}"
          sh scripts/open-core/test-public-release-gates.sh

      - name: Generate Integration Test Summary
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### Integration Test & Release Gate Summary
          | Check | Status |
          | :--- | :---: |
          | Built Binary Setup & Symlinks | ✅ Ready |
          | Portable Bootstrap Extraction | ✅ Verified |
          | Full Public Release Gates | ✅ Passed |
          EOF

