name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Tests with Coverage
        run: |
          go test -short -p 2 -timeout 20m -coverprofile=coverage.out -covermode=atomic \
            ./pkg/... ./cmd/... ./internal/...

      - name: Generate Coverage Summary
        if: always()
        run: |
          python3 scripts/open-core/generate-coverage-summary.py coverage.out "Code Coverage Report"

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: warn
