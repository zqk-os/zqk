name: Enhancement
description: Propose a kernel or docs change for the community tree.
title: "[enhancement] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user-visible outcome, not a patch. Studio-only packs do not belong here.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is blocked and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that would unblock them.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What this should not include (Studio internals, public-push, live CAS edits).
