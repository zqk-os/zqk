version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: zqk
    main: ./cmd/zqk
    binary: zqk
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
     - -s -w
     - -X main.version={{.Version}}
     - -X main.commit={{.Commit}}
     - -X main.date={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"