version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: zqk
    main: ./cmd/zqk
    binary: zqk
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/zqk-os/zqk/cmd/zqk/app.version={{.Version}}
      - -X github.com/zqk-os/zqk/cmd/zqk/app.gitCommit={{.Commit}}
      - -X github.com/zqk-os/zqk/cmd/zqk/app.buildDate={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

signs:
  - id: cosign
    artifacts: checksum
    cmd: cosign
    args:
      - "sign-blob"
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"

sboms:
  - id: default
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"