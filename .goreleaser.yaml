version: 2

# Community pressure-test SKU. Studio goreleaser (zqk / zqk-mcp / zqk-admin) must not ship here.
# TRACK: TDE-1789681135032251000-e52ad7a7
project_name: zcom

builds:
  - id: zcom
    main: ./cmd/zqk-community
    binary: zcom
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/lanceman/zqk/cmd/zqk-community/app.version={{.Version}}
      - -X github.com/lanceman/zqk/cmd/zqk-community/app.buildDate={{.Date}}
      - -X github.com/lanceman/zqk/cmd/zqk-community/app.gitCommit={{.Commit}}

archives:
  - id: zcom
    builds:
      - zcom
    name_template: "zcom_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - LICENSE
      - README.md
      - NOTICE

checksum:
  name_template: checksums.txt
