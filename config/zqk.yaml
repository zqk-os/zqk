# Generated by community bootstrap. Committed defaults.
# Override in config/zqk-local.yaml (do not copy from another kernel).
# This file is the project YAML SSOT. Machine lite-files live in .zqk/agent-runtime/.
brand:
  executable_name: zqk
  product_name: ZQK
system:
  storage_mode: "file"
  stream_storage_enabled: true
kernel_state:
  project_root: ""

project:
  name: zqk-public-candidate
  template: standard

storage:
  backend: file
  data_dir: .zqk/process

logging:
  profile: human
  level: info

cache:
  enabled: true
  ttl_seconds: 3600

# Fail-fast validation budgets. Healthy objects finish in ms; multi-second
# kind_overrides hide lock contention. Prefer fixing stalls over raising budgets.
validation:
  per_object_timeout:
    default_seconds: 5
    kind_overrides: {}
  stuck_timeout_seconds: 30
