# Minimum job/test timeout (seconds) per package path for scheduler scan-tests.
# Package path is matched by prefix (e.g. "cmd/zqk/object" matches "cmd/zqk/object" and "cmd/zqk/object/...");
# first matching rule wins. Order rules from most specific to least specific.
#
# Load order: .zqk/config/scan_tests_package_timeouts.yaml (override) then this file (default).
# Copy to .zqk/config/scan_tests_package_timeouts.yaml to customize per project.
#
# Used by: pkg/testscan (SuggestedTimeoutForPackage), pkg/testjobgen (GenerateJobs, buildTestArgs).

packages:
  - pattern: "cmd/zqk/system"
    min_seconds: 3600  # 60 minutes (system-level E2E tests like SystemCheck_ProgressUpdates_E2E)
  - pattern: "cmd/zqk/object"
    min_seconds: 1800   # 30 minutes
  - pattern: "cmd/zqk"
    min_seconds: 600   # 10 minutes (root integration tests: create/delete flow, system check E2E)
  - pattern: "pkg/storage"
    min_seconds: 600   # 10 minutes
