schema_version: 2.0.0
ontology: release
extends: base_object
visibility: public
description: 'Represents a software release with version, release criteria, and release notes. Enables structured release planning, tracking, and documentation.\nLifecycle: release_lifecycle.yaml.\n'
traits:
  - base_object_traits
fields:
  backlog_item_refs:
    access:
      requires:
        - access:confidential
    checklist:
      authority: owner/release_manager.
      automation_hooks: used for release content tracking.
      cardinality: many
      criticality: association
      default: []
      dependencies: backlog registry.
      observability: "yes"
      origin_lifecycle: mutable
      purpose: Backlog items included in this release.
      security: non-sensitive
      system_usage:
        - release planning
        - traceability
      validation: must reference existing backlog item IDs.
    field_profile_code: REL-006
    permissions: r-x
    semantic_type: reference
    traits:
      - field_mutable_group
      - field_reference_group
    type: list
    validation:
      required: false
  criteria_refs:
    access:
      requires:
        - access:confidential
    checklist:
      authority: owner/release_manager.
      automation_hooks: used for release gate validation.
      cardinality: many
      criticality: composition
      default: []
      dependencies: criteria registry.
      observability: "yes"
      origin_lifecycle: mutable
      purpose: Release criteria that must be met for this release.
      security: non-sensitive
      system_usage:
        - release validation
        - gating
      validation: must reference existing criteria IDs.
    field_profile_code: REL-007
    permissions: r-x
    semantic_type: reference
    traits:
      - field_mutable_group
      - field_reference_group
    type: list
    validation:
      required: false
  milestone_refs:
    access:
      requires:
        - access:confidential
    checklist:
      authority: owner/release_manager.
      automation_hooks: used for release content tracking.
      cardinality: many
      criticality: association
      default: []
      dependencies: milestone registry.
      observability: "yes"
      origin_lifecycle: mutable
      purpose: Milestones included in this release.
      security: non-sensitive
      system_usage:
        - release planning
        - traceability
      validation: must reference existing milestone IDs.
    field_profile_code: REL-004
    permissions: r-x
    semantic_type: reference
    traits:
      - field_mutable_group
      - field_reference_group
    type: list
    validation:
      required: false
  release_date:
    access:
      requires:
        - access:confidential
    checklist:
      authority: owner/release_manager.
      automation_hooks: used for release scheduling, release notes generation.
      cardinality: one
      criticality: association
      default: null
      dependencies: release scheduling, release notes.
      observability: "yes"
      origin_lifecycle: mutable
      purpose: ISO-8601 date when this release is scheduled or was released.
      security: non-sensitive
      system_usage:
        - release planning
        - release notes
        - scheduling
      validation: ISO-8601 date format (YYYY-MM-DD).
    field_profile_code: REL-002
    permissions: rwx
    semantic_type: statement
    traits:
      - readable
      - writable
      - modifiable
    type: string
    validation:
      pattern: ^\d{4}-\d{2}-\d{2}$
      required: false
  release_notes:
    access:
      requires:
        - access:confidential
    checklist:
      authority: owner/release_manager.
      automation_hooks: published with the release; the body readers see.
      cardinality: one
      criticality: composition
      default: null
      dependencies: release publication.
      observability: "yes"
      origin_lifecycle: mutable
      purpose: Notes published with this release (changes, upgrade steps, known issues).
      security: non-sensitive
      system_usage:
        - release notes
        - publication
      validation: free text. Empty until the release is ready to publish.
    field_profile_code: REL-008
    permissions: rwx
    semantic_type: statement
    traits:
      - readable
      - writable
      - modifiable
      - searchable
    type: string
    validation:
      required: false
  release_type:
    access:
      requires:
        - access:confidential
    checklist:
      authority: owner/release_manager.
      automation_hooks: used for version number calculation and release notes categorization.
      cardinality: one
      criticality: association
      default: null
      dependencies: versioning strategy.
      observability: "yes"
      origin_lifecycle: mutable
      purpose: Type of release (e.g., \\\"major\\\", \\\"minor\\\", \\\"patch\\\", \\\"hotfix\\\", \\\"beta\\\", \\\"alpha\\\").
      security: non-sensitive
      system_usage:
        - release planning
        - versioning
        - release notes
      validation: enum.
    field_profile_code: REL-003
    permissions: rwx
    semantic_type: statement
    traits:
      - filterable
      - groupable
      - listable
      - modifiable
      - readable
      - searchable
      - sortable
      - writable
    type: enum
    validation:
      enum:
        - major
        - minor
        - patch
        - hotfix
        - beta
        - alpha
      required: false
  requirement_refs:
    access:
      requires:
        - access:confidential
    checklist:
      authority: owner/release_manager.
      automation_hooks: used for release content tracking.
      cardinality: many
      criticality: association
      default: []
      dependencies: requirement registry.
      observability: "yes"
      origin_lifecycle: mutable
      purpose: Requirements fulfilled in this release.
      security: non-sensitive
      system_usage:
        - release planning
        - traceability
      validation: must reference existing requirement IDs.
    field_profile_code: REL-005
    permissions: r-x
    semantic_type: reference
    traits:
      - field_mutable_group
      - field_reference_group
    type: list
    validation:
      required: false
  version:
    access:
      requires:
        - access:confidential
    checklist:
      authority: owner/release_manager.
      automation_hooks: used for release notes generation, version tagging.
      cardinality: one
      criticality: composition
      default: required
      dependencies: version tagging, release notes.
      observability: "yes"
      origin_lifecycle: immutable
      purpose: Version identifier for this release (e.g., \\\"v1.0.0\\\", \\\"2025.12.06\\\").
      security: non-sensitive
      system_usage:
        - versioning
        - release tracking
        - release notes
      validation: Semantic versioning format recommended (e.g., \\\"v1.0.0\\\") or date-based (e.g., \\\"2025.12.06\\\").
    field_profile_code: REL-001
    permissions: r-x
    semantic_type: statement
    traits:
      - filterable
      - listable
      - modifiable
      - readable
      - searchable
      - sortable
      - writable
    type: string
    validation:
      required: true
