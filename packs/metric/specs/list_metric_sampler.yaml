schema_version: 2.0.0
ontology: list_metric_sampler
extends: base_sampler
visibility: internal
description: 'Sampler configuration for list metric types. Specialized sampler for unordered collections (tags, categories) that can be aggregated by value frequency, distribution, and unique count. '
traits:
  - base_object_traits
fields:
  batch_size:
    type: string
  flush_interval:
    type: string
  group_by_object_id:
    type: string
  max_batch_size:
    type: string
  metric_type:
    type: string
    validation:
      enum:
        - list_metric
      required: true
