schema_version: 2.0.0
ontology: goal
urn: urn:zqk:spec:project_mgmt:goal
namespace: zqk:project_mgmt
extends: work_interval
visibility: public
description: 'Goal objects define measurable outcomes linked to metrics, authority, and workstreams.\nLifecycle: goal_lifecycle.yaml.\n'
traits:
  - base_object_traits
  - manipulatable
  - completable
  - status_reactive
fields:
  authority:
    access:
      requires:
        - access:confidential
    checklist:
      authority: executive.
      automation_hooks: used for notifications and routing.
      cardinality: one
      criticality: composition
      default: required at creation
      dependencies: role registry.
      observability: "yes"
      origin_lifecycle: mutable
      purpose: Role/person responsible for goal achievement.
      security: non-sensitive
      system_usage:
        - routing
        - notifications
      validation: must match role registry.
    field_profile_code: GOL-008
    permissions: rwx
    semantic_type: statement
    traits:
      - readable
      - writable
      - modifiable
    type: string
    validation:
      required: false
  metric:
    access:
      requires:
        - access:confidential
    checklist:
      authority: owner/executive.
      automation_hooks: display only.
      cardinality: one
      criticality: association
      default: auto-populated from template
      dependencies: documentation.
      observability: "yes"
      origin_lifecycle: mutable (but should stay aligned with template).
      purpose: Human-readable metric description (may mirror template).
      security: non-sensitive
      system_usage:
        - docs
        - communication
      validation: <= 120 chars.
    field_profile_code: GOL-002
    permissions: rwx
    semantic_type: expression
    traits:
      - field_mutable_group
    type: string
    validation:
      max_length: 120
      required: false
  metric_template_id:
    access:
      requires:
        - access:confidential
    checklist:
      authority: executive/owner with metric permission.
      automation_hooks: metrics evaluation pipeline.
      cardinality: one
      criticality: composition
      default: none (required at creation)
      dependencies: metrics engine.
      observability: "yes"
      origin_lifecycle: immutable (can change via decision but treat carefully).
      purpose: Reference to metric template governing measurement.
      security: non-sensitive
      system_usage:
        - reporting
        - automation
      validation: must exist in \\\"METRIC_TEMPLATES.yaml\\\".
    field_profile_code: GOL-001
    permissions: r-x
    semantic_type: statement
    traits:
      - readable
      - writable
    type: string
    validation:
      required: false
  target:
    access:
      requires:
        - access:confidential
    checklist:
      authority: owner/executive.
      automation_hooks: used in evaluation logic.
      cardinality: one
      criticality: composition
      default: required at creation
      dependencies: metrics engine.
      observability: "yes"
      origin_lifecycle: mutable
      purpose: Success threshold for the metric.
      security: non-sensitive
      system_usage:
        - evaluation
        - reports
      validation: format depends on metric type.
    field_profile_code: GOL-003
    permissions: rwx
    semantic_type: statement
    traits:
      - field_mutable_group
    type: string
    validation:
      required: false
  workstream_refs:
    access:
      requires:
        - access:confidential
    checklist:
      authority: owner/executive.
      automation_hooks: used for goal progress calculation.
      cardinality: many
      criticality: composition
      default: []
      dependencies: workstream registry.
      observability: "yes"
      origin_lifecycle: mutable
      purpose: Workstreams that contribute to achieving this goal.
      security: non-sensitive
      system_usage:
        - planning
        - reporting
      validation: must reference existing workstream IDs.
    field_profile_code: GOL-005
    permissions: r-x
    semantic_type: reference
    traits:
      - field_mutable_group
      - field_reference_group
    type: list
    validation:
      required: false
  epic_refs:
    access:
      requires:
        - access:confidential
    checklist:
      authority: owner/planner.
      automation_hooks: maps strategic goal into concrete enclave epics.
      cardinality: many
      criticality: composition
      default: []
      dependencies: epic registry.
      observability: "yes"
      origin_lifecycle: mutable
      purpose: Epics directly executing towards achieving this strategic goal.
      security: non-sensitive
      system_usage:
        - planning
        - traceability
        - alignment
      validation: must reference existing epic IDs.
    field_profile_code: GOL-011
    permissions: r-x
    semantic_type: reference
    traits:
      - field_mutable_group
      - field_reference_group
    type: list
    validation:
      required: false
  requirement_refs:
    access:
      requires:
        - access:confidential
    checklist:
      authority: owner/planner.
      automation_hooks: connects strategic goals to requirement deliverables.
      cardinality: many
      criticality: composition
      default: []
      dependencies: requirement registry.
      observability: "yes"
      origin_lifecycle: mutable
      purpose: Requirements fulfilling this strategic goal.
      security: non-sensitive
      system_usage:
        - planning
        - traceability
        - alignment
      validation: must reference existing requirement IDs.
    field_profile_code: GOL-012
    permissions: r-x
    semantic_type: reference
    traits:
      - field_mutable_group
      - field_reference_group
    type: list
    validation:
      required: false
  success_criteria:
    access:
      requires:
        - access:confidential
    checklist:
      authority: owner/executive.
      automation_hooks: evaluation of goal achievement conditions.
      cardinality: many
      criticality: composition
      default: []
      dependencies: none.
      observability: "yes"
      origin_lifecycle: mutable
      purpose: Explicit conditions, invariants, or criteria that must be satisfied for goal achievement.
      security: non-sensitive
      system_usage:
        - planning
        - evaluation
        - reporting
      validation: list of criteria statement strings.
    field_profile_code: GOL-013
    permissions: rwx
    semantic_type: statement
    traits:
      - field_mutable_group
    type: list
    validation:
      required: false
  vision_ref:
    access:
      requires:
        - access:confidential
    checklist:
      authority: executive.
      automation_hooks: aligns strategic goals with parent vision.
      cardinality: zero_or_one
      criticality: association
      default: null
      dependencies: vision registry.
      observability: "yes"
      origin_lifecycle: mutable
      purpose: Vision object governing this strategic goal.
      security: non-sensitive
      system_usage:
        - alignment
        - traceability
      validation: must reference an existing vision ID.
    field_profile_code: GOL-014
    permissions: r-x
    semantic_type: reference
    traits:
      - field_mutable_group
      - field_reference_group
    type: string
    validation:
      required: false

