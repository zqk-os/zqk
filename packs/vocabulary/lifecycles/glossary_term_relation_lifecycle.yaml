$schema: "../../../.zqk/cli/specs/schemas/lifecycle_spec.schema.json"

object_type: glossary_term_relation
# Five-question exam: docs/architecture/LIFECYCLE_STATE_MACHINE_RUBRIC.md
# TRACK: kernel-backlog
statuses:
  - value: conceptual
    display: Conceptual
    origin: true
    preliminary: true
    description: Draft plane status. Prior to CAS membrane crossing.
    role: realign
  - value: originated
    display: Originated
    description: CAS membrane crossed. Object officially originated.
    role: realign
  - value: active
    display: Active
    origin: false
    description: Edge is active
    role: shovel_ready
  - value: archived
    display: Archived
    terminal: true
    archive: true
    description: Edge is retired
    role: terminal
  - value: error
    display: Error
    system: true
    description: System error
    role: halted
transitions:
  - from: conceptual
    to: originated
    description: Promote from draft plane to CAS membrane (CAS Qualification).
    manual: true
    auto: false
    catalyst: System promotion
  - from: originated
    to: active
    description: Initial domain workflow transition to active.
    manual: true
    auto: true
    catalyst: System initialization
  - from: active
    to: archived
    description: Archive relation
    manual: true
    auto: false
    postconditions:
      - role is terminal
      - ended; no further normal execution hops expected
  - from: "*"
    to: error
    description: System error
    manual: false
    auto: true
    postconditions:
      - role is halted
      - hop from any occupancy to error
      - system halt; repair before leaving halted
  - from: error
    to: active
    description: Recover from system error after required fields are restored
    manual: true
    auto: false
    postconditions:
      - role is shovel_ready
      - recover from system halt after repair
percent_complete:
  method: status_defaults
  default_by_status:
    conceptual: 0
    originated: 5
    active: 100
    archived: 100
    error: 0
machine_hints: []
