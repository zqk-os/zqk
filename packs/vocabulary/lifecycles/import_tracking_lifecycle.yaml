$schema: "../../../.zqk/cli/specs/schemas/lifecycle_spec.schema.json"

object_type: import_tracking
# Five-question exam: docs/architecture/LIFECYCLE_STATE_MACHINE_RUBRIC.md
# TRACK: kernel-backlog
statuses:
  - value: conceptual
    display: Conceptual
    origin: true
    preliminary: true
    description: Draft plane status. Prior to CAS membrane crossing.
    role: realign
  - value: originated
    display: Originated
    description: CAS membrane crossed. Object officially originated.
    role: realign
  - value: ready
    display: Ready
    origin: false
    preliminary: false
    description: Import recorded; translation not yet run
    role: realign
  - value: translated
    display: Translated
    description: Translation engine has run (BLI-764)
    role: realign
  - value: failed
    display: Failed
    terminal: true
    system: true
    description: Import or translation failed
    role: terminal
  - value: archived
    display: Archived
    terminal: true
    archive: true
    description: Import record archived
    role: terminal
  - value: error
    display: Error
    terminal: true
    system: true
    description: System error occurred
    role: terminal
transitions:
  - from: conceptual
    to: originated
    description: Promote from draft plane to CAS membrane (CAS Qualification).
    manual: true
    auto: false
    catalyst: System promotion
  - from: originated
    to: ready
    description: Initial domain workflow transition to ready.
    manual: true
    auto: true
    catalyst: System initialization
  - from: ready
    to: translated
    description: Translation completed
    manual: false
    auto: true
    postconditions:
      - role is realign
  - from: ready
    to: failed
    description: Translation or import failed
    manual: false
    auto: true
    postconditions:
      - role is terminal
  - from: '*'
    to: archived
    description: Archive import record
    manual: true
    auto: false
    postconditions:
      - role is terminal
      - hop from any occupancy to archived
      - ended; no further normal execution hops expected
  - from: '*'
    to: error
    description: System error occurred
    manual: false
    auto: true
    postconditions:
      - role is terminal
      - hop from any occupancy to error
      - system halt; repair before leaving halted
percent_complete:
  method: status_defaults
  default_by_status:
    conceptual: 0
    originated: 5
    ready: 0
    translated: 100
    failed: 0
    archived: 100
    error: 0
