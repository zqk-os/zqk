# Copy to the run package as run_scope.yaml and edit before Wave 0.
cef_version: "0.1.0"
mode: truth_map
repo_root: "."
include_globs:
  - "**/*"
exclude_globs:
  - ".git/**"
  - "vendor/**"
  - "node_modules/**"
  - "dist/**"
  - "build/**"
  - "**/*.min.js"
  - "**/*.pb.go"
languages_detected: [] # filled by L-PREFLIGHT
adapters_enabled: [] # e.g. ["go"] — optional language packs only
top_n_default: 10
output_home: "./cef-run" # host may place under docs/quality/cef-runs/; keep portable
notes: ""
