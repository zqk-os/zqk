# STUB — overwrite Identity fields only at materialize; freeze globs unless waive in run_log.md
cef_version: "0.1.0"
mode: truth_map
repo_root: "."
include_globs:
  - "**/*"
exclude_globs:
  - ".git/**"
  - "vendor/**"
  - "node_modules/**"
  - "dist/**"
  - "build/**"
  - "**/*.min.js"
  - "**/*.pb.go"
  - "docs/quality/cef-runs/**"
  - "docs/quality/codebase_evaluation/**"
languages_detected: [] # L-PREFLIGHT fills
adapters_enabled: ["go"]
top_n_default: 10
output_home: "REPLACE_ME"
notes: "REPLACE_ME — A/B CEF; freeze SHA REPLACE_ME; truth map only."
