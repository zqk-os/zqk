<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1802" width="960" height="1802">
  <defs>
    <style>
      .window-bg { fill: #1e1e2e; rx: 12px; }
      .top-bar { fill: #181825; }
      .dot-red { fill: #f38ba8; }
      .dot-yellow { fill: #f9e2af; }
      .dot-green { fill: #a6e3a1; }
      .term-text { font-family: "JetBrains Mono", "Fira Code", "Menlo", "Monaco", "Consolas", monospace;
                   font-size: 13px; fill: #cdd6f4; white-space: pre; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                    font-size: 12px; fill: #a6adc8; font-weight: 500; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="4" y="4" width="952" height="1794" class="window-bg" filter="url(#shadow)" stroke="#313244" stroke-width="1"/>

  <!-- Title Bar -->
  <path d="M 4 16 A 12 12 0 0 1 16 4 L 944 4 A 12 12 0 0 1 956 16 L 956 42 L 4 42 Z" class="top-bar"/>
  <line x1="4" y1="42" x2="956" y2="42" stroke="#313244" stroke-width="1"/>

  <!-- Window Buttons -->
  <circle cx="24" cy="23" r="6" class="dot-red"/>
  <circle cx="44" cy="23" r="6" class="dot-yellow"/>
  <circle cx="64" cy="23" r="6" class="dot-green"/>

  <!-- Window Title -->
  <text x="480.0" y="27" class="title-text">zqk — Demo 5: Object Inspector, Policy Studio &amp; Unified QA</text>

  <!-- Terminal Text Content -->
  <g transform="translate(24, 62)">
    <text class="term-text">
      <tspan x="0" y="16"><tspan font-weight="bold">═══════════════════════════════════════════════════════════════════════════</tspan></tspan>
      <tspan x="0" y="36"><tspan fill="#94e2d5">   ZQK DEMO 5: OBJECT INSPECTOR, POLICY STUDIO &amp; UNIFIED QA CONSOLE       </tspan></tspan>
      <tspan x="0" y="56"><tspan font-weight="bold">═══════════════════════════════════════════════════════════════════════════</tspan></tspan>
      <tspan x="0" y="76">  <tspan fill="#f9e2af" font-weight="bold">Thesis:</tspan> Managing complex knowledge kernel graphs should not require</tspan>
      <tspan x="0" y="96">  memorizing dozens of CLI flags or parsing walls of raw YAML.</tspan>
      <tspan x="0" y="116">  Humans get clean, interactive drill-downs and policy studios;</tspan>
      <tspan x="0" y="136">  autonomous AI agents receive dense, token-optimized semantic projections.</tspan>
      <tspan x="0" y="156"><tspan font-weight="bold">═══════════════════════════════════════════════════════════════════════════</tspan></tspan>
      <tspan x="0" y="176"></tspan>
      <tspan x="0" y="196"><tspan font-weight="bold">[SCENE 1: DUAL HUMAN / AGENT SEMANTIC PROJECTIONS]</tspan></tspan>
      <tspan x="0" y="216">  Autonomous agents need high signal, low token overhead.</tspan>
      <tspan x="0" y="236">  Querying target object <tspan fill="#94e2d5">BLI-MEMBRANE-001</tspan> with agent-reduced projection (-f json):</tspan>
      <tspan x="0" y="256"></tspan>
      <tspan x="0" y="276">  $ <tspan font-weight="bold">zqk object inspect backlog_item BLI-MEMBRANE-001 -f json</tspan></tspan>
      <tspan x="0" y="296"></tspan>
      <tspan x="0" y="316">{</tspan>
      <tspan x="0" y="336">  &quot;kind&quot;: &quot;backlog_item&quot;,</tspan>
      <tspan x="0" y="356">  &quot;id&quot;: &quot;BLI-MEMBRANE-001&quot;,</tspan>
      <tspan x="0" y="376">  &quot;status&quot;: &quot;originated&quot;,</tspan>
      <tspan x="0" y="396">  &quot;priority&quot;: &quot;critical&quot;,</tspan>
      <tspan x="0" y="416">  &quot;title&quot;: &quot;Enforce Cellular Microkernel Membrane Isolation&quot;,</tspan>
      <tspan x="0" y="436">  &quot;storage_profile&quot;: {</tspan>
      <tspan x="0" y="456">    &quot;cas_hash&quot;: &quot;aafb6d9f4c688e9e2a1d29f13be03bcd1ee9feb991a4a1ea513b57519efc4644&quot;,</tspan>
      <tspan x="0" y="476">    &quot;storage_plane&quot;: &quot;cas&quot;,</tspan>
      <tspan x="0" y="496">    &quot;byte_size&quot;: 499,</tspan>
      <tspan x="0" y="516">    &quot;permissions&quot;: &quot;-rw-r--r--&quot;,</tspan>
      <tspan x="0" y="536">    &quot;last_modified&quot;: &quot;2026-09-29T05:04:25Z&quot;</tspan>
      <tspan x="0" y="556">  },</tspan>
      <tspan x="0" y="576">  &quot;ontology&quot;: {</tspan>
      <tspan x="0" y="596">    &quot;namespace&quot;: &quot;zqk:kernel&quot;,</tspan>
      <tspan x="0" y="616">    &quot;version_context&quot;: &quot;default&quot;,</tspan>
      <tspan x="0" y="636">    &quot;storage_profile&quot;: &quot;cas_entity&quot;,</tspan>
      <tspan x="0" y="656">    &quot;traits&quot;: [</tspan>
      <tspan x="0" y="676">      &quot;base_object_traits&quot;,</tspan>
      <tspan x="0" y="696">      &quot;manipulatable&quot;,</tspan>
      <tspan x="0" y="716">      &quot;constrainable&quot;,</tspan>
      <tspan x="0" y="736">      &quot;effort_aware&quot;</tspan>
      <tspan x="0" y="756">    ],</tspan>
      <tspan x="0" y="776">    &quot;registered_fields_count&quot;: 66</tspan>
      <tspan x="0" y="796">  },</tspan>
      <tspan x="0" y="816">  &quot;lineage&quot;: {</tspan>
      <tspan x="0" y="836">    &quot;is_intact&quot;: false</tspan>
      <tspan x="0" y="856">  },</tspan>
      <tspan x="0" y="876">  &quot;criteria_summary&quot;: {</tspan>
      <tspan x="0" y="896">    &quot;total&quot;: 0,</tspan>
      <tspan x="0" y="916">    &quot;satisfied&quot;: 0,</tspan>
      <tspan x="0" y="936">    &quot;pending&quot;: 0</tspan>
      <tspan x="0" y="956">  },</tspan>
      <tspan x="0" y="976">  &quot;actions_available&quot;: [</tspan>
      <tspan x="0" y="996">    &quot;transition_status&quot;,</tspan>
      <tspan x="0" y="1016"><tspan opacity="0.65">  ... [stream continues with storage profile, ontology &amp; lineage]</tspan></tspan>
      <tspan x="0" y="1036"></tspan>
      <tspan x="0" y="1056"><tspan font-weight="bold">[SCENE 2: HUMAN INTERACTIVE OBJECT INSPECTOR (TDS FORMAT)]</tspan></tspan>
      <tspan x="0" y="1076">  Human operators receive structured TDS panel views with Modular Cards:</tspan>
      <tspan x="0" y="1096"></tspan>
      <tspan x="0" y="1116">  $ <tspan font-weight="bold">zqk object inspect backlog_item BLI-MEMBRANE-001</tspan></tspan>
      <tspan x="0" y="1136"></tspan>
      <tspan x="0" y="1156">╭─ OBJECT INSPECTOR: BLI-MEMBRANE-001 ─────────────────────────────────────────╮</tspan>
      <tspan x="0" y="1176">│<tspan opacity="0.65">Kind: </tspan><tspan fill="#cdd6f4" font-weight="bold">backlog_item</tspan>       <tspan opacity="0.65">Status: </tspan><tspan fill="#cdd6f4" font-weight="bold">originated</tspan> <tspan fill="#94e2d5">[originated]</tspan><tspan opacity="0.65">Priority: </tspan><tspan fill="#cdd6f4" font-weight="bold">critical</tspan>    │</tspan>
      <tspan x="0" y="1196">│                                                                              │</tspan>
      <tspan x="0" y="1216">│Title: Enforce Cellular Microkernel Membrane Isolation                        │</tspan>
      <tspan x="0" y="1236">│                                                                              │</tspan>
      <tspan x="0" y="1256">│── CAS Storage &amp; Data-Cell Profile ──                                         │</tspan>
      <tspan x="0" y="1276">│  Storage Plane: <tspan fill="#94e2d5">[cas]</tspan>  │ CAS Hash: aafb6d9f4c68…519efc4644                   │</tspan>
      <tspan x="0" y="1296">│  Content Size:  499 bytes  │ Mode: -rw-r--r--  │ Modified: 2026-09-29T05:04:…│</tspan>
      <tspan x="0" y="1316">│                                                                              │</tspan>
      <tspan x="0" y="1336">│── Ontology &amp; Schema Profile ──                                               │</tspan>
      <tspan x="0" y="1356">│  Namespace:     zqk:kernel  │ Version: default  │ Storage: cas_entity        │</tspan>
      <tspan x="0" y="1376">│  Field Count:   66 registered schema fields                                  │</tspan>
      <tspan x="0" y="1396">│  Traits:        [base_object_traits, manipulatable, constrainable, effort_aw…│</tspan>
      <tspan x="0" y="1416">│                                                                              │</tspan>
      <tspan x="0" y="1436">│── Lineage &amp; Traceability Radar ──                                            │</tspan>
      <tspan x="0" y="1456">│  Goal:          (none)                                                       │</tspan>
      <tspan x="0" y="1476">│  Milestone:     (none)                                                       │</tspan>
      <tspan x="0" y="1496">│  Requirement:   (none)                                                       │</tspan>
      <tspan x="0" y="1516">│  Priority Plan: (none)                                                       │</tspan>
      <tspan x="0" y="1536">│  Lineage Intact: <tspan fill="#f9e2af" font-weight="bold">[⚠️  WARN]</tspan>                                                  │</tspan>
      <tspan x="0" y="1556">│                                                                              │</tspan>
      <tspan x="0" y="1576">│Available Actions: [transition_status, claim, edit_properties]                │</tspan>
      <tspan x="0" y="1596">╰──────────────────────────────────────────────────────────────────────────────╯</tspan>
      <tspan x="0" y="1616"></tspan>
      <tspan x="0" y="1636"></tspan>
      <tspan x="0" y="1656"><tspan font-weight="bold">[SCENE 3: LIVE POLICY RULE STUDIO &amp; DSL EVALUATION ENGINE]</tspan></tspan>
      <tspan x="0" y="1676">  Validating active backlog items against kernel policy rules in real time:</tspan>
      <tspan x="0" y="1696"></tspan>
      <tspan x="0" y="1716"><tspan opacity="0.65">... [terminal session output truncated for screenshot] ...</tspan></tspan>
    </text>
  </g>
</svg>