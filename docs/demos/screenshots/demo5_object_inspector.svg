      <tspan x="0" y="1516">│  Priority Plan: PRI-1790035722018347000-e89c3fb2                             │</tspan>
      <tspan x="0" y="1536">│  Lineage Intact: <tspan fill="#a6e3a1" font-weight="bold">[✓ PASS]</tspan>                                                    │</tspan>
      <tspan x="0" y="1556">│                                                                              │</tspan>
      <tspan x="0" y="1576">│── Acceptance Criteria (1 total, 1 satisfied, 0 pending) ──                   │</tspan>
