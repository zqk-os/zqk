      <tspan x="0" y="756"></tspan>
      <tspan x="0" y="776">⚠️  Sensitive fields (credential_hash, salt) are never displayed</tspan>
      <tspan x="0" y="796"></tspan>
      <tspan x="0" y="816"><tspan font-weight="bold">[SCENE 3: SPAWNING ACTIVE BACKGROUND PROCESS &amp; HOLDING LOCK]</tspan></tspan>
      <tspan x="0" y="836">Ambient daemon is already running (PID: 52049)</tspan>
      <tspan x="0" y="856">  Active kernel host process running with <tspan font-weight="bold">PID 52387</tspan></tspan>
      <tspan x="0" y="876">  Active write lock acquired: <tspan fill="#94e2d5">.zqk/mutation.lock</tspan></tspan>
      <tspan x="0" y="896"></tspan>
      <tspan x="0" y="916"><tspan font-weight="bold">[SCENE 4: EXECUTING CATASTROPHIC KILL -9 (SIGKILL)]</tspan></tspan>
      <tspan x="0" y="936">  <tspan fill="#f38ba8">&gt;&gt; Executing: kill -9 52387 &lt;&lt;</tspan></tspan>
      <tspan x="0" y="956">  <tspan fill="#a6e3a1">✔ Host process terminated abruptly (SIGKILL). Workspace left with abandoned lock.</tspan></tspan>
      <tspan x="0" y="976"></tspan>
      <tspan x="0" y="996">/Users/lanceettl/zqk-public-candidate/scripts/demos/time_travel_demo.sh: line 93: 52387 Killed: 9               sleep 100</tspan>
      <tspan x="0" y="1016"><tspan font-weight="bold">[SCENE 5: AUTONOMOUS KERNEL SELF-REMEDY &amp; CAS RECONSTRUCTION]</tspan></tspan>
