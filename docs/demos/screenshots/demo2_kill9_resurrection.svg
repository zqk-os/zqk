  <g transform="translate(24, 62)">
    <text class="term-text">
      <tspan x="0" y="16"><tspan font-weight="bold">===========================================================================</tspan></tspan>
      <tspan x="0" y="36"><tspan fill="#94e2d5">  ZQK DEMO 2: THE &quot;KILL -9&quot; RESURRECTION &amp; TRANSACTIONAL INTEGRITY         </tspan></tspan>
      <tspan x="0" y="56"><tspan font-weight="bold">===========================================================================</tspan></tspan>
      <tspan x="0" y="76">  <tspan fill="#f9e2af" font-weight="bold">Thesis:</tspan> Agents manage the work. ZQK enforces the physics.</tspan>
      <tspan x="0" y="96">  Most autonomous agents keep state in volatile memory. When killed, context dies.</tspan>
      <tspan x="0" y="116">  ZQK treats agent state as a durable, transaction-isolated cellular microkernel.</tspan>
      <tspan x="0" y="136"><tspan font-weight="bold">===========================================================================</tspan></tspan>
      <tspan x="0" y="156"></tspan>
      <tspan x="0" y="176"><tspan font-weight="bold">[SCENE 1: INITIALIZING RESILIENT WORKSPACE]</tspan></tspan>
      <tspan x="0" y="196">  Creating isolated workspace: <tspan fill="#94e2d5">/tmp/zqk-kill9-demo-TWDbF9</tspan></tspan>
      <tspan x="0" y="216"></tspan>
      <tspan x="0" y="236"></tspan>
      <tspan x="0" y="256"><tspan font-weight="bold">[SCENE 2: COMMITTING WORKFLOW STATE TO CELLULAR CAS]</tspan></tspan>
      <tspan x="0" y="276">  Minting recovery strategy question and issuing cryptographic seat credentials:</tspan>
      <tspan x="0" y="296">  $ <tspan font-weight="bold">zqk new object question --title &quot;Resilience: WAL Replay vs Snapshot Restore&quot;</tspan></tspan>
      <tspan x="0" y="316">  $ <tspan font-weight="bold">zqk keystore issue --account-id ACC-RECOVERY-01 --title &quot;Settlement-Daemon&quot;</tspan></tspan>
      <tspan x="0" y="336"></tspan>
      <tspan x="0" y="356"><tspan fill="#a6e3a1">✓</tspan> Object <tspan fill="#94e2d5">QUE-1790649483741343000-fbbbedac</tspan> created successfully</tspan>
      <tspan x="0" y="376">✅ API key issued (plaintext shown once)</tspan>
      <tspan x="0" y="396"></tspan>
      <tspan x="0" y="416">Key ID:       KEY-1790649484319882000-8e77b316</tspan>
      <tspan x="0" y="436">Account:      ACC-RECOVERY-01</tspan>
      <tspan x="0" y="456">Fingerprint:  sha256:7701573a47a4d5ec7d2bc408d1c1caee587531dabde9dc7c8886f53de3169a53</tspan>
      <tspan x="0" y="476">Credential:   zqk_ak_9152133ae1962b7412c18e0364a0fbcb00dbead9470b412a</tspan>
      <tspan x="0" y="496">Seating file: /tmp/zqk-kill9-demo-TWDbF9/.zqk/seating/credentials/ACC-RECOVERY-01</tspan>
      <tspan x="0" y="516"></tspan>
      <tspan x="0" y="536">Export for this seat:</tspan>
      <tspan x="0" y="556">  export ZQK_API_KEY=zqk_ak_9152133ae1962b7412c18e0364a0fbcb00dbead9470b412a</tspan>
      <tspan x="0" y="576"></tspan>
      <tspan x="0" y="596">  Verifying durable state before simulated crash:</tspan>
      <tspan x="0" y="616">Found 1 keystore entry:</tspan>
      <tspan x="0" y="636"></tspan>
