      <tspan x="0" y="1636"><tspan font-weight="bold">│</tspan><tspan font-weight="bold"> Draft Plane: Preliminary Objects That Have Not Crossed the CAS Membrane                          </tspan><tspan font-weight="bold">│</tspan></tspan>
      <tspan x="0" y="1656"><tspan font-weight="bold">├</tspan><tspan font-weight="bold">────────────────────────────────</tspan><tspan font-weight="bold">┬</tspan><tspan font-weight="bold">─────────────────</tspan><tspan font-weight="bold">┬</tspan><tspan font-weight="bold">───────────────────────────────────────────────</tspan><tspan font-weight="bold">┤</tspan></tspan>
      <tspan x="0" y="1676"><tspan font-weight="bold">│</tspan><tspan font-weight="bold"> KIND                           </tspan><tspan font-weight="bold">│</tspan><tspan font-weight="bold"> OBJECTS         </tspan><tspan font-weight="bold">│</tspan><tspan font-weight="bold"> SAMPLE OBJECT IDS                             </tspan><tspan font-weight="bold">│</tspan></tspan>
      <tspan x="0" y="1696"><tspan font-weight="bold">├</tspan><tspan font-weight="bold">────────────────────────────────</tspan><tspan font-weight="bold">┼</tspan><tspan font-weight="bold">─────────────────</tspan><tspan font-weight="bold">┼</tspan><tspan font-weight="bold">───────────────────────────────────────────────</tspan><tspan font-weight="bold">┤</tspan></tspan>
