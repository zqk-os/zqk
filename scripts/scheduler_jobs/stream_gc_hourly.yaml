id: SCH-stream-gc-hourly
title: Telemetry Stream GC (Hourly)
description: |
  Runs `zqk system stream-gc` to prune orphaned JSONL stream segment files from .zqk/streams/
  This prevents disk explosion and file descriptor exhaustion from old telemetry files.
job_type: run_wrapper
trigger_type: timer
schedule_expression: "0 * * * *"
category: maintenance
execution_mode: reusable
max_runtime_seconds: 3600
enabled: true
status: active
namespace_id: zqk:kernel
schema_version: "2.0.0"
command: /bin/sh
command_args:
  - "-c"
  - |
    set -euo pipefail
    ROOT="${ZQK_PROJECT_ROOT:-.}"
    cd "$ROOT"
    BIN="${ZQK_BIN:-zqk}"
    exec "$BIN" system stream-gc
