# One-time job: creates onboarding curriculum via declarative ZQL transaction in scripts/onboarding_roadmap/onboarding_seed.zql.
# Create: zqk new object scheduler_job --file scripts/scheduler_jobs/onboarding_roadmap_seed.yaml --promote
# Then start the scheduler; the job runs immediately (trigger_type: immediate, execution_mode: one_time).
# Alternatively: zqk scheduler trigger <job-id> after creating the job.
title: Onboarding Roadmap Seed
description: |
  Seeds the complete ontological onboarding chain (Goal, Priority Plan, Workstream, Criteria,
  Requirement, Test Cases, Milestone, and Backlog Items) using an atomic ACID ZQL mutation transaction.
job_type: run_wrapper
trigger_type: immediate
category: system
execution_mode: one_time
max_runtime_seconds: 120
enabled: true
status: active
namespace_id: zqk:kernel
schema_version: "2.0.0"
command: /bin/sh
command_args:
  - "-c"
  - |
    set -euo pipefail
    ROOT="${ZQK_PROJECT_ROOT:-.}"
    cd "$ROOT"
    BIN="${ZQK_BIN:-zqk}"
    exec "$BIN" object mutate --file scripts/onboarding_roadmap/onboarding_seed.zql
