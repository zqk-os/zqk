# Cache pre-warm job (SCH-cache-prewarm). Used by: zqk system ensure-retention-jobs
# Primary job for pre-warming path alias, spec, lifecycle, field registry, object ID cache, etc.
# Create manually: zqk object create scheduler_job --file scripts/scheduler_jobs/cache_prewarm.yaml
id: SCH-cache-prewarm
title: Cache Pre-Warm
description: |
  Pre-warms path alias, spec, lifecycle, field registry, object ID cache, validation state, and reverse-reference index.
  Triggered at daemon start and on schedule. Builds object-id-cache so system check and CLI stay fast.
job_type: cache_prewarm
trigger_type: timer
schedule_expression: "*/10 * * * *"
category: maintenance
execution_mode: reusable
max_runtime_seconds: 3600
enabled: true
status: active
namespace_id: zqk:kernel
schema_version: "2.0.0"
