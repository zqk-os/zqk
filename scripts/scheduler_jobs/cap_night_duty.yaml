id: SCH-cap-night-duty
kind: scheduler_job
schema_version: "2.0.0"
status: active
title: CAP Night Duty (Fallback Integrity Wrapper)
description: |
  Lightweight fallback maintenance wrapper running 'zqk system check --fast' for off-hours
  or degraded environments.
  NOTE: Distinct from SCH-cap-orchestrator (which drives the full in-process CAP multi-agent loop).
  Kept disabled by default; enable only if standalone shell-level integrity sweeps are desired.
job_type: run_wrapper
trigger_type: timer
schedule_expression: "*/15 * * * *"
execution_mode: reusable
category: maintenance
priority: normal
enabled: false
log_level: default
namespace_id: zqk:kernel
command: /bin/sh
command_args:
  - "-c"
  - |
    BIN="${ZQK_BIN:-zqk}"
    exec "$BIN" system check --fast
