# Convergence orchestrate: convergence measure --persist-session, then cvs_outcome_rollup.py --apply.
# Same as ./scripts/cvs_convergence_orchestrate.sh <CVS-id> --no-fail-on-gates (timer runs use --no-fail-on-gates
# so matrix-only blockers do not fail the job; tighten locally when desired).
#
# schedule_expression is data on this job, not duplicated in description (changing cron does not require
# editing description). Example catch-up: */15 * * * *; relaxed: 0 */6 * * * — set via object update.
#
# Create (first time):
#   zqk object create scheduler_job --file scripts/scheduler_jobs/convergence_orchestrate.yaml --keep-file
# If the id already exists:
#   zqk object create scheduler_job --file scripts/scheduler_jobs/convergence_orchestrate.yaml --keep-file --force
# Point at a different CVS:
#   zqk object update SCH-convergence-orchestrate --field "environment_variables=CONVERGENCE_SESSION_ID=<id>,ZQK_PROJECT_ROOT=..."
#   # or merge env via object update / bulk as your workflow prefers
#
# Manual run (after enabling): zqk scheduler trigger SCH-convergence-orchestrate
# See: docs/architecture/CONVERGENCE_ORCHESTRATION_AND_NESTED_CVS.md (Appendix E)
# Related: scripts/README.md — "Convergence promotion and overseer helpers" (optional gate / overseer audit; different contract from full orchestrate).

kind: scheduler_job
schema_version: "2.0.0"
id: SCH-convergence-orchestrate
title: Convergence — orchestrate (persist + rollup)
description: |
  Timer run_wrapper for ./scripts/cvs_convergence_orchestrate.sh: persist test-bundle convergence to the
  CVS in CONVERGENCE_SESSION_ID, then Python cvs_outcome_rollup.py --apply with --no-fail-on-gates.
  Cron cadence is schedule_expression on this job. Set CONVERGENCE_SESSION_ID (and ZQK_PROJECT_ROOT if
  needed) before enabling. Disabled by default until you enable the job.
job_type: run_wrapper
trigger_type: timer
schedule_expression: "*/15 * * * *"
category: maintenance
execution_mode: reusable
max_runtime_seconds: 3600
enabled: false
status: active
namespace_id: zqk:kernel
command: /bin/sh
command_args:
  - "-c"
  - |
    set -euo pipefail
    ROOT="${ZQK_PROJECT_ROOT:-.}"
    cd "$ROOT"
    ID="${CONVERGENCE_SESSION_ID:?set CONVERGENCE_SESSION_ID on the scheduler_job}"
    exec ./scripts/cvs_convergence_orchestrate.sh "$ID" --no-fail-on-gates
environment_variables:
  # Set to your active CVS-* before enabling (zqk object update … --field 'environment_variables={"CONVERGENCE_SESSION_ID":"CVS-…"}').
  CONVERGENCE_SESSION_ID: ""
