# Regenerate docs/quality/TEST_BUNDLE_MATRIX.csv from saved bundles + health.jsonl.
#
# Optional timer-driven visibility: keeps the matrix aligned with .zqk/test-bundles and
# latest scheduler outcomes without manual runs. Adjust schedule_expression as needed.
#
# Create / update via:
#   zqk object create scheduler_job --file scripts/scheduler_jobs/test_bundle_matrix_regen_daily.yaml
#   # or merge into your maintenance bundle per project practice
#
# Requires: `zqk` on PATH or set ZQK_BIN; python3 only if you switch back to
#   scripts/test_bundle_matrix_pipeline.py for scan/wait orchestration.

id: SCH-test-bundle-matrix-regen
title: Quality - Test Bundle Matrix Regen (Daily)
description: |
  Runs `zqk system test-bundle-matrix` to refresh TEST_BUNDLE_MATRIX.csv
  and verify outcomes (saved bundles under .zqk/test-bundles joined to health.jsonl).
  Boundary sensor for test-bundle traceability (BLI-1775193496979695000-10b9795d).
job_type: run_wrapper
trigger_type: timer
schedule_expression: "15 6 * * *"
category: maintenance
execution_mode: reusable
max_runtime_seconds: 300
enabled: false
status: active
namespace_id: zqk:kernel
schema_version: "2.0.0"
command: /bin/sh
command_args:
  - "-c"
  - |
    set -e
    ROOT="${ZQK_PROJECT_ROOT:-.}"
    cd "$ROOT"
    ZQK="${ZQK_BIN:-zqk}"
    "$ZQK" system test-bundle-matrix
