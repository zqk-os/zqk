# Pre-commit integrity: runs scripts/pre-commit-integrity.sh on a timer;
# writes .zqk/pre-commit/.last-integrity.json. Callback runs when triggered with --pre-commit.
#
# Optional source-code pack — not in community required_jobs.
# Mint only when scripts/pre-commit-integrity.sh exists. See docs/howto/SCHEDULER_AND_MAINTENANCE.md
# See: docs/architecture/PRE_COMMIT_BACKGROUND_RESULTS.md

id: SCH-pre-commit-integrity
kind: scheduler_job
schema_version: "2.0.0"
status: active
job_type: run_wrapper
trigger_type: timer
schedule_expression: "0 */2 * * *"
category: maintenance
execution_mode: reusable
max_runtime_seconds: 1320
enabled: true
callback_type: command
callback_on_completion: zqk pre-commit write-result-from-last --category=integrity
title: Pre-commit integrity (system check)
description: |
  Runs pre-commit-integrity.sh (writes .last-integrity.json). Callback runs only when triggered with --pre-commit.
command: ./scripts/pre-commit-integrity.sh
namespace_id: zqk:kernel
