# Hourly autofix batch cleanup job (process-data-cli-only: create/update via CLI).
# Create: zqk object create scheduler_job --file scripts/scheduler_jobs/autofix_batch_cleanup_hourly.yaml
# Update: zqk object update <job-id> --field "schedule_expression=0 * * * *"
# Trigger once: zqk scheduler trigger <job-id>
# See: docs/scheduler/SCHEDULER_JOB_POLICY_AND_LIFECYCLE.md
kind: scheduler_job
schema_version: "2.0.0"
id: SCH-autofix-batch-cleanup
title: Autofix batch cleanup (every 30m)
description: Cleans up processed FIXED_/PROCESSED_ autofix batch files and removes unprocessed AUTOFIX-*.json older than AUTOFIX_BATCH_MAX_AGE_HOURS (default 24). Tighter schedule avoids piling up.
status: active
job_type: autofix_batch_cleanup
trigger_type: timer
schedule_expression: "*/30 * * * *"
execution_mode: reusable
enabled: true
category: maintenance
# Optional: keep unprocessed batch files for 1 hour (default). Set to 0 to remove all unprocessed immediately.
environment_variables:
  AUTOFIX_BATCH_MAX_AGE_HOURS: "1"
created_at: "2026-02-17T00:00:00Z"
updated_at: "2026-02-17T00:00:00Z"
created_by: account:system
updated_by: account:system
origin_project: zqk
origin_system: zqk
