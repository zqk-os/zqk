# Hourly convergence_session_tick for data-cell program CVS (PRI CLI alpha readiness lane).
# Same handler contract as SCH-cvs-pipeline-tick; fixed CONVERGENCE_SESSION_ID (lifecycle auto-repoint
# in pkg/scheduler/cvs_pipeline_tick_sync.go applies only to SCH-cvs-pipeline-tick).
#
# Schedule offset from SCH-cvs-pipeline-tick (minute 5) to reduce concurrent tick load.
#
# Ensure via .zqk/specs/configs/scheduler_maintenance_config.yaml → daemon ensure / zqk object create.
# Default template disabled (ghost-tick hygiene): do not resurrect SCH-cvs-datacell-tick via ensure-retention
# until intentionally re-enabled. Live job kept enabled=false.

kind: scheduler_job
schema_version: "2.0.0"
id: SCH-cvs-datacell-tick
title: Convergence — test-bundle health tick (data-cell CVS)
description: |
  Reads .zqk/logs/scheduler/cvs/test-bundles/health.jsonl and updates CVS-1776080007703030000-a726d525
  when the health watermark advances (same payload as zqk scheduler convergence measure --session-id).
  Pair with SCH-cvs-pipeline-tick (tutorial CVS); scan-tests populate health.jsonl.
job_type: convergence_session_tick
trigger_type: timer
schedule_expression: "20 * * * *"
category: maintenance
execution_mode: reusable
max_runtime_seconds: 300
enabled: false
status: pending
namespace_id: zqk:kernel
environment_variables:
  CONVERGENCE_SESSION_ID: CVS-1776080007703030000-a726d525
  PIPELINE_TICK_AUTO_REPOINT: "false"
  HEALTH_LIMIT: "500"
  HEALTH_FILE_MISSING: skip
  HEALTH_FILE_MISSING_SKIP_BUDGET: "0"
  CONVERGENCE_TICK_ROLLUP: "1"
created_at: "2026-04-21T18:45:00Z"
updated_at: "2026-04-21T18:45:00Z"
created_by: account:system
updated_by: account:system
origin_project: zqk
origin_system: zqk
