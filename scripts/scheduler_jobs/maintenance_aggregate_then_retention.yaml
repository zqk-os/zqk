# LEGACY: Prefer a single scheduler job with job_type: maintenance (maintenance WAL).
# See docs/architecture/MAINTENANCE_WAL_AND_RUNNER.md. Create a job with job_type: maintenance
# and your desired schedule; the runner guarantees aggregate-then-retention order.
#
# This run_wrapper is kept for environments that have not yet switched to the maintenance WAL.
# Combined maintenance: run aggregate-audit first, then retention-tolerance.
# Create via: zqk object create scheduler_job --file scripts/scheduler_jobs/maintenance_aggregate_then_retention.yaml
#
# Optionally run more frequently (e.g. "0 * * * *" hourly) if event volume is high.
# Ensure ZQK_BIN or PATH is set so "zqk" resolves (scheduler often sets ZQK_BIN).
title: Maintenance - Aggregate Audit Then Retention
description: |
  Runs aggregate-audit (compress audit events into metrics, delete/archive old events) then
  retention-tolerance (archive/cleanup other kinds). Coordination ensures retention_tolerance
  sees reduced audit_event volume and can enforce max_count/cleanup_after for all kinds.
job_type: run_wrapper
trigger_type: timer
schedule_expression: "0 5 * * *"
category: maintenance
execution_mode: reusable
max_runtime_seconds: 3600
enabled: true
status: active
namespace_id: zqk:kernel
schema_version: "2.0.0"
command: /bin/sh
command_args:
  - "-c"
  - |
    set -e
    ZQK="${ZQK_BIN:-zqk}"
    "$ZQK" system aggregate-audit --window 24h --delete
    "$ZQK" system retention-tolerance
