schema_version: 2.0.0
id: SCH-LEASE-SUPERVISION
kind: scheduler_job
title: Default Mesh Lease Supervision
status: enabled
job_type: mesh_lease_supervision
trigger_type: schedule
schedule: "@every 1m"
execution_mode: exclusive
category: system_maintenance
priority: medium
log_level: info
description: |
  Automatically monitors capacity_advertisement and zqk_session (federated_lease) objects to
  spawn and manage ambient compute processes (zqk-scheduler subprocesses) for the Sovereign Mesh.