id: SCH-retention-tolerance-agent-instruction
title: Retention Tolerance - agent_instruction (max_count)
description: |
  Dedicated retention_tolerance run for agent_instruction so max_count=500 is
  enforced without competing with the all-kinds catch-all (which hits
  max_runtime). KINDS=agent_instruction.
job_type: retention_tolerance
trigger_type: timer
schedule_expression: "15 * * * *"
category: maintenance
execution_mode: reusable
max_runtime_seconds: 1800
enabled: true
status: active
namespace_id: zqk:kernel
schema_version: "2.0.0"
environment_variables:
  KINDS: agent_instruction
  BATCH_SIZE: "5000"
  MAX_BATCHES: "-1"
