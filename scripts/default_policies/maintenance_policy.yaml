title: Maintenance Policy - System Behavior Toward Stated Goals
status: active
category: workflow
policy_type: standard
body: |
  State the maintenance goals that drive system behavior so the system evolves toward greater **efficiency**, **reliability**, **robustness**, and **observability**. Scheduler jobs, retention config, and ensure commands are the mechanisms.

  **Goals**
  - **Efficiency**: Internal object counts stay near configured targets (~3k total; per-kind max_count in retention_tolerance.yaml). Retention and aggregation jobs run on schedule.
  - **Reliability**: Correct job types and schedules present by default. Init can bootstrap via `--with-maintenance-jobs`; `zqk system ensure-retention-jobs` fixes missing or mis-typed jobs.
  - **Robustness**: Maintenance jobs use category maintenance and run without blocking user workflows. Failures are observable and correctable.
  - **Observability**: `zqk system retention-status` reports over-target kinds. A retention_drift reminder appears in system check output only when over target (reason_code retention_drift).

  **Bootstrap / ensure**
  - Ensure jobs: `zqk system ensure-retention-jobs`
  - Init with jobs: `zqk system init --with-maintenance-jobs`
  - Retention status: `zqk system retention-status`

  **Extended doc**: docs/observability/MAINTENANCE_POLICY.md
