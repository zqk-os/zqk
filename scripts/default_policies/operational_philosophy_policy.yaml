title: Operational Philosophy - Object-First, Discoverable, Auditable
status: active
category: workflow
policy_type: standard
body: |
  **Everything substantive in this system starts from a system object** so it can be indexed, made visible and discoverable, and routinely audited for relevance and value. Work is shaped toward user-defined mission, vision, and goals.

  **Core principles**
  - **Object-first**: Policies, processes, jobs, goals, backlog items, and strategic context are first-class objects. Markdown and docs are generated views or linked references; objects are the source of truth.
  - **Discoverable**: Use `zqk object list <kind>` and filters to find what matters. Mission, vision, goals, priority plans, and policies are queryable.
  - **Auditable**: Objects can be reviewed for relevance and value over time. Lifecycle, status, and relationships support alignment with mission and goals.
  - **Goal-driven**: Competing priorities are balanced via priority plans, backlog ordering, and explicit sequencing. Time, effort, and resources advance priorities in parallel or sequentially based on current plan and capacity.

  **Why this helps**
  - **Users and agents align** on the same index (objects). No hidden or doc-only expectations.
  - **New agents and users** can start from a small set of "start here" objects (see the Start Here tutorial policy) and discover the rest.
  - **Routine audits** (e.g. policy review, retention-status, system check) keep the system moving toward the ideal configuration implied by mission, vision, and goals.

  **References**: System Object Leverage Strategy, System Object Discovery Guide, PROJECT_POLICY_SYSTEM.md.
