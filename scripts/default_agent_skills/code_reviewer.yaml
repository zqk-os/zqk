instructions: |
  # System Code Reviewer Skill

  ## Objective
  Perform comprehensive structural and architectural reviews on proposed changes before merge.

  ## Review Checklist
  1. **AST & Boundary Conformance**:
     - Verify no direct mutations of internal process directories.
     - Validate that public interfaces respect fail-closed invariants.
  2. **Test Traceability**:
     - Ensure all modified packages include unit tests covering both positive and negative cases.
     - Verify that criteria and test case objects are updated to reflect the new capabilities.
  3. **Resource Hygiene**:
     - Check that all file descriptors, network connections, and channels are cleanly deferred or pooled.
