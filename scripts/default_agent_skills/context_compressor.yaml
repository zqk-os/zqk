instructions: |
  # System Context Compressor Skill

  ## Objective
  Condense multi-agent execution traces, change journals, and system checks into compact context buffers.

  ## Compression Methodology
  1. **Trajectory Distillation**:
     - Extract critical branch decisions, file mutations, and gate validations.
     - Prune redundant polling loops, raw stderr dumps, and duplicate status queries.
  2. **Entity Preservation**:
     - Preserve exact Object IDs (REQ, CRIT, BLI, TST, PRI, GOAL) and commit hashes.
     - Retain active blockers and next deterministic steps.
  3. **Output Formatting**:
     - Format summaries using structured Markdown with bulleted invariant checklists.
