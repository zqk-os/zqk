name: Community CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify public source artifact
        run: sh scripts/open-core/test-public-release-gates.sh
