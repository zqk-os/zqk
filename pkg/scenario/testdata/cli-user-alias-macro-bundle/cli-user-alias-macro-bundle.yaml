# Traceability bundle: CLI-scoped user aliases / macros (shell-like shortcuts without hijacking top-level commands).
# Tracked under pkg/scenario/testdata/ (same pattern as convergence-lifecycle-bundle, process-hygiene-config-traceability-bundle).
#
# Apply from repo root when ready (separate binary):
#   zqk-scenario bundle apply -f pkg/scenario/testdata/cli-user-alias-macro-bundle/cli-user-alias-macro-bundle.yaml -R .
#
# Replace *-UAM-* id_hints with a project-specific prefix if applying where collisions matter.
# Requirement is linked to priority plan PRI-1234567890123456789-abcdef12 ("Agent workflow & unified next-step CLI").
#
# Design intent (summary): config in ~/.zqk/config.yaml + .zqk/config.yaml merge; named entries mapping to
# argv templates, optional external scripts, or pipes to go-based tools; dispatcher command (e.g. zqk do <alias>)
# so users/agents define workflows without one hard-coded test command; optional allowlist for security.
api_version: v1
kind: scenario_bundle
metadata:
  name: cli-user-alias-macro-bundle
  description: |
    Persistent requirements for per-user CLI aliases/macros: configurable shortcuts, project + user config merge,
    delegation to scripts or Go utilities, and discoverability—scoped to zqk so CI/agents/shells share one behavior.
objects:
  goals:
    - id_hint: GOAL-UAM-001
      title: CLI users define repeatable workflows without forked shell-only knowledge
      status: active
      authority: owner
      target: "1"
  criteria:
    - id_hint: CRIT-UAM-001
      title: Alias schema supports named entries, merge order (user vs project), and argv or script targets
      category: functional
      validation_method: code_review
      requirement_ref: REQ-UAM-001
      description: |
        Config documents alias names, expansion (argv list, optional working_dir/env), and merge precedence
        consistent with internal/cli context layering.
    - id_hint: CRIT-UAM-002
      title: Dispatcher subcommand resolves alias, expands placeholders, executes without stealing built-in command names
      category: functional
      validation_method: code_review
      requirement_ref: REQ-UAM-001
      description: |
        A dedicated entry (e.g. zqk do / zqk run) lists aliases in help; expansion does not replace core subcommands.
    - id_hint: CRIT-UAM-003
      title: Optional safety policy (allowlist roots, no shell injection by default)
      category: non-functional
      validation_method: manual_check
      requirement_ref: REQ-UAM-001
      description: |
        Documented defaults favor project-relative scripts or explicit argv; unrestricted sh -c is opt-in with warning.
    - id_hint: CRIT-UAM-004
      title: Traceability to existing config and command-spec patterns
      category: compliance
      validation_method: code_review
      requirement_ref: REQ-UAM-001
      description: |
        Aligns with zqk-settings / brand config layering, AGENT_GUIDELINES for output, and PRE_CHANGE_CHECKLIST for CLI changes.
  requirements:
    - id_hint: REQ-UAM-001
      title: User-configurable CLI aliases and macro dispatcher (project + user workflows)
      status: proposed
      priority: p2
      priority_plan_ref: PRI-1234567890123456789-abcdef12
      goal_refs: [GOAL-UAM-001]
      criteria_refs:
        - CRIT-UAM-001
        - CRIT-UAM-002
        - CRIT-UAM-003
        - CRIT-UAM-004
      body: |
        Deliver shell-like aliases scoped to the zqk CLI: each user (and each project) can define short names that expand
        to argv templates, invoke external scripts, or pipe to existing Go-based utilities—without encoding one workflow
        (e.g. test-runner only) as the only blessed path.

        Layers: (1) Config schema in user + project YAML with merge rules. (2) Dispatcher command that resolves alias
        names, expands placeholders ({project_root}, args), runs subprocess with logging policy compliance. (3) Optional
        allowlist and documentation for safe defaults. (4) Integration with existing infrastructure: ~/.zqk/config.yaml,
        .zqk/config.yaml, profiles—so agents and humans share discoverable shortcuts.

        Deferred from active CVS work: too large to split mid-session; tracked here for PRI-1234567890123456789-abcdef12.
  backlog_items:
    - id_hint: BLI-UAM-001
      title: Design + implement CLI alias config (merge), dispatcher command, and docs
      status: exploring
      requirement_refs: [REQ-UAM-001]
      criteria_refs: [CRIT-UAM-001, CRIT-UAM-002, CRIT-UAM-003]
